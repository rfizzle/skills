        ])

    ], { gap: 100, main: true, hidden: true, padOver: { l: 0, r: 0, t: 0, b: 0 } }),
    K('services', 'acct', 'Services', 'row', [
      N('iam', ['IAM / STS'], 'iam', C.identity, 'Identity and token service. Decides who a set of credentials belongs to.'),
      N('s3', ['S3 bucket', 'customer-exports'], 'bucket', C.text, 'Bucket of customer data exports.'),
      N('secrets', ['Secrets', 'Manager'], 'lock', C.text, 'Holds the Orders DB password.'),

var PHASES = [
  { id: 'initial', title: 'Initial access' },
  { id: 'cred',    title: 'Credential access' },
  { id: 'disc',    title: 'Discovery & exfiltration' },
  { id: 'lateral', title: 'Lateral movement' },
  { id: 'detect',  title: 'Detection & controls' }
];

/* frame: 'full', or a rule returning the bounds to show (diagram units); the camera adds aspect ratio around them.

var STEPS = [
  { id: 'recon', phase: 'initial', color: C.accent, title: 'A normal request comes in',
    body: 'First, the attacker behaves like a shopper. The request passes the firewall and load balancer and reaches the storefront. This is the legitimate path the attack will reuse.',
    callouts: [{ target: 'cdn', text: 'Firewall inspects traffic', side: 'down', at: 3.0 }],
    touch: ['attacker', 'cdn', 'lb', 'storefront'], edges: ['att_cdn', 'cdn_lb', 'lb_store'], frame: 'full' },
  { id: 'ssrf', phase: 'initial', color: C.danger, title: 'Crafted URL tricks the storefront',
    body: 'The attacker puts an internal address in a URL parameter. The storefront fetches it on their behalf, so the request starts inside the network, where firewalls never look.',
    callouts: [],
    touch: ['attacker', 'cdn', 'lb', 'storefront', 'imds'], edges: ['att_cdn', 'cdn_lb', 'lb_store', 'store_imds'], frame: 'full' },
  { id: 'creds', phase: 'cred', color: C.token, title: 'Metadata service hands over keys',
    body: 'The metadata service answers any request from the node, trusting it blindly. It returns temporary keys for the node’s cloud role, and they flow back out to the attacker.',
    callouts: [],
    touch: ['attacker', 'cdn', 'lb', 'storefront', 'imds'], edges: ['att_cdn', 'cdn_lb', 'lb_store', 'store_imds'], frame: 'full',
    lead: { rule: 'cluster' } },
  { id: 'identity', phase: 'cred', color: C.danger, title: 'Attacker logs in with stolen keys',
    body: 'The attacker calls the account’s identity service directly from the Internet. This traffic never touches the firewall, load balancer or network, so none of those defences can see it.',
    callouts: [],
    touch: ['attacker', 'iam'], edges: ['byp_iam'], frame: { rule: 'svc' }, proxy: ['byp_iam'] },
  { id: 'enumerate', phase: 'disc', color: C.danger, title: 'Mapping what the keys unlock',
    body: 'With valid keys, the attacker lists the storage buckets and the stored secrets, one after the other. Every call looks like normal, authorised activity.',
    callouts: [],
    touch: ['attacker', 's3', 'secrets'], edges: ['byp_s3', 'byp_sec'], frame: { rule: 'svc' }, proxy: ['byp_s3', 'byp_sec'] },
  { id: 'exfil', phase: 'disc', color: C.danger, title: 'Customer data streams out',
    body: 'The node role can read the export bucket, so objects stream straight to the attacker. Nothing on the path inspects or limits this download.',
    callouts: [],
    touch: ['attacker', 's3'], edges: ['byp_s3'], frame: { rule: 'svc' }, proxy: ['byp_s3'] },
  { id: 'secret', phase: 'disc', color: C.token, title: 'Database password taken',
    body: 'Secrets Manager hands the database password to anyone holding the role. The attacker now has what they need to reach the orders data.',
    callouts: [],
    touch: ['attacker', 'secrets'], edges: ['byp_sec'], frame: { rule: 'svc' }, proxy: ['byp_sec'] },
  { id: 'pivot', phase: 'lateral', color: C.danger, title: 'Back in, then sideways',
    body: 'Through the same SSRF the attacker returns to the storefront, then moves to the payments service next door. No network policy blocks traffic between namespaces.',
    callouts: [],
    touch: ['attacker', 'cdn', 'lb', 'storefront', 'payments'], edges: ['att_cdn', 'cdn_lb', 'lb_store', 'store_pay'], frame: 'full' },
  { id: 'db', phase: 'lateral', color: C.danger, title: 'Orders database read in full',
    body: 'Payments connects to the database using the stolen password, and customer order rows flow back out along the same route to the attacker.',
    callouts: [],
    touch: ['attacker', 'cdn', 'lb', 'storefront', 'payments', 'db'], edges: ['att_cdn', 'cdn_lb', 'lb_store', 'store_pay', 'pay_db'], frame: 'full' },
  { id: 'detect', phase: 'detect', color: C.secure, title: 'Detection fires, too late',
    body: 'GuardDuty notices the keys being used from outside the account and raises a finding. By now, most of the chain has already happened.',
    callouts: [],
    touch: ['detect', 'iam', 's3', 'secrets'], edges: ['log_iam', 'log_s3', 'log_sec'], frame: 'full',
    lead: { rule: 'svc' } },
  { id: 'controls', phase: 'detect', color: C.secure, title: 'Where controls would have cut it',
    body: 'Each shield marks a link where one control breaks the chain. Fix the earliest and everything after it never happens, which is why prevention beats detection.',
    callouts: [], touch: [], edges: [], frame: 'full', all: true }

/* controls shown in the last step: edge + point on it + label placement */
var SHIELDS = [
  { n: '2',   edge: 'att_cdn',    seg: 0, t: 0.50, label: 'WAF rule',               at: [300, 196] },
  { n: '2/3', edge: 'store_imds', seg: 1, t: 0.50, label: 'IMDSv2 hop limit',       at: [2330, 664] },
  { n: '5',   edge: 'byp_sec',    seg: 1, t: 0.50, label: 'Least-privilege role',   side: 'up' },
  { n: '6',   edge: 'byp_s3',     seg: 1, t: 0.12, label: 'Bucket policy\n+ endpoint', at: [232, 800] },
  { n: '8',   edge: 'store_pay',  seg: 0, t: 0.50, label: 'Network policy',         at: [1790, 664] }
];
/* the order in which the finished attack is traced in step 11 */
var TRACE = ['att_cdn', 'cdn_lb', 'lb_store', 'store_imds', 'byp_iam', 'byp_s3', 'byp_sec', 'store_pay', 'pay_db'];

/* ---- layout: bottom-up measure, top-down place. Rows align children on their "anchor" line (the main flow). ---- */
function textW(label, fs, caps) { return label.length * fs * (caps ? 0.68 : 0.56); }

function measure(b) {
  if (b.type === 'node') { b.w = NW; b.h = NH; b.a = NH / 2; return; }
  var p = b.pad = { l: PAD, r: PAD, t: b.label ? TOPPAD : 0, b: PAD };
  if (b.padOver) for (var k in b.padOver) p[k] = b.padOver[k];
  b.kids.forEach(measure);
  var cw = 0, ch = 0, a;
  if (b.dir === 'row') {
    var A = 0;
    b.kids.forEach(function (c) { A = Math.max(A, c.a); });
    b.kids.forEach(function (c, i) {
      if (i) cw += (c.gapBefore != null ? c.gapBefore : b.gap);
      c.rx = cw; c.ry = A - c.a + (c.dy || 0); cw += c.w; ch = Math.max(ch, c.ry + c.h);

  } else {
    var main = null;
    b.kids.forEach(function (c, i) {

      c.ry = ch; c.rx = c.dx || 0; ch += c.h; cw = Math.max(cw, c.rx + c.w);

function place(b, x, y, B, depth, parent) {

/* ---- edges: orthogonal waypoints through the gaps. The first/last points sit inside the nodes (hidden). ---- */

  var TRb = B.acctTop.y + B.acctTop.h;                       /* bottom of the Edge/VPC row */
  var LA = [TRb + 50, TRb + 72, TRb + 94];                   /* bypass lanes in the corridor under the VPC: secrets, s3, iam */
  var iam = B.iam, s3 = B.s3, sec = B.secrets, D = B.detect;
  var dI = iam.x + iam.w - 36, dS = s3.x + s3.w - 36, dC = sec.x + sec.w - 36;
  var LY = B.ns_web.y + B.ns_web.h + 22;                     /* lane under the namespaces, inside the cluster */
  var E = {};
  function def(id, a, b, pts) { E[id] = { id: id, a: a, b: b, pts: pts }; }
  def('att_cdn', 'attacker', 'cdn', [[A.cx, Y], [B.cdn.cx, Y]]);
  def('cdn_lb', 'cdn', 'lb', [[B.cdn.cx, Y], [B.lb.cx, Y]]);
  def('lb_store', 'lb', 'storefront', [[B.lb.cx, Y], [sf.cx, Y]]);
  def('store_imds', 'storefront', 'imds', [[sf.cx, Y], [sf.cx, LY], [B.imds.x + 8, LY]]);
  def('store_pay', 'storefront', 'payments', [[sf.cx, Y], [B.payments.cx, Y]]);
  def('pay_db', 'payments', 'db', [[B.payments.cx, Y], [B.db.cx, Y]]);
  /* bypass: out of the bottom of the attacker, down past the account border, along the short corridor under the VPC */
  def('byp_iam', 'attacker', 'iam', [[A.cx - 60, Y], [A.cx - 60, LA[2]], [dI, LA[2]], [dI, iam.cy]]);
  def('byp_s3', 'attacker', 's3', [[A.cx, Y], [A.cx, LA[1]], [dS, LA[1]], [dS, s3.cy]]);
  def('byp_sec', 'attacker', 'secrets', [[A.cx + 60, Y], [A.cx + 60, LA[0]], [dC, LA[0]], [dC, sec.cy]]);

  var nb = iam.cy + NH / 2;
  def('log_iam', 'iam', 'detect', [[iam.cx, iam.cy], [iam.cx, nb + 46], [D.cx + 40, nb + 46], [D.cx + 40, D.cy]]);
  def('log_s3', 's3', 'detect', [[s3.cx, s3.cy], [s3.cx, nb + 22], [D.cx - 40, nb + 22], [D.cx - 40, D.cy]]);
  def('log_sec', 'secrets', 'detect', [[sec.cx, sec.cy], [D.cx, D.cy]]);
  Object.keys(E).forEach(function (id) { E[id].d = roundedPath(E[id].pts, 24); E[id].len = polyLen(E[id].pts); });
  return { E: E, lanes: LA };
}
function roundedPath(pts, r) {
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    var l1 = Math.abs(p1[0] - p0[0]) + Math.abs(p1[1] - p0[1]), l2 = Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1]);
    var rr = Math.min(r, l1 / 2, l2 / 2);
