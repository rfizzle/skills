<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>

<script>
/* ============================================================================================================
   PATTERN 10: CASCADE, a hierarchy read down (depends on) and up (what a failure costs)

   What it is: layers of things leadership cares about, from business outcomes at the top to the data and
   platforms at the bottom. Read downward it shows what each layer depends on; read upward from one node it shows
   what a failure there takes with it. It answers "why does this system matter" in business terms. Reference
   scenario: from business outcomes to the crown jewels, and a card data breach travelling back up. To reuse it
   for another topic, replace the data in section 1 (FIGURES, LAYERS, NODES, LINKS, STORY, STEPS and the copy).

   Data that drives the mechanism
     LAYERS / NODES        each node has a layer index; nothing has coordinates. Within a layer the order is computed.
     LINKS                 { from, to }: "from" (upper layer) depends on "to" (the layer directly below).
     FIGURES               every number shown that is not derived from the links. Outcome nodes name the figure
                           their impact line uses (impact: [text, figureKey, text]).
     STORY                 which node fails, which node the control protects, which two are expected to be the
                           crown jewels. assertStory() checks all of it at build time, from the links.
   Helpers
     orderLayers()         barycentre sweeps over the links, keeping the order with fewest crossings.
     layoutCascade()       card positions per layer, link anchor points spread along each card edge, curve paths.
     reach(id, prot)       everything above a node that a failure at it reaches; protected nodes absorb it.
     dependents(id)        size of that reach, so the counts are computed, never typed.
     cascadeDown(layer)    draws the links from one layer to the one below, one layer per beat.
     countBadges()         the dependents count on each bottom-layer node; crownJewels() marks the highest.
     impactUp(node)        a failure travels up every dependency path, one layer per beat, turning links and
                           nodes to the danger colour, landing on the outcomes as an impact line each.
     protect(node)         a shield on a node; replaying impactUp from it shows the paths stop there.
     measure               the fixed headline "Outcomes at risk from one failure: N of M", counted by tween.
   Everything is a fromTo on the master timeline, so seek(t) is exact in both directions.
   ============================================================================================================ */
(function () {
'use strict';
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);

/* ==========================================================================
   1. SCENARIO DATA + LAYOUT  (pure: no DOM, no gsap)
   ========================================================================== */
//<core>
var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',
          accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };

var SPEED_CAP = 315;           /* stage px per second: no link draws faster than this (the ceiling is 320) */
var END_AFTER_MOTION = 1.0, BODY_WPS = 3.5, FINAL_HOLD = 3.0, QTY_HOLD = 2.2, DRAW_DUR = 1.8, BEAT = 2.3;
var DIM_TEXT = 0.45, DIM_DUR = 0.4;

/* every number that is not derived from the links. source: 'provided' or 'illustrative' */
var FIGURES = {
  salesIndex: { value: 0,   unit: 'of 100', label: 'Sales index while checkout is down',        source: 'illustrative' },
  trustIndex: { value: 55,  unit: 'of 100', label: 'Customer trust index after a breach',       source: 'illustrative' },
  scrutiny:   { value: 1.6, unit: 'x',      label: 'Regulatory scrutiny against a normal year', source: 'illustrative' }
};
function fig(key) { var f = FIGURES[key]; return f.value + (f.unit === 'x' ? 'x' : ' ' + f.unit); }

var LAYERS = [
  { id: 'outcomes', name: ['Business', 'outcomes'] },
  { id: 'services', name: ['Business', 'services'] },
  { id: 'apps',     name: ['Applications'] },
  { id: 'data',     name: ['Data and', 'platforms'] }
];
var NODES = [
  { id: 'rev',     layer: 0, name: 'Revenue',             impact: ['Checkout stops: sales index', 'falls to ', 'salesIndex'] },
  { id: 'trust',   layer: 0, name: 'Customer trust',      impact: ['Customers lose faith: trust', 'index drops to ', 'trustIndex'] },
  { id: 'reg',     layer: 0, name: 'Regulatory standing', impact: ['Breach reported: scrutiny', 'runs at ', 'scrutiny', ' a normal year'] },
  { id: 'order',   layer: 1, name: 'Online ordering' },
  { id: 'pay',     layer: 1, name: 'Payments' },
  { id: 'support', layer: 1, name: 'Customer support' },
  { id: 'shop',    layer: 2, name: 'Web shop' },
  { id: 'payp',    layer: 2, name: 'Payments platform' },
  { id: 'crm',     layer: 2, name: 'Customer records' },
  { id: 'card',    layer: 3, name: 'Card data' },
  { id: 'cdb',     layer: 3, name: 'Customer database' },
  { id: 'sso',     layer: 3, name: 'Sign-in service' }
];
/* "from" depends on "to" */
var LINKS = [
  { from: 'rev',     to: 'order' },   { from: 'rev',   to: 'pay' },
  { from: 'trust',   to: 'pay' },     { from: 'trust', to: 'support' },
  { from: 'reg',     to: 'pay' },     { from: 'reg',   to: 'support' },
  { from: 'order',   to: 'shop' },    { from: 'order', to: 'payp' },
  { from: 'pay',     to: 'payp' },    { from: 'support', to: 'crm' },
  { from: 'shop',    to: 'sso' },     { from: 'payp',  to: 'card' },
  { from: 'payp',    to: 'sso' },     { from: 'crm',   to: 'cdb' },
  { from: 'crm',     to: 'sso' }
];
/* the story the scene tells; assertStory() proves it from the links */
var STORY = { failure: 'card', protectNode: 'card', protectLabel: 'Tokenised', crown: ['card', 'sso'], nextLabel: 'Protect next', crownCount: 2 };

var PHASES = [
  { id: 'depends', title: 'What depends on what' },
  { id: 'cost',    title: 'What a failure costs' },
  { id: 'invest',  title: 'Where to invest' }
];
var STEPS = [
  { id: 'depends', phase: 'depends', color: C.accent, title: 'What each outcome depends on',
    body: 'Each business outcome rests on services, services on applications, and applications on a few data stores and platforms.' },
  { id: 'jewels', phase: 'depends', color: C.token, title: 'Count what depends on each foundation',
    body: 'Card data and the Sign-in service carry the most weight: more of the business sits on them than on anything else.' },
  { id: 'failure', phase: 'cost', color: C.danger, title: 'Card data is compromised',
    body: 'Now suppose card data is breached. Follow what it touches, one layer at a time.' },
  { id: 'impact', phase: 'cost', color: C.danger, title: 'One failure reaches every outcome',
    body: 'Payments stop, ordering stops, and all three outcomes take a hit: revenue, customer trust and regulatory standing.' },
  { id: 'protect', phase: 'invest', color: C.secure, title: 'Protect the data, stop the cascade',
    body: 'Tokenising card data means a breach exposes nothing usable. Replay the failure and the paths stop at the shield.' },
  { id: 'focus', phase: 'invest', color: C.secure, title: 'Invest in what many depend on',
    body: 'A few foundations carry most of the risk. Protect those first and every path to the outcomes is covered.' }
];

function byId(list) { var m = {}; list.forEach(function (x) { m[x.id] = x; }); return m; }
var NODE = byId(NODES);

/* ---- graph queries: everything is computed from LINKS ---- */
function reach(startId, prot) {   /* what a failure at startId reaches going up; a protected node absorbs it */
  var hit = {}, links = [], q = [startId];
  hit[startId] = true;
  if (prot[startId]) return { hit: hit, links: links, absorbedAt: startId };
  while (q.length) {
    var n = q.shift();
    LINKS.forEach(function (l) {
      if (l.to !== n || prot[l.from]) return;
      links.push(l);
      if (!hit[l.from]) { hit[l.from] = true; q.push(l.from); }
    });
  }
  return { hit: hit, links: links, absorbedAt: null };
}
function dependents(id) { return Object.keys(reach(id, {}).hit).length - 1; }
function idsOfLayer(l) { return NODES.filter(function (n) { return n.layer === l; }).map(function (n) { return n.id; }); }
function outcomesHit(r) { return idsOfLayer(0).filter(function (id) { return r.hit[id]; }); }
function linkId(l) { return l.from + '>' + l.to; }
function crownJewels() {   /* the bottom-layer nodes with the highest dependents counts */
  var bottom = idsOfLayer(LAYERS.length - 1).slice().sort(function (a, b) { return dependents(b) - dependents(a); });
  return bottom.slice(0, STORY.crownCount);
}
function assertStory() {   /* the story must hold when computed, not asserted: throws at build time if it does not */
  var all = NODES.map(function (n) { return n.id; }).sort(function (a, b) { return dependents(b) - dependents(a); });
  var crown = crownJewels(), top2 = all.slice(0, STORY.crownCount);
  if (crown.slice().sort().join() !== STORY.crown.slice().sort().join()) throw new Error('crown jewels by count are ' + crown + ', expected ' + STORY.crown);
  if (top2.slice().sort().join() !== crown.slice().sort().join()) throw new Error('crown jewels are not the highest counts overall: ' + top2);
  if (dependents(all[STORY.crownCount]) >= dependents(all[STORY.crownCount - 1])) throw new Error('crown jewels do not stand clear of the next node');
  var open = reach(STORY.failure, {});
  if (outcomesHit(open).length !== idsOfLayer(0).length) throw new Error('a failure at ' + STORY.failure + ' does not reach every outcome');
  var prot = {}; prot[STORY.protectNode] = true;
  if (outcomesHit(reach(STORY.failure, prot)).length !== 0 || reach(STORY.failure, prot).links.length !== 0) throw new Error('protecting ' + STORY.protectNode + ' does not clear the outcomes');
  LINKS.forEach(function (l) { if (NODE[l.from].layer + 1 !== NODE[l.to].layer) throw new Error('link skips a layer: ' + linkId(l)); });
}
assertStory();

/* ---- order within each layer: barycentre sweeps, keep the order with fewest crossings ---- */
function crossingsOf(order) {
  var n = 0;
  for (var l = 0; l < LAYERS.length - 1; l++) {
    var ls = LINKS.filter(function (k) { return NODE[k.from].layer === l; }).map(function (k) { return [order[l].indexOf(k.from), order[l + 1].indexOf(k.to)]; });
    for (var i = 0; i < ls.length; i++) for (var j = i + 1; j < ls.length; j++) if ((ls[i][0] - ls[j][0]) * (ls[i][1] - ls[j][1]) < 0) n++;
  }
  return n;
}
function orderLayers() {
  var order = LAYERS.map(function (L, i) { return idsOfLayer(i); });
  var best = order.map(function (o) { return o.slice(); }), bestN = crossingsOf(best);
  function sortBy(l, nbrs) {
    var pos = {}; order[l + (nbrs === 'up' ? -1 : 1)].forEach(function (id, i) { pos[id] = i; });
    var key = {};
    order[l].forEach(function (id, i) {
      var ps = LINKS.filter(function (k) { return nbrs === 'up' ? k.to === id : k.from === id; }).map(function (k) { return pos[nbrs === 'up' ? k.from : k.to]; });
      key[id] = ps.length ? ps.reduce(function (a, b) { return a + b; }, 0) / ps.length : i;
    });
    order[l] = order[l].slice().sort(function (a, b) { return key[a] - key[b]; });
  }
  for (var sweep = 0; sweep < 8; sweep++) {
    for (var l = 1; l < LAYERS.length; l++) sortBy(l, 'up');
    for (l = LAYERS.length - 2; l >= 0; l--) sortBy(l, 'down');
    var n = crossingsOf(order);
    if (n < bestN) { bestN = n; best = order.map(function (o) { return o.slice(); }); }
  }
  /* refinement: adjacent swaps while they reduce (crossings, then total horizontal span of the links) */
  function cost(o) {
    var span = 0;
    LINKS.forEach(function (k) { span += Math.abs(o[NODE[k.from].layer].indexOf(k.from) - o[NODE[k.to].layer].indexOf(k.to)); });
    return crossingsOf(o) * 100 + span;
  }
  var improved = true;
  while (improved) {
    improved = false;
    for (var ly = 0; ly < best.length; ly++) for (var i = 0; i + 1 < best[ly].length; i++) {
      var trial = best.map(function (o) { return o.slice(); });
      var tmp = trial[ly][i]; trial[ly][i] = trial[ly][i + 1]; trial[ly][i + 1] = tmp;
      if (cost(trial) < cost(best)) { best = trial; improved = true; }
    }
  }
  return { order: best, crossings: crossingsOf(best) };
}

/* ---- geometry: layer bands, cards across each band, link anchors spread along each card edge ---- */
var CW = 360, XL = 340, XR = 1620 + 0;           /* card width; cards spread over [XL-ish, XR] */
var LAYGEO = [{ y: 30, h: 140 }, { y: 244, h: 84 }, { y: 402, h: 84 }, { y: 560, h: 96 }];
function layoutCascade() {
  var O = orderLayers(), G = {}, anchors = {};
  O.order.forEach(function (ids, l) {
    ids.forEach(function (id, i) {
      var cx = 300 + (1320) * (i + 0.5) / ids.length;
      G[id] = { id: id, layer: l, cx: cx, x: cx - CW / 2, y: LAYGEO[l].y, w: CW, h: LAYGEO[l].h, cy: LAYGEO[l].y + LAYGEO[l].h / 2 };
    });
  });
  var out = {}, inn = {};
  LINKS.forEach(function (l) { (out[l.from] = out[l.from] || []).push(l); (inn[l.to] = inn[l.to] || []).push(l); });
  function spread(list, keyFn, put) {
    list.sort(function (a, b) { return keyFn(a) - keyFn(b); });
    var sp = Math.min(60, (CW - 120) / Math.max(1, list.length - 1));
    list.forEach(function (l, j) { put(l, (j - (list.length - 1) / 2) * sp); });
  }
  var P = {};
  Object.keys(out).forEach(function (id) { spread(out[id], function (l) { return G[l.to].cx; }, function (l, o) { (P[linkId(l)] = P[linkId(l)] || {}).x1 = G[id].cx + o; }); });
  Object.keys(inn).forEach(function (id) { spread(inn[id], function (l) { return G[l.from].cx; }, function (l, o) { (P[linkId(l)] = P[linkId(l)] || {}).x2 = G[id].cx + o; }); });
  var L = {};
  LINKS.forEach(function (l) {
    var a = G[l.from], b = G[l.to], p = P[linkId(l)], y1 = a.y + a.h, y2 = b.y, ym = (y1 + y2) / 2;
    L[linkId(l)] = { link: l, id: linkId(l), x1: p.x1, y1: y1, x2: p.x2, y2: y2,
                     d: 'M' + p.x1 + ',' + y1 + ' C' + p.x1 + ',' + ym + ' ' + p.x2 + ',' + ym + ' ' + p.x2 + ',' + y2 };
  });
  return { G: G, L: L, order: O.order, crossings: O.crossings };
}
//</core>

/* ==========================================================================
   2. SCAFFOLDING  (stage, svg helpers, world builder, controls, timeline contract)
   ========================================================================== */
var NS = 'http://www.w3.org/2000/svg';
var QS = new URLSearchParams(location.search);
var CAPTURE = QS.get('capture') === '1';
var NARR_MODES = ['full', 'caption', 'off'];
var narr = NARR_MODES.indexOf(QS.get('narration')) >= 0 ? QS.get('narration') : 'full';
var PRESENT = QS.get('present') === '1';
var stage = document.getElementById('stage');
var viewport = document.getElementById('viewport');
if (CAPTURE) document.body.classList.add('capture');

function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, s, attrs) { var e = el('text', attrs, parent); e.textContent = s; return e; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function wordCount(s) { return s.trim().split(/\s+/).length; }

function fit() {
  var r = viewport.getBoundingClientRect();
  var s = Math.min(r.width / 1920, r.height / 1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((r.width - 1920 * s) / 2) + 'px';
  stage.style.top = ((r.height - 1080 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit();
function applyNarr() { stage.className = 'nm-' + narr; }
applyNarr();

var MODEL = layoutCascade();
window.__layout = { order: MODEL.order, crossings: MODEL.crossings };

function pill(parent, cx, cy, label, color, fg) {
  var w = Math.round(label.length * 13.4 + 30), h = 30;
  var g = el('g', { opacity: 0 }, parent);

      });
      t1 = bt + bd + 0.1 * links.length;
      bt = t1 + 0.4;
    }
    return { end: t1, R: R, outcomesAt: outcomesAt, outDur: beatDur(R.links.filter(function (k) { return NODE[k.from].layer === 0; })) };
  }

  /* ======== per-step choreography; each returns the relative time of its last motion ======== */
  var IMPL = {
    depends: function (c) {
      var t = c.t0 + 0.4;
      emph(c.t0, 'all');
      showLayer(0, t);
      var e = t + 1.0;
      for (var l = 0; l < LAYERS.length - 1; l++) e = cascadeDown(l, e) + 0.3;
      emph(e - 0.2, 'all');
      return e - c.t0;
    },
    jewels: function (c) {
      var t = c.t0, bottom = idsOfLayer(LAYERS.length - 1);
      emph(t, bottom);
      var e = countBadges(t + 0.8, 1.6);
      var tc = e + 0.7;
      markCrown(tc);
      emph(tc, crownJewels());
      return tc + 1.2 - c.t0;
    },
    failure: function (c) {
      var t = c.t0, o = w.N[STORY.failure];
      emph(t, [STORY.failure]);
      tl.fromTo(measEl, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t + 0.3);
      setSub(t + 0.5, 'a');
      fadeIn(o.danger, t + 1.2, 0.8); live.push({ el: o.danger });
      fadeIn(o.pillBad, t + 1.6, 0.5); live.push({ el: o.pillBad });
      return 2.6;
    },
    impact: function (c) {
      var t = c.t0, r = impactUp(STORY.failure, t + 0.2, { startMarked: true });
      var outs = outcomesHit(r.R), t0o = r.end + 0.1;
      /* the measure counts as the outcomes are reached; the impact lines land on each outcome */
      countMeasure(r.outcomesAt + r.outDur * 0.4, outs.length, Math.max(1.6, r.outDur * 0.8), C.danger);
      outs.forEach(function (id, k) {
        var o = w.N[id];
        fadeIn(o.impact, t0o + k * 0.5, 0.7); live.push({ el: o.impact });
      });
      tl.fromTo(chipEl, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0o); live.push({ el: chipEl });
      linkFocus(t + 0.4, (function () { var s = {}; r.R.links.forEach(function (l) { s[linkId(l)] = 1; }); return s; })(), 0.8);
      c.hold = 3.6;
      return t0o + outs.length * 0.5 + 0.7 - c.t0;
    },
    protect: function (c) {
      var t = c.t0;
      emph(t, 'all');
      /* the damage clears; the figure chip goes with the impact lines */
      live.forEach(function (x) { tl.fromTo(x.el, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: 'power1.in' }, t + 0.2); });
      live = [];
      linkFocus(t + 0.4, null, 0.8);
      protect(STORY.protectNode, t + 1.4);
      emph(t + 1.4, [STORY.protectNode]);
      /* replay: the same impactUp, now from a protected node */
      var tr = t + 3.4, r = impactUp(STORY.failure, tr, { startMarked: false });
      setSub(tr + 0.3, 'b');
      countMeasure(tr + 0.5, outcomesHit(r.R).length, 1.6, C.secure);
      live = [];
      return r.end + 0.4 - c.t0;
    },
    focus: function (c) {
      var t = c.t0, e = t + 0.6, ids = STORY.crown, set = {};
      emph(t, 'all');
      var other = ids.filter(function (id) { return !prot[id]; });
      other.forEach(function (id) { protect(id, t + 0.6); });
      setSub(t + 1.0, 'c');
      /* the paths from the crown jewels, lit in the control colour, one layer per beat */
      var seen = {};
      ids.forEach(function (id) { reach(id, {}).links.forEach(function (l) { seen[linkId(l)] = l; }); });
      var L = LAYERS.length - 1;
      var bt = t + 2.0;
      for (var l = L - 1; l >= 0; l--) {
        var ks = Object.keys(seen).filter(function (k) { return NODE[seen[k].from].layer === l; }), bd = beatDur(ks.map(function (k) { return seen[k]; }));
        ks.forEach(function (k, i) {
          var ov = overlay(k, C.secure, 8); drawLink(ov.p, w.LK[k].len, bt + i * 0.08, true, DRAW_DUR);
        });
        e = bt + bd + 0.08 * ks.length;
        bt = e + 0.4;
      }
      e += 0.5;
      return e - c.t0;
    }
  };

  /* ======== assemble: steps run back to back; each step's length depends on its narrative and its figures ======== */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0;
    tl.addLabel(st.id, t0);
    var c = { st: st, t0: t0, hold: QTY_HOLD };
    var endR = IMPL[st.id](c);
    var bodyR = 1.0, words = wordCount(st.body);
    var len = Math.max(endR + Math.max(c.hold, END_AFTER_MOTION), bodyR + 0.7 + words / BODY_WPS);
    if (i === STEPS.length - 1) len = Math.max(len, endR + FINAL_HOLD);
    var tEnd = t0 + len, rest = t0 + Math.max(endR, bodyR + 0.7) + 0.1;

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
    }
    var ph = phEls[st.phase], first = !prevSt || prevSt.phase !== st.phase;
    if (first) {
      tl.fromTo(ph.name, { color: C.muted }, { color: C.text, duration: 0.4 }, t0);
      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {
      tl.fromTo(ph.name, { color: C.text }, { color: C.muted, duration: 0.4 }, tEnd);
      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    steps.push({ id: st.id, phase: st.phase, time: t0, rest: rest, title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  buildEmphasis();
  window.__peakSpeed = Math.max.apply(null, DRAWS);
  return { steps: steps, duration: t0 };
}

/* ==========================================================================
   4. GO
   ========================================================================== */
bootstrap(choreograph);

/* overlap hook for the render checks: pairs of visible text boxes that intersect (dimmed text counts). Run at a time t with anim.seek(t) first. */
window.__overlaps = function () {
  var items = [];
  Array.prototype.slice.call(document.querySelectorAll('#dia text, [data-ov]')).forEach(function (e) {
    var op = 1, n = e;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    var r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    var label = (e.getAttribute('data-ov') || e.textContent || '').slice(0, 30);
    items.push({ k: label, r: r, stack: /^(mv|ms)/.test(e.getAttribute('data-ov') || '') });
  });
  var out = [];
  for (var i = 0; i < items.length; i++) for (var j = i + 1; j < items.length; j++) {
    var a = items[i], b = items[j];
    if (a.stack && b.stack) continue;   /* measure value and its subtitles cross-fade in one place by design */
    if (a.r.left < b.r.right && b.r.left < a.r.right && a.r.top < b.r.bottom && b.r.top < a.r.bottom) out.push([a.k, b.k]);
  }
  return out;
};
/* link check: sample every link curve and report any point inside a card that is not one of its two ends */
window.__linkChecks = function () {
  var out = [], G = MODEL.G;
  Object.keys(MODEL.L).forEach(function (id) {
    var l = MODEL.L[id], p = document.createElementNS(NS, 'path'); p.setAttribute('d', l.d);
    var len = p.getTotalLength();
    for (var s = 0; s <= 100; s++) {
      var pt = p.getPointAtLength(len * s / 100);
      Object.keys(G).forEach(function (nid) {
        if (nid === l.link.from || nid === l.link.to) return;
        var g = G[nid];
        if (pt.x > g.x && pt.x < g.x + g.w && pt.y > g.y && pt.y < g.y + g.h) out.push([id, nid]);
      });
    }
  });
  return out;
};
})();
