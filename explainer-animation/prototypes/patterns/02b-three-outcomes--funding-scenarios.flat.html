<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern 2b: three outcomes. The same three years under three budgets (flat 2D)</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #18202f; --line: #2a3447;
    --text: #e6edf7; --muted: #8b98ad; --accent: #4cc9f0; --token: #f5b941;
    --identity: #a78bfa; --secure: #3ddc97; --danger: #ff5d6c;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  .sans { font-family: var(--sans); }
  .mono { font-family: var(--mono); }
  #rail { position: absolute; left: 60px; top: 14px; width: 1800px; height: 76px; display: flex; gap: 14px; }
  .ph { flex: 1; box-sizing: border-box; padding-top: 4px; border-bottom: 4px solid var(--line); }
  .ph .pn { font-size: 24px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .ph .pd { display: flex; gap: 12px; margin-top: 10px; }
  .ph .pd i { display: block; width: 16px; height: 16px; border-radius: 8px; background: #2a3447; }
  #bandline { position: absolute; left: 0; top: 832px; width: 1920px; height: 2px; background: var(--line); }
  #band { position: absolute; left: 60px; top: 846px; width: 1800px; height: 224px; }
  #band .tt { position: absolute; left: 0; top: 0; width: 1800px; font-size: 46px; font-weight: 700; line-height: 56px; white-space: nowrap; opacity: 0; }
  #band .tt b { color: var(--accent); font-size: 38px; margin-right: 22px; font-weight: 700; }
  #band .bd { position: absolute; left: 0; top: 68px; width: 1500px; font-size: 32px; line-height: 43px; color: #c4cee0; opacity: 0; }
  #pp { position: absolute; left: 1530px; top: 1010px; width: 340px; text-align: right; font-size: 24px; color: var(--muted); display: none; }
  .nm-caption #band .bd, .nm-caption .sl { display: none; }
  .nm-off #rail, .nm-off #band, .nm-off #bandline, .nm-off .sl { display: none; }
  #controls { flex: none; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 22px;
              background: #0e1320; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
              padding: 9px 12px; font: inherit; font-size: 16px; cursor: pointer; }
  #controls button:hover, #controls select:hover { border-color: var(--accent); }
  #bPlay { min-width: 84px; }
  #scrub { position: relative; flex: 1; height: 44px; }
  #ticks { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
  #ticks i { position: absolute; top: 6px; width: 2px; height: 14px; margin-left: -1px; background: var(--muted); opacity: .8; }
  #ticks u { position: absolute; top: 24px; transform: translateX(-50%); font-size: 12px; text-decoration: none; color: var(--muted); white-space: nowrap; }
  #range { position: absolute; left: 0; right: 0; top: 8px; width: 100%; margin: 0; height: 28px; accent-color: var(--accent); }
  #clock { min-width: 110px; text-align: right; font-family: var(--mono); font-size: 15px; }
  body.capture #controls, body.capture #pp { display: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="rail"></div>
  <div id="bandline"></div>
  <div id="band"></div>
  <div id="pp">Presenter: press Right arrow</div>
</div></div>
<div id="controls">
  <button id="bPlay" title="Space">Pause</button>
  <button id="bPrev" title="Left arrow">&#9664; Step</button>
  <button id="bNext" title="Right arrow">Step &#9654;</button>
  <div id="scrub"><div id="ticks"></div><input id="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Timeline"></div>
  <span id="clock">0.0 / 0.0 s</span>
  <button id="bNarr" title="N">Narration: full</button>
  <button id="bPres" title="P">Present: off</button>
  <label>Speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script>
/* ============================================================================================================
   PATTERN 2b: THREE OUTCOMES, the same period under three options (funding scenarios)

   What it is: one decision, three options. The same period (three years) is played once per option on the SAME
   board; each finished run is docked as a small copy of that board, the main board is rewound to empty, and
   the scene ends with the three copies enlarged side by side and the differences stated as numbers.
   Reference scenario: the same three years under three budgets. To reuse it, replace section 1 (FIGURES,
   DOMAINS, CAPS, RISKS, RUNS and the step copy). Nothing else holds scenario facts.

   Data that drives the mechanism
     FIGURES             every typed number on the stage: { value, unit, label, source }. source is 'illustrative'
                         here, so the "Illustrative figures" chip shows while one is visible.
     DOMAINS / CAPS      the board: 4 domains x 3 capability tiles (tile order in CAPS is the grid order).
     RISKS               the top risks; each lists the capabilities it needs. A risk closes when ALL are delivered.
     RUNS                { id, label, cost (a FIGURES key), delivers: { year1, year2, year3 } }. Everything else
                         (counts, which year a risk closes, which year a run completes, the callout numbers) is
                         derived in deriveRuns(); no count is typed.
   Helpers
     buildBoard()        draws the board ONCE as a group (data-p / data-id parts). The three run copies are
                         cloneNode(true) of it, each given its own final state from the data (makeCopy).
     playYear()          one year of a run: ticker moves, tiles go in progress then fill, counters tween, risks
                         flip to closed as their last needed tile lands, emphasis follows the year.
     dock()              a run's copy flies from the main board position to its slot in the dock column.
     rewindMain()        the main board visibly un-plays (tiles unfill in reverse order, counters run down).
     toCompare()         the copies enlarge into three equal boards; the domain names are counter-scaled so they
                         stay readable while tile names (unreadable at that size) are hidden.
     callout()           stationary label with leader lines to its targets.
   Everything is a fromTo on the master timeline, so seek(t) is exact in both directions.
   ============================================================================================================ */
(function () {
'use strict';
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);

/* ==========================================================================
   1. SCENARIO DATA  (pure: no DOM, no gsap)
   ========================================================================== */
var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',
          accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };

/* every number typed into the scene. Relative budgets, as a multiple of today's budget. */
var FIGURES = {
  budgetMin: { value: 1.0, unit: 'x', label: 'Minimum: budget as a multiple of today', source: 'illustrative' },
  budgetRec: { value: 1.6, unit: 'x', label: 'Recommended: budget as a multiple of today', source: 'illustrative' },
  budgetAcc: { value: 2.3, unit: 'x', label: 'Accelerated: budget as a multiple of today', source: 'illustrative' }
};
var YEARS = ['year1', 'year2', 'year3'];

var DOMAINS = [
  { id: 'identity',  name: 'Identity' },
  { id: 'devices',   name: 'Devices' },
  { id: 'detection', name: 'Detection' },
  { id: 'recovery',  name: 'Recovery' }
];
var CAPS = [
  { id: 'mfa',      domain: 'identity',  lines: ['Multi-factor', 'sign-in'] },
  { id: 'sso',      domain: 'identity',  lines: ['Single', 'sign-on'] },
  { id: 'pam',      domain: 'identity',  lines: ['Admin access', 'control'] },
  { id: 'edr',      domain: 'devices',   lines: ['Laptop', 'protection'] },
  { id: 'patch',    domain: 'devices',   lines: ['Automatic', 'patching'] },
  { id: 'mdm',      domain: 'devices',   lines: ['Mobile device', 'control'] },
  { id: 'monitor',  domain: 'detection', lines: ['24/7', 'monitoring'] },
  { id: 'hunt',     domain: 'detection', lines: ['Threat', 'hunting'] },
  { id: 'triage',   domain: 'detection', lines: ['Alert', 'triage'] },
  { id: 'backup',   domain: 'recovery',  lines: ['Tested', 'backups'] },
  { id: 'playbook', domain: 'recovery',  lines: ['Incident', 'playbooks'] },
  { id: 'exercise', domain: 'recovery',  lines: ['Crisis', 'exercises'] }
];
var RISKS = [
  { id: 'logins',   name: 'Stolen logins',  needs: ['mfa', 'sso'] },
  { id: 'admin',    name: 'Admin takeover', needs: ['pam', 'mdm'] },
  { id: 'ransom',   name: 'Ransomware',     needs: ['edr', 'patch', 'backup'] },
  { id: 'late',     name: 'Late detection', needs: ['monitor', 'hunt', 'triage'] },
  { id: 'slow',     name: 'Slow recovery',  needs: ['backup', 'playbook', 'exercise'] }
];
var RUNS = [
  { id: 'min', label: 'Minimum', cost: 'budgetMin', color: C.token,
    delivers: { year1: ['mfa', 'edr'], year2: ['sso'], year3: ['patch'] } },
  { id: 'rec', label: 'Recommended', cost: 'budgetRec', color: C.accent,
    delivers: { year1: ['mfa', 'sso', 'edr', 'backup'], year2: ['pam', 'patch', 'mdm', 'monitor'], year3: ['hunt', 'playbook'] } },
  { id: 'acc', label: 'Accelerated', cost: 'budgetAcc', color: C.identity,
    delivers: { year1: ['mfa', 'sso', 'pam', 'edr', 'patch', 'backup'], year2: ['mdm', 'monitor', 'hunt', 'triage', 'playbook', 'exercise'], year3: [] } }
];

/* ---- derived model: everything the scene shows as a count comes from here ---- */
function byId(list) { var m = {}; list.forEach(function (x) { m[x.id] = x; }); return m; }
var CAP = byId(CAPS), RISK = byId(RISKS), DOM = byId(DOMAINS);
var NCAP = CAPS.length, NRISK = RISKS.length, NDOM = DOMAINS.length;
var COLW = 208, COLG = 16, TILEH = 110, TILEG = 14, HEADH = 64;
function deriveRuns() {
  DOMAINS.forEach(function (d, ci) { d.col = ci; d.caps = CAPS.filter(function (c) { return c.domain === d.id; }); });
  CAPS.forEach(function (c) {
    var d = DOM[c.domain]; c.col = d.col; c.row = d.caps.indexOf(c);
    c.x = c.col * (COLW + COLG); c.y = HEADH + c.row * (TILEH + TILEG);
    c.closes = RISKS.filter(function (r) { return r.needs.indexOf(c.id) >= 0; }).map(function (r) { return r.id; });
  });
  RUNS.forEach(function (run) {
    run.order = []; run.yearOf = {};
    YEARS.forEach(function (y, i) { run.delivers[y].forEach(function (id) {
      if (!CAP[id]) console.error('unknown capability ' + id + ' in run ' + run.id);
      if (run.yearOf[id]) console.error('capability delivered twice: ' + id + ' in run ' + run.id);
      run.yearOf[id] = i + 1; run.order.push(id); }); });
    run.delivered = run.order.length;
    run.closedAt = {}; run.closedBy = {};
    RISKS.forEach(function (r) {
      var ys = r.needs.map(function (n) { return run.yearOf[n]; });
      if (ys.every(Boolean)) {
        run.closedAt[r.id] = Math.max.apply(null, ys);
        run.closedBy[r.id] = r.needs.filter(function (n) { return run.yearOf[n] === run.closedAt[r.id]; });
      }
    });
    run.closed = Object.keys(run.closedAt).length; run.open = NRISK - run.closed;
    run.completeYear = Math.max.apply(null, run.order.map(function (id) { return run.yearOf[id]; }));
    run.missing = CAPS.filter(function (c) { return !run.yearOf[c.id]; });
    run.emptyDomains = DOMAINS.filter(function (d) { return !d.caps.some(function (c) { return run.yearOf[c.id]; }); });
    run.fig = FIGURES[run.cost];
  });
}
deriveRuns();
function gained(a, b) { return b.order.filter(function (id) { return !a.yearOf[id]; }); }       /* delivered by b, not by a */
function joinNames(xs) { return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]; }
function fmtFig(f, v) { return (v === undefined ? f.value : v).toFixed(1) + f.unit; }
var MIN = RUNS[0], REC = RUNS[1], ACC = RUNS[2];
var A_GAIN = gained(MIN, REC), B_GAIN = gained(REC, ACC);
var A_RISK = REC.closed - MIN.closed, B_RISK = ACC.closed - REC.closed;
var A_COST = FIGURES.budgetRec.value - FIGURES.budgetMin.value, B_COST = FIGURES.budgetAcc.value - FIGURES.budgetRec.value;
var SOONER = REC.completeYear - ACC.completeYear;

var PHASES = [
  { id: 'question', title: 'The question' },
  { id: 'options',  title: 'Three options' },
  { id: 'decision', title: 'The decision' }
];
var STEPS = [
  { id: 'question', phase: 'question', color: C.accent, title: 'What do three years buy?',
    body: NCAP + ' capabilities, ' + NRISK + ' top risks. The same three years, played under three different budgets.' },
  { id: 'minimum', phase: 'options', color: MIN.color, title: 'Minimum: keep existing commitments',
    body: 'Existing commitments only. Spending goes to ' + joinNames(DOMAINS.filter(function (d) { return MIN.emptyDomains.indexOf(d) < 0; }).map(function (d) { return d.name.toLowerCase(); })) + '; nothing else is funded.' },
  { id: 'recommended', phase: 'options', color: REC.color, title: 'Recommended: most of the plan',
    body: 'Funds the plan across all four areas, starting with sign-in, laptops and backups. A small gap is left.' },
  { id: 'accelerated', phase: 'options', color: ACC.color, title: 'Accelerated: everything, sooner',
    body: 'Funds the whole plan and front-loads the work, so everything lands earlier than in the other options.' },
  { id: 'compare', phase: 'decision', color: C.accent, title: 'The three options side by side',
    body: 'Same board, same three years. Capabilities delivered, top risks still open and relative cost, for each budget.' },
  { id: 'ask', phase: 'decision', color: C.secure, title: 'We recommend the middle option',
    body: 'Recommended buys ' + A_GAIN.length + ' more capabilities and closes ' + A_RISK + ' more risks than Minimum. Accelerated adds ' + B_GAIN.length + ' more, ' + (SOONER === 1 ? 'a year' : SOONER + ' years') + ' sooner.' }
];

/* ---- pacing constants (PATTERNS.md section 7 and COMMON-exec.md) ---- */
var END_AFTER_LABEL = 0.3, BODY_WPS = 3.5, FINAL_HOLD = 3.0, QUANTITY_HOLD = 2.0;
var DOCK_DUR = 2.0, DIM_TEXT = 0.45, DIM_DUR = 0.4, FILL_DUR = 1.2, EASE = 'power2.inOut';

/* ---- board geometry (group coordinates; the group is scaled for the dock and the side-by-side view) ---- */
var BOARD_W = NDOM * COLW + (NDOM - 1) * COLG, BOARD_H = HEADH + 3 * TILEH + 2 * TILEG, PADB = 14;
var BG_W = BOARD_W + 2 * PADB, BG_H = BOARD_H + 2 * PADB;
var MX = 396, MY = 120;                     /* main board origin on the stage */
var RISK_X = 1316, RISK_Y = MY - PADB, RISK_W = 300;
var TS = 0.24;                              /* dock scale */
var DOCK_X = 1672, DOCK_Y0 = 92, DOCK_DY = 196;
function slot(k) { return { x: DOCK_X + PADB * TS, y: DOCK_Y0 + k * DOCK_DY + PADB * TS, bgTop: DOCK_Y0 + k * DOCK_DY }; }
var S2 = 0.62, CMP_GAP = 38, CMP_BGW = BG_W * S2, CMP_X0 = (1920 - (3 * CMP_BGW + 2 * CMP_GAP)) / 2, CMP_BGT = 82;
function cmpPos(k) { var l = CMP_X0 + k * (CMP_BGW + CMP_GAP); return { x: l + PADB * S2, y: CMP_BGT + PADB * S2, left: l }; }
var LABEL_K = 1.5;                          /* domain names are counter-scaled by this in the side-by-side view */

/* ==========================================================================
   2. SCAFFOLDING  (stage, svg helpers, controls, timeline contract)
   ========================================================================== */
var NS = 'http://www.w3.org/2000/svg';
var QS = new URLSearchParams(location.search);
var CAPTURE = QS.get('capture') === '1';
var NARR_MODES = ['full', 'caption', 'off'];
var narr = NARR_MODES.indexOf(QS.get('narration')) >= 0 ? QS.get('narration') : 'full';
var PRESENT = QS.get('present') === '1';
var stage = document.getElementById('stage');
var viewport = document.getElementById('viewport');
if (CAPTURE) document.body.classList.add('capture');

function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, s, attrs) { var e = el('text', attrs, parent); e.textContent = s; return e; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function wordCount(s) { return s.trim().split(/\s+/).length; }
function holdWords(words) { return Math.max(2.0, words * 0.35); }

function fit() {
  var r = viewport.getBoundingClientRect();
  var s = Math.min(r.width / 1920, r.height / 1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((r.width - 1920 * s) / 2) + 'px';
  stage.style.top = ((r.height - 1080 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit();
function applyNarr() { stage.className = 'nm-' + narr; }
applyNarr();

/* ---- the board: drawn once, as a group of named parts ---- */
function buildBoard(parent) {
  var g = el('g', { 'data-p': 'board' }, parent);
  el('rect', { 'data-p': 'bg', x: -PADB, y: -PADB, width: BG_W, height: BG_H, rx: 24, fill: C.panel2, stroke: C.line, 'stroke-width': 3 }, g);
  var tiles = el('g', {}, g), names = el('g', { 'data-p': 'names' }, g), labels = el('g', { 'data-p': 'labels' }, g);
  CAPS.forEach(function (c) {
    var t = el('g', { transform: 'translate(' + c.x + ',' + c.y + ')' }, tiles);
    el('rect', { 'data-p': 'tbg', 'data-id': c.id, x: 0, y: 0, width: COLW, height: TILEH, rx: 14, fill: C.panel, stroke: '#3a4660', 'stroke-width': 3, 'stroke-dasharray': '11 8' }, t);
    el('rect', { 'data-p': 'tprog', 'data-id': c.id, x: 0, y: 0, width: COLW, height: TILEH, rx: 14, fill: '#14506a', stroke: C.accent, 'stroke-width': 4, opacity: 0 }, t);
    el('rect', { 'data-p': 'tfill', 'data-id': c.id, x: 0, y: 0, width: COLW, height: TILEH, rx: 14, fill: '#1c8a62', stroke: C.secure, 'stroke-width': 4, opacity: 0 }, t);
    var ck = el('g', { 'data-p': 'tchk', 'data-id': c.id, transform: 'translate(' + (COLW - 26) + ',' + (TILEH - 26) + ')', opacity: 0 }, t);
    el('circle', { cx: 0, cy: 0, r: 14, fill: C.secure }, ck);
    el('path', { d: 'M-6,0 L-2,5 L7,-5', fill: 'none', stroke: C.bg, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, ck);
    var n = el('g', { 'data-p': 'tname', 'data-id': c.id, transform: 'translate(' + c.x + ',' + c.y + ')' }, names);
    txt(n, c.lines[0], { x: 16, y: 40, dy: '.35em', class: 'sans', fill: C.text, 'font-size': 22, 'font-weight': 650 });
    txt(n, c.lines[1], { x: 16, y: 72, dy: '.35em', class: 'sans', fill: C.text, 'font-size': 22, 'font-weight': 650 });
  });
  DOMAINS.forEach(function (d) {
    var lg = el('g', { 'data-p': 'dlabel', 'data-id': d.id }, labels);
    var sc = el('g', { 'data-p': 'dsc' }, lg);     /* inner group: scaled by attribute about its own centre in the side-by-side view */
    txt(sc, d.name, { x: 0, y: 0, dy: '.35em', 'text-anchor': 'middle', class: 'sans', fill: C.text, 'font-size': 24, 'font-weight': 700 });
    gsap.set(lg, { x: d.col * (COLW + COLG) + COLW / 2, y: 30, transformOrigin: '0px 0px' });
  });
  return g;
}
function part(root, p, id) { return root.querySelector('[data-p="' + p + '"]' + (id ? '[data-id="' + id + '"]' : '')); }

/* ---- the world: static structure; every state change is a tween on the timeline ---- */
function buildWorld() {
  var svg = el('svg', { viewBox: '0 0 1920 720', width: 1920, height: 720, id: 'dia' }, stage);
  svg.style.cssText = 'position:absolute;left:0;top:100px;display:block;';
  stage.insertBefore(svg, stage.firstChild);
  var L = {};
  ['board', 'hud', 'dock', 'cmp', 'callouts', 'chip'].forEach(function (n) { L[n] = el('g', { 'data-layer': n }, svg); });
  var W = { L: L, tile: {}, risk: {}, copy: [], slotLabel: [], cmp: [] };

  /* main board (the one that is played) and its risk list */
  W.boardLayer = el('g', { opacity: 0 }, L.board);
  W.main = buildBoard(W.boardLayer);
  gsap.set(W.main, { x: MX, y: MY, transformOrigin: '0px 0px' });
  W.mainNames = part(W.main, 'names'); W.mainLabels = part(W.main, 'labels');
  W.mainGap = el('g', {}, W.main);   /* overlay for rings drawn on the main board */
  CAPS.forEach(function (c) {
    W.tile[c.id] = { prog: part(W.main, 'tprog', c.id), fill: part(W.main, 'tfill', c.id), chk: part(W.main, 'tchk', c.id), name: part(W.main, 'tname', c.id) };
  });
  W.dlabel = {}; DOMAINS.forEach(function (d) { W.dlabel[d.id] = part(W.main, 'dlabel', d.id); });

  var rg = el('g', { opacity: 0 }, W.boardLayer); W.riskLayer = rg;
  gsap.set(rg, { x: RISK_X, y: RISK_Y });
  el('rect', { x: 0, y: 0, width: RISK_W, height: BG_H, rx: 24, fill: C.panel2, stroke: C.line, 'stroke-width': 3 }, rg);
  txt(rg, 'Top risks', { x: 24, y: 34, dy: '.35em', class: 'sans', fill: C.muted, 'font-size': 24, 'font-weight': 650 });
  RISKS.forEach(function (r, i) {
    var y = 64 + i * 76, row = el('g', {}, rg);
    el('rect', { x: 12, y: y, width: RISK_W - 24, height: 66, rx: 14, fill: C.panel, stroke: C.line, 'stroke-width': 2.5 }, row);
    var closedBg = el('rect', { x: 12, y: y, width: RISK_W - 24, height: 66, rx: 14, fill: 'none', stroke: C.secure, 'stroke-width': 4, opacity: 0 }, row);
    var openIc = el('g', { transform: 'translate(46,' + (y + 33) + ')' }, row);

  function dock(c, k, r) {
    var cp = w.copy[k], s = slot(k), t = c.t0 + r;
    fade(t, cp.g, 0, 1, 0.01);
    tl.fromTo(cp.g, { x: MX, y: MY, scale: 1 }, { x: s.x, y: s.y, scale: TS, duration: DOCK_DUR, ease: EASE }, t);
    fade(t, cp.names, 1, 0, 0.4); fade(t, cp.labels, 1, 0, 0.4);
    fade(t, w.mainNames, 1, 0, 0.01); fade(t, w.mainLabels, 1, 0, 0.01);       /* the copy is opaque over them */
    fade(t + 1.0, w.mainNames, 0, 1, 0.5); fade(t + 1.0, w.mainLabels, 0, 1, 0.5);
    fade(t + DOCK_DUR - 0.6, w.slotLabel[k], 0, 1, 0.4);
    c.firstR = Math.min(c.firstR, r);
    return r + DOCK_DUR;
  }
  /* the main board un-plays: tiles unfill in reverse order, counters run down, risks reopen, ticker resets */
  function rewindMain(c, run, r) {
    var t0 = c.t0, REW = 1.5, rs = r + 0.2, order = run.order.slice().reverse(), n = order.length, ts = {};
    fade(t0 + r, w.rewind, 0, 1, 0.3);
    order.forEach(function (id, i) {
      var T = w.tile[id]; ts[id] = rs + (n > 1 ? i * (REW - 0.7) / (n - 1) : 0);
      fade(t0 + ts[id], T.fill, 1, 0, 0.5); fade(t0 + ts[id], T.chk, 1, 0, 0.4);
    });
    RISKS.forEach(function (rk) {
      if (!run.closedAt[rk.id]) return;
      var tt = Math.min.apply(null, rk.needs.map(function (id) { return ts[id]; })), R = w.risk[rk.id];
      fade(t0 + tt, R.closedIc, 1, 0, 0.5); fade(t0 + tt, R.openIc, 0, 1, 0.5); fade(t0 + tt, R.closedBg, 1, 0, 0.5);
    });
    count(t0 + rs, w.mDel.v, run.delivered, 0, REW, fmtOf(NCAP));
    count(t0 + rs, w.mOpen.v, run.open, NRISK, REW, fmtOf(NRISK));
    w.tick.forEach(function (ch, i) { setChip(t0 + rs, i, 0, run.color, 0.6); });
    fade(t0 + rs + REW, w.rewind, 1, 0, 0.3);
    emph(t0 + r, null);
    return rs + REW + 0.3;
  }
  function swapBanner(c, k, r) {
    if (cur.banner >= 0) fade(c.t0 + r, w.banner[cur.banner], 1, 0, 0.4);
    fade(c.t0 + r, w.banner[k], 0, 1, 0.4);
    cur.banner = k;
  }
  function runStep(c, k) {
    var run = RUNS[k], r = 0.3;
    c.firstR = 0.3;
    if (k === 0) { fade(c.t0 + 0.3, w.mCost.g, 0, 1, 0.5); fade(c.t0 + 0.3, w.tickG, 0, 1, 0.5); fade(c.t0 + 0.3, w.chip, 0, 1, 0.5); }
    swapBanner(c, k, 0.1);          /* the step opens on an empty board with its own banner */
    count(c.t0 + r, w.mCost.v, cur.cost, run.fig.value, 1.2, fmtCost(run.fig.unit)); cur.cost = run.fig.value;
    r += 1.2;
    var res = [], last;
    for (var y = 1; y <= YEARS.length; y++) {
      res[y] = playYear(c, run, y, r); last = res[y];
      r = res[y].next;
    }
    /* what the run shows at its end, named on the board */
    var tgtBottom = MY + BOARD_H;
    function colBottom(d) { return [MX + d.col * (COLW + COLG) + COLW / 2, tgtBottom]; }
    if (k === 0) {
      var names = joinNames(run.emptyDomains.map(function (d) { return d.name; }));
      callout(c, { cx: 1060, y: 592, color: run.color, at: last.end - 0.6, targets: run.emptyDomains.map(colBottom),
                   lines: [{ s: 'Nothing delivered in' }, { s: names }] });
    } else if (k === 1) {
      var gapTiles = run.missing;
      gapTiles.forEach(function (cap) {
        var rg = el('rect', { x: cap.x - 4, y: cap.y - 4, width: COLW + 8, height: TILEH + 8, rx: 16, fill: 'none', stroke: C.danger, 'stroke-width': 6, 'stroke-dasharray': '12 8', opacity: 0 }, w.mainGap);
        fade(c.t0 + last.end - 0.6, rg, 0, 1, 0.5); c.extra.push(rg);
      });
      callout(c, { cx: 1060, y: 592, color: C.danger, at: last.end - 0.6, targets: gapTiles.map(function (cap) { return [MX + cap.x + COLW / 2, tgtBottom]; }),
                   lines: [{ s: 'Still missing:' }, { s: joinNames(gapTiles.map(function (cap) { return cap.lines.join(' ').toLowerCase().replace(/^./, function (m) { return m.toUpperCase(); }); })) }] });
    } else {
      callout(c, { cx: 1060, y: 592, color: run.color, at: res[2].next + 0.5, targets: [[1060, tgtBottom]],
                   lines: [{ s: 'Everything delivered' }, { s: 'by the end of Year ' + run.completeYear }] });
    }
    emph(c.t0 + last.end + 0.2, null);
    /* the step's own ending: it rests with its final numbers, then docks (and rewinds, except the last run) as its exit */
    c.rest = last.end;
    var ex = Math.max(last.end + QUANTITY_HOLD, c.labelEnd), exEnd;
    c.extra.forEach(function (d) { fade(c.t0 + ex, d, 1, 0, 0.4, 'power1.in'); });
    c.extra = [];
    exEnd = dock(c, k, ex);
    if (k < RUNS.length - 1) exEnd = rewindMain(c, run, ex + 1.4);
    c.hold = 0.2;
    return exEnd;
  }

  /* ======== per-step choreography; each returns the relative time of its last motion ======== */
  var IMPL = {
    question: function (c) {
      c.firstR = 0.3;
      fade(c.t0 + 0.3, w.boardLayer, 0, 1, 0.8);
      DOMAINS.forEach(function (d, i) { tl.fromTo(w.dlabel[d.id], { opacity: 0 }, { opacity: 1, duration: 0.5 }, c.t0 + 0.4 + i * 0.15); });
      fade(c.t0 + 1.0, w.riskLayer, 0, 1, 0.6);
      fade(c.t0 + 1.4, w.mDel.g, 0, 1, 0.5); fade(c.t0 + 1.6, w.mOpen.g, 0, 1, 0.5); fade(c.t0 + 1.8, w.legend, 0, 1, 0.5);
      callout(c, { cx: MX + BOARD_W / 2, y: 22, color: C.accent, at: 2.4, targets: [[MX + BOARD_W / 2, MY - PADB]],
                   lines: [{ s: NCAP + ' capabilities in ' + NDOM + ' areas' }] });
      callout(c, { cx: RISK_X + RISK_W / 2, y: 22, color: C.danger, at: 3.2, targets: [[RISK_X + RISK_W / 2, RISK_Y]],
                   lines: [{ s: NRISK + ' top risks' }] });
      return 3.7;
    },
    minimum: function (c) { return runStep(c, 0); },
    recommended: function (c) { return runStep(c, 1); },
    accelerated: function (c) { return runStep(c, 2); },
    compare: function (c) {
      var t0 = c.t0;   /* the last run has already docked; the board and HUD clear and the copies enlarge */
      fade(t0 + 0.2, w.boardLayer, 1, 0, 0.6); fade(t0 + 0.2, w.hud, 1, 0, 0.6);
      var mv = 1.0, dur = 3.0;
      RUNS.forEach(function (run, k) {
        var cp = w.copy[k], s = slot(k), p = cmpPos(k);
        fade(t0 + mv, w.slotLabel[k], 1, 0, 0.4);
        tl.fromTo(cp.g, { x: s.x, y: s.y, scale: TS }, { x: p.x, y: p.y, scale: S2, duration: dur, ease: EASE }, t0 + mv);
        fade(t0 + mv + dur - 0.9, cp.labels, 0, 1, 0.6);
        var ks = { k: 1 };
        tl.fromTo(ks, { k: 1 }, { k: LABEL_K, duration: dur, ease: EASE, onUpdate: function () { cp.dlabels.forEach(function (lg) { lg.setAttribute('transform', 'scale(' + ks.k + ')'); }); } }, t0 + mv);
        var cm = w.cmp[k];
        fade(t0 + mv + dur, cm.g, 0, 1, 0.5);
        count(t0 + mv + dur + 0.1, cm.vals[0], 0, run.delivered, 1.5, fmtOf(NCAP));
        count(t0 + mv + dur + 0.1, cm.vals[1], 0, run.open, 1.5, fmtOf(NRISK));
        count(t0 + mv + dur + 0.1, cm.vals[2], 0, run.fig.value, 1.5, fmtCost(run.fig.unit));
      });
      c.firstR = 0.4;
      return mv + dur + 1.7;
    },
    ask: function (c) {
      var t0 = c.t0, bgBottom = CMP_BGT + BG_H * S2;
      c.firstR = 0.4;
      fade(t0 + 0.4, w.recFrame, 0, 1, 0.6);
      var pa = cmpPos(1), pb = cmpPos(2), cy = 592;
      var midA = (pa.left + CMP_BGW / 2 + cmpPos(0).left + CMP_BGW / 2) / 2, midB = (pa.left + CMP_BGW / 2 + pb.left + CMP_BGW / 2) / 2;
      A_GAIN.length && w.copy[1].rings.forEach(function (rg, i) { rg.setAttribute('stroke', REC.color); tl.fromTo(rg, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t0 + 1.0 + i * 0.1); });
      callout(c, { cx: midA, y: cy, color: REC.color, at: 1.2,
                   lines: [{ s: 'Recommended over Minimum', fs: 24, fill: C.muted }, { s: '+' + A_GAIN.length + ' capabilities, +' + A_RISK + ' risks closed', fs: 26, w: 750 }, { s: 'for +' + A_COST.toFixed(1) + FIGURES.budgetRec.unit + ' budget', fs: 26 }] });
      w.copy[2].rings.forEach(function (rg, i) { rg.setAttribute('stroke', ACC.color); tl.fromTo(rg, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t0 + 3.4 + i * 0.1); });
      callout(c, { cx: midB, y: cy, color: ACC.color, at: 3.6,
                   lines: [{ s: 'Accelerated over Recommended', fs: 24, fill: C.muted }, { s: '+' + B_GAIN.length + ' capabilities, +' + B_RISK + ' risks closed', fs: 26, w: 750 },
                           { s: (SOONER === 1 ? 'a year' : SOONER + ' years') + ' sooner, for +' + B_COST.toFixed(1) + FIGURES.budgetAcc.unit }] });
      return 4.2;
    }
  };

  /* ======== assemble: steps run back to back; each step's length depends on its narrative and its labels ======== */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0; TIMES[st.id] = t0;
    tl.addLabel(st.id, t0);
    var c = makeCtx(st, t0);
    var end = IMPL[st.id](c);
    var hold = i === STEPS.length - 1 ? Math.max(c.hold, FINAL_HOLD) : c.hold;
    var bodyR = Math.min(c.firstR, end) + 0.8, words = wordCount(st.body);
    var bodyDone = bodyR + 0.7 + words / BODY_WPS;
    var len = Math.max(end + hold, c.labelEnd + END_AFTER_LABEL, bodyDone);
    var tEnd = t0 + len;

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
    }
    var ph = phEls[st.phase], first = !prevSt || prevSt.phase !== st.phase;
    if (first) {
      tl.fromTo(ph.name, { color: C.muted }, { color: C.text, duration: 0.4 }, t0);
      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {
      tl.fromTo(ph.name, { color: C.text }, { color: C.muted, duration: 0.4 }, tEnd);
      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    /* callouts and rings belong to their step: they fade at its end, except on the last step */
    if (i < STEPS.length - 1) c.extra.forEach(function (d) { tl.fromTo(d, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tEnd - 0.5); });
    steps.push({ id: st.id, phase: st.phase, time: t0, rest: t0 + Math.max(c.rest != null ? c.rest : end, bodyR + 0.7, c.rest != null ? 0 : c.labelEnd), title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  return { steps: steps, duration: t0 };
}

/* ==========================================================================
   4. GO
   ========================================================================== */
bootstrap(choreograph);

/* overlap hook for the render checks: pairs of visible text boxes that intersect (dimmed text counts).
   Run at a time t with anim.seek(t) first. */
window.__overlaps = function () {
  var items = [];
  Array.prototype.slice.call(document.querySelectorAll('#dia text, [data-ov]')).forEach(function (e) {
    var op = 1, n = e;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    var r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    var label = (e.getAttribute('data-ov') || e.textContent || '').slice(0, 30);
    items.push({ k: label, r: r, stack: e.getAttribute('data-stack') });
  });
  var out = [];
  for (var i = 0; i < items.length; i++) for (var j = i + 1; j < items.length; j++) {
    var a = items[i], b = items[j];
    if (a.stack && a.stack === b.stack) continue;   /* the run banner states cross-fade in one place by design */
    if (a.r.left < b.r.right && b.r.left < a.r.right && a.r.top < b.r.bottom && b.r.top < a.r.bottom) out.push([a.k, b.k]);
  }
  return out;
};
})();
</script>
