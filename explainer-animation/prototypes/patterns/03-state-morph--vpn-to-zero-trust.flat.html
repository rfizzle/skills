<title>Pattern 3: state morph. From VPN to zero-trust access (flat 2D)</title>
<style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>

<script>
/* ============================================================================================================
   PATTERN 3: STATE MORPH, current architecture to target architecture

   What it is: one diagram changes from today's architecture to the target while the audience watches, so they
   can see what is retired, what is new, what stays and what moves. Then the consequence is shown on the new
   diagram. Reference scenario: from VPN to zero-trust access. To reuse it for another topic, replace the data
   in section 1 (NODES, CONTS, EDGES, TREES, STEPS and the copy) and the demonstration steps in IMPL.

   Data that drives the mechanism
     NODES / CONTS / EDGES  each carries in: ['current'], ['target'] or both. An edge lists its two ends per
                            state (ends), so one edge can change its source: "gate to Wiki" is the same line
                            from the VPN today and from the proxy in the target.
     TREES                  the nesting of each state (rows, columns, gaps, anchors). Nothing has coordinates.
   Helpers
     layoutState(state)     the layout engine, run once per state: bottom-up measure, top-down place, then
                            routeState(): orthogonal routes, parallel runs offset into separate lanes.
     classify()             retired (only current) / new (only target) / kept (both), by id, with counts.
     buildWorld()           one SVG element per id, built at the position it has in its first state, with its
                            retired / new mark. Shared elements are the SAME element in both states.
     morph (IMPL.morph)     one step, staged: strike retired, hold, fade and shrink out; shared nodes and
                            containers glide to their target geometry (rect and tab tweened together); new things
                            grow in with a persistent badge; edges re-route last (edgeMorph: tween the path
                            string when the old and new routes have the same command structure, otherwise
                            cross-fade the old route out and draw the new one in).
     banner / measure / legend   fixed panels: state banner, before-and-after number, change counts.
   Everything is a fromTo on the master timeline, so seek(t) is exact in both directions.
   ============================================================================================================ */
(function () {
'use strict';
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);

/* ==========================================================================
   1. SCENARIO DATA + LAYOUT  (pure: no DOM, no gsap)
   ========================================================================== */
//<core>
var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',
          accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };

var NW = 240, NH = 80, PAD = 22, TOPPAD = 66, TABH = 44, LFS = 28, MX = 90, UY = 340;
var LANE = 14, SP = 14, RAD = 14;
var SPEED_CAP = 315;           /* stage px per second: peak speed of any packet stays under the 320 ceiling */
var END_AFTER_MOTION = 1.0, END_AFTER_LABEL = 0.3, BODY_WPS = 3.5, LAST_HOLD_MIN = 1.4, LAST_HOLD_WPW = 0.35, FINAL_HOLD = 3.0;
var DIM_TEXT = 0.45, DIM_DUR = 0.4;
var BOTH = ['current', 'target'], CUR = ['current'], TGT = ['target'];

var NODES = [
  { id: 'user',    lines: ['Remote user'],           icon: 'laptop',  tint: C.accent,   in: BOTH, tip: 'A remote employee on a laptop. The same person and device in both states.' },
  { id: 'vpn',     lines: ['VPN', 'concentrator'],   icon: 'vpn',     tint: C.token,    in: CUR,  tip: 'Terminates the VPN tunnel. Once it is up, the laptop is on the internal network.' },
  { id: 'wiki',    lines: ['Wiki'],                  icon: 'doc',     tint: C.text,     in: BOTH, tip: 'Internal wiki.' },
  { id: 'hr',      lines: ['HR app'],                icon: 'people',  tint: C.text,     in: BOTH, tip: 'HR records.' },
  { id: 'fin',     lines: ['Finance app'],           icon: 'coins',   tint: C.text,     in: BOTH, tip: 'Payments and ledgers.' },
  { id: 'admin',   lines: ['Admin', 'console'],         icon: 'gear',    tint: C.text,     in: BOTH, tip: 'Administration of internal systems.' },
  { id: 'db',      lines: ['Customer DB'],           icon: 'db',      tint: C.text,     in: BOTH, tip: 'Customer records.' },
  { id: 'proxy',   lines: ['Access', 'proxy'],       icon: 'proxy',   tint: C.accent,   in: TGT,  tip: 'Identity-aware proxy. The only way to an app, and it asks the policy engine for every request.' },
  { id: 'policy',  lines: ['Policy', 'engine'],      icon: 'policy',  tint: C.identity, in: TGT,  tip: 'Decides each request from who is asking and what device they are on.' },
  { id: 'idp',     lines: ['Identity', 'provider'],  icon: 'idp',     tint: C.identity, in: TGT,  tip: 'Knows who the user is and whether they passed MFA.' },
  { id: 'posture', lines: ['Device', 'posture'],     icon: 'posture', tint: C.identity, in: TGT,  tip: 'Reports whether the device is managed and patched.' }
];
var CONTS = [
  { id: 'internet', label: 'INTERNET',     kind: 'internet', caps: true, in: BOTH },
  { id: 'dc',       label: 'Data centre',  kind: 'account',  in: BOTH },
  { id: 'flat',     label: 'Flat network', kind: 'vpc',      in: CUR },
  { id: 'access',   label: 'Access layer', kind: 'subnet',   in: TGT },
  { id: 'trust',    label: 'Trust signals', kind: 'cluster', in: TGT }
];
/* an edge lists its two ends per state; kind picks the routing rule (direct, fan, elbow) */
var EDGES = [
  { id: 'uplink',    kind: 'direct', ends: { current: ['user', 'vpn'], target: ['user', 'proxy'] } },
  { id: 'l_wiki',    kind: 'fan',    ends: { current: ['vpn', 'wiki'],  target: ['proxy', 'wiki'] } },
  { id: 'l_hr',      kind: 'fan',    ends: { current: ['vpn', 'hr'],    target: ['proxy', 'hr'] } },
  { id: 'l_fin',     kind: 'fan',    ends: { current: ['vpn', 'fin'],   target: ['proxy', 'fin'] } },
  { id: 'l_admin',   kind: 'fan',    ends: { current: ['vpn', 'admin'], target: ['proxy', 'admin'] } },
  { id: 'l_db',      kind: 'fan',    ends: { current: ['vpn', 'db'],    target: ['proxy', 'db'] } },
  { id: 'p_policy',  kind: 'direct', ends: { target: ['proxy', 'policy'] } },
  { id: 'p_idp',     kind: 'direct', ends: { target: ['policy', 'idp'] } },
  { id: 'p_posture', kind: 'elbow',  off: 24, ends: { target: ['policy', 'posture'] } }
];
var APPS = ['wiki', 'hr', 'fin', 'admin', 'db'];

/* nesting per state. main: the child whose centre line anchors the container; aFirst / aAdd: anchor on the first child, plus an offset */
var TREES = {
  current: { id: 'root', dir: 'row', gap: 330, kids: [
    { id: 'internet', dir: 'col', kids: ['user'] },
    { id: 'dc', dir: 'row', gap: 160, kids: ['vpn', { id: 'flat', dir: 'col', gap: 12, main: 'hr', kids: APPS }] }
  ] },
  target: { id: 'root', dir: 'row', gap: 214, kids: [
    { id: 'internet', dir: 'col', kids: ['user'] },
    { id: 'access', dir: 'col', gap: 130, main: 'proxy', kids: ['policy', 'proxy'] },
    { id: 'trust', dir: 'col', gap: 14, aFirst: true, aAdd: 210, kids: ['idp', 'posture'] },
    { id: 'dc', dir: 'col', gap: 12, kids: APPS }
  ] }
};

var PHASES = [
  { id: 'today',   title: 'Today' },
  { id: 'problem', title: 'The problem' },
  { id: 'change',  title: 'The change' },
  { id: 'buys',    title: 'What it buys' }
];
var STEPS = [
  { id: 'today', phase: 'today', color: C.accent, title: 'Remote staff connect through the VPN', state: 'current',
    body: 'A remote user brings up a VPN tunnel to the concentrator, then opens the Wiki. From the network’s point of view, the laptop is now simply inside.',
    touch: ['user', 'vpn', 'wiki'], edges: ['uplink', 'l_wiki'] },
  { id: 'reach', phase: 'today', color: C.accent, title: 'The VPN grants the whole network', state: 'current',
    body: 'The VPN grants network access, not access to one application. Once the tunnel is up, the laptop can reach all five apps, whether or not this person needs them.',
    touch: ['vpn'].concat(APPS), edges: ['l_wiki', 'l_hr', 'l_fin', 'l_admin', 'l_db'] },
  { id: 'problem', phase: 'problem', color: C.danger, title: 'A stolen login gets the same reach', state: 'current',
    body: 'A stolen laptop or a stolen VPN credential is just another tunnel. The attacker inherits the same reach, so one compromised user exposes all five apps.',
    touch: ['user', 'vpn'].concat(APPS), edges: ['uplink', 'l_wiki', 'l_hr', 'l_fin', 'l_admin', 'l_db'] },
  { id: 'morph', phase: 'change', color: C.accent, title: 'From VPN to zero trust', state: 'target',
    body: 'Retire the VPN and its flat network. Put an identity-aware proxy in front of each app, backed by identity and device checks. The apps stay; what reaches them changes.',
    touch: [], edges: [], all: true },
  { id: 'allow', phase: 'buys', color: C.secure, title: 'A checked request reaches the Wiki', state: 'target',
    body: 'The proxy asks the policy engine, which checks who the user is and whether the device is healthy. Both pass, so the proxy opens a path to the Wiki only.',
    touch: ['user', 'proxy', 'policy', 'idp', 'posture', 'wiki'], edges: ['uplink', 'p_policy', 'p_idp', 'p_posture', 'l_wiki'] },
  { id: 'deny', phase: 'buys', color: C.danger, title: 'An unmanaged device is denied', state: 'target',
    body: 'The same user asks for Finance from a personal laptop. Identity passes, device posture fails, so the proxy refuses. Nothing behind the proxy is touched.',
    touch: ['user', 'proxy', 'policy', 'idp', 'posture'], edges: ['uplink', 'p_policy', 'p_idp', 'p_posture'] },
  { id: 'changed', phase: 'buys', color: C.accent, title: 'What the change bought', state: 'target',
    body: 'The VPN and its flat network are retired; a proxy and three checks are new; the user and apps are kept. Reach per request fell from five apps to one.',
    touch: [], edges: [], all: true }
];

/* ---- layout engine: bottom-up measure, top-down place. Rows align children on their anchor line. ---- */
function byId(list) { var m = {}; list.forEach(function (x) { m[x.id] = x; }); return m; }
var CONT = byId(CONTS), NODE = byId(NODES), EDGE = byId(EDGES);
function inState(def, state) { return def.in.indexOf(state) >= 0; }
function textW(label, fs, caps) { return label.length * fs * (caps ? 0.68 : 0.56); }

function mkTree(spec) {
  if (typeof spec === 'string') return { type: 'node', id: spec };
  return { type: 'box', id: spec.id, dir: spec.dir, gap: spec.gap || 0, main: spec.main, aFirst: spec.aFirst, aAdd: spec.aAdd || 0, kids: spec.kids.map(mkTree) };
}
function measure(b) {
  if (b.type === 'node') { b.w = NW; b.h = NH; b.a = NH / 2; return; }
  var def = CONT[b.id];
  var p = b.pad = def ? { l: PAD, r: PAD, t: TOPPAD, b: PAD } : { l: 0, r: 0, t: 0, b: 0 };
  b.kids.forEach(measure);
  var cw = 0, ch = 0, a;
  if (b.dir === 'row') {
    var A = 0;
    b.kids.forEach(function (c) { A = Math.max(A, c.a); });
    b.kids.forEach(function (c, i) { if (i) cw += b.gap; c.rx = cw; c.ry = A - c.a; cw += c.w; ch = Math.max(ch, c.ry + c.h); });
    a = p.t + A;
  } else {
    var ref = null;
    b.kids.forEach(function (c, i) {
      if (i) ch += b.gap;
      c.ry = ch; c.rx = 0; ch += c.h; cw = Math.max(cw, c.w);
      if (c.id === b.main) ref = c;
    });
    if (!ref && b.aFirst) ref = b.kids[0];
    a = p.t + (ref ? ref.ry + ref.a : ch / 2) + b.aAdd;
  }
  b.cw = cw; b.ch = ch; b.a = a; b.w = p.l + cw + p.r; b.h = p.t + ch + p.b;
  if (def) { b.tab = { w: Math.round(textW(def.label, LFS, def.caps) + 44), h: TABH }; b.w = Math.max(b.w, b.tab.w + 40); }
}
function place(b, x, y, B, depth, parent) {
  b.x = x; b.y = y; b.cx = x + b.w / 2; b.cy = y + b.h / 2; b.depth = depth; b.parent = parent; B[b.id] = b;
  if (b.type === 'node') return;
  var p = b.pad, ox = x + p.l + (b.w - p.l - p.r - b.cw) / 2, oy = y + p.t;
  b.kids.forEach(function (c) { place(c, ox + c.rx + (b.dir === 'col' ? (b.cw - c.w) / 2 : 0), oy + c.ry, B, depth + 1, b.id); });
}
function roundedPath(pts, r) {
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    var l1 = Math.abs(p1[0] - p0[0]) + Math.abs(p1[1] - p0[1]), l2 = Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1]);
    var rr = Math.min(r, l1 / 2, l2 / 2);
    var ax = p1[0] - Math.sign(p1[0] - p0[0]) * rr, ay = p1[1] - Math.sign(p1[1] - p0[1]) * rr;
    var bx = p1[0] + Math.sign(p2[0] - p1[0]) * rr, by = p1[1] + Math.sign(p2[1] - p1[1]) * rr;
    d += ' L' + ax + ',' + ay + ' Q' + p1[0] + ',' + p1[1] + ' ' + bx + ',' + by;
  }
  var q = pts[pts.length - 1];
  return d + ' L' + q[0] + ',' + q[1];
}
function polyLen(pts) {
  var s = 0;
  for (var i = 1; i < pts.length; i++) s += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
  return s;
}
/* routes. The first and last points sit inside the nodes (hidden under them). A fan is several links from one
   source to targets above, level with, and below it; each gets its own start offset and lane so none share a segment. */
function routeState(state, B) {
  var E = {}, fans = {};
  EDGES.forEach(function (e) {
    var en = e.ends[state]; if (!en) return;
    E[e.id] = { id: e.id, a: en[0], b: en[1], kind: e.kind };
    if (e.kind === 'fan') (fans[en[0]] = fans[en[0]] || []).push(E[e.id]);
  });
  Object.keys(E).forEach(function (id) {
    var e = E[id], S = B[e.a], D = B[e.b];
    if (e.kind === 'direct') e.pts = [[S.cx, S.cy], [D.cx, D.cy]];
    else if (e.kind === 'elbow') {
      var pS = B[S.parent], pD = B[D.parent], off = EDGE[id].off, lx = (pS.x + pS.w + pD.x) / 2;
      e.pts = [[S.cx, S.cy + off], [lx, S.cy + off], [lx, D.cy], [D.cx, D.cy]];
    }
  });
  Object.keys(fans).forEach(function (src) {
    var S = B[src], g = fans[src].slice().sort(function (p, q) { return B[p.b].cy - B[q.b].cy; });
    var up = g.filter(function (e) { return B[e.b].cy < S.cy - 0.5; }), down = g.filter(function (e) { return B[e.b].cy > S.cy + 0.5; });
    var base = B[B[g[0].b].parent].x - 20 - 4 * LANE;
    g.forEach(function (e) {
      var D = B[e.b], ys, lx;
      if (Math.abs(D.cy - S.cy) <= 0.5) { e.pts = [[S.cx, S.cy], [D.cx, D.cy]]; return; }
      if (D.cy < S.cy) { var k = up.indexOf(e); ys = S.cy - SP * (up.length - k); lx = base + k * LANE; }
      else { var j = down.indexOf(e); ys = S.cy + SP * (j + 1); lx = base + (down.length - 1 - j) * LANE; }
      e.pts = [[S.cx, ys], [lx, ys], [lx, D.cy], [D.cx, D.cy]];

    },
    allow: function (c) {

  /* ======== assemble: steps run back to back; each step's length depends on its narrative and its labels ======== */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0; TIMES[st.id] = t0;

    if (i === STEPS.length - 1) len = Math.max(len, end + FINAL_HOLD);
    var tEnd = t0 + len;

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);

      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {

      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    /* things that belong to the step only (badges of the morph step, the blocked marker) fade at its end, except on the last step */
    if (i < STEPS.length - 1) c.extra.forEach(function (d) { tl.fromTo(d, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tEnd - 0.5); });
    if (i < STEPS.length - 1) {
      var tf = t0 + Math.max(end + 0.3, c.labelEnd - 1.0);
      c.lines.forEach(function (ln) { tl.fromTo(ln, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.in' }, tf); });

    steps.push({ id: st.id, phase: st.phase, time: t0, title: st.title, body: st.body });

    t0 = tEnd;
  });

  return { steps: steps, duration: t0 };
}

/* overlap hook for the render checks: pairs of visible text boxes that intersect (dimmed text counts; a moving tag
