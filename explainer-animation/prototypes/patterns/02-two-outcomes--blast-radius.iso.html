<script>
(() => {
'use strict';

/* =====================================================================
   PATTERN 2: SAME SCENE, TWO OUTCOMES
   The same starting event is played twice on one scene; one control is the only difference. The audience keeps the first
   outcome in mind while the second plays, and the last step puts both side by side.

   Data fields that drive it (scenario data, section 1):
     RUNS[]        { id, label, color, controls[], result: { dataLost, contain } }   the two runs and what each one scores
     STEPS[].run   'A' | 'B' | 'AB'                                                   which run a step belongs to (banner, scoring)
     NODES, ZONES  one scene; ZONES are the control (they only exist in run B)
     ROUTE_SPEC    each link; `allow` marks the links that may cross a zone edge once the control is in
   Helpers that implement it (section 3):
     banner(run, t)            run banner crossfade, driven by STEPS[].run
     damage log DMG[]          mark() and trailOn() record every piece of run-A damage with its time
     rewind(t0, dur)           un-plays DMG in reverse order on the master timeline (trails retract, markers fade) and
                               hands each reached node over to a dashed ghost outline; a rewind indicator shows while it runs
     raiseZones(t, dur)        the control lands: zone slabs rise under the existing blocks (one proxy `zp.zr` lifts the whole
                               node layer and grows the slabs, so depth order is never touched)
     refuse(rid, t)            a hop that stops at a zone edge: the shield lands, the packet drops
     ghosts{}                  dashed run-A outline per node, shown for the whole of run B
     scoreSet(run, field, t)   scoreboard cell values as tweened proxies, so seeking stays exact
   ===================================================================== */

//#region pure
/* =====================================================================
   1. PURE DATA + LAYOUT  (no DOM, no gsap)
   Ground units are pixels on the isometric ground plane: +x runs down-right, +y runs down-left, +z is up.
   ===================================================================== */
const COL = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7',
              muted: '#8b98ad', accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };
const ISO_ORIGIN = { x: 1000, y: 96 };
const COS30 = Math.cos(Math.PI / 6);
function iso(x, y, z = 0) { return { x: ISO_ORIGIN.x + (x - y) * COS30, y: ISO_ORIGIN.y + (x + y) * 0.5 - z }; }
const f1 = (n) => n.toFixed(1);
const P = (x, y, z = 0) => { const q = iso(x, y, z); return f1(q.x) + ',' + f1(q.y); };
const poly = (pts) => pts.map((p) => P(p[0], p[1], p[2] || 0)).join(' ');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const textW = (str, fs) => str.length * fs * 0.62;

const HALF = 34, FOOT = 50, TH = 12, ZPAD = 40, CORR = 56;
const NODE_PX = 26, TAG_PX = 22, SAY_PX = 26, CALL_PX = 26;
const Z0 = TH;                       // the flat network slab is one level thick; every block stands on it (the zones lift the whole node layer)
const ZR = Z0 + 0.6;                 // links lie just above the slab
const GS = 270;                      // lattice step of the scene

// ---- the one scene: seven systems, left to right ----
const NODES = {
  lap:   { label: 'Laptop',            x: 0,      y: 3 * GS, h: 56, color: COL.accent,   zone: 'user',       tip: ['Laptop', 'The entry point: an employee who opened a phishing email.'] },
  hr:    { label: 'HR app',            x: 0,      y: 2 * GS, h: 60, color: '#c9d6ea',    zone: 'server',     tip: ['HR app', 'Web application for staff records. Employees legitimately reach it from their laptops.'] },
  file:  { label: 'File server',       x: GS,     y: 2 * GS, h: 64, color: '#c9d6ea',    zone: 'server',     tip: ['File server', 'Shared documents. Its local admin password is the same one used on every machine.'] },
  build: { label: 'Build server',      x: 2 * GS, y: 2 * GS, h: 60, color: '#c9d6ea',    zone: 'server',     tip: ['Build server', 'Compiles software and caches an administrator token for the domain.'] },
  dc:    { label: 'Domain\ncontroller', x: 2 * GS, y: GS,     h: 70, color: COL.identity, zone: 'restricted', tip: ['Domain controller', 'Holds every account in the company. Domain admin here means admin everywhere.'] },
  fin:   { label: 'Finance DB',        x: 3 * GS, y: GS,     h: 62, color: COL.token,    zone: 'restricted', tip: ['Finance DB', 'The crown jewel: ledgers and payment data.'] },
  bak:   { label: 'Backup server',     x: 2 * GS, y: 0,       h: 56, color: COL.muted,    zone: 'restricted', tip: ['Backup server', 'Holds the copies used to restore everything after an incident.'] },
};
const NODE_IDS = Object.keys(NODES);
const TOTAL = NODE_IDS.length;
// ---- the control: zone slabs (they only exist in run B) ----
const ZONES = {
  user:       { label: 'User zone',       kids: ['lap'],                  top: '#1b2c47' },
  server:     { label: 'Server zone',     kids: ['hr', 'file', 'build'],  top: '#1d2a44' },
  restricted: { label: 'Restricted zone', kids: ['dc', 'fin', 'bak'],     top: '#2a2540' },
};
const ZONE_IDS = Object.keys(ZONES);
const ZBOX = {};
ZONE_IDS.forEach((z) => {
  const ks = ZONES[z].kids.map((k) => NODES[k]), e = FOOT + ZPAD;
  ZBOX[z] = { x0: Math.min(...ks.map((n) => n.x)) - e, x1: Math.max(...ks.map((n) => n.x)) + e, y0: Math.min(...ks.map((n) => n.y)) - e, y1: Math.max(...ks.map((n) => n.y)) + e };
});
// ---- links; allow: may cross a zone edge once segmentation is in (the only ones that do) ----
const ROUTE_SPEC = {
  'lap-file':   { pts: ['lap', [GS, 3 * GS], 'file'], allow: false },
  'lap-hr':     { pts: ['lap', 'hr'], allow: true },
  'file-build': { pts: ['file', 'build'] },
  'build-dc':   { pts: ['build', 'dc'], allow: true },
  'dc-hr':      { pts: ['dc', [0, GS], 'hr'], allow: false },
  'dc-fin':     { pts: ['dc', 'fin'] },
  'dc-bak':     { pts: ['dc', 'bak'] },
};
function trimEnds(pts, a, b) {
  const q = pts.map((p) => p.slice());
  const cut = (p, n, d) => { const l = Math.hypot(n[0] - p[0], n[1] - p[1]); return [p[0] + (n[0] - p[0]) / l * d, p[1] + (n[1] - p[1]) / l * d]; };
  q[0] = cut(pts[0], pts[1], a);
  q[q.length - 1] = cut(pts[pts.length - 1], pts[pts.length - 2], b);
  return q;
}
// crossings of an axis-aligned polyline with the zone edges
function crossings(pts) {
  const out = []; let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    ZONE_IDS.forEach((z) => {
      const bx = ZBOX[z];
      if (Math.abs(dy) < 1e-6 && a[1] > bx.y0 && a[1] < bx.y1) [bx.x0, bx.x1].forEach((xe) => { const s = (xe - a[0]) / dx * len; if (s > 0.5 && s < len - 0.5) out.push({ x: xe, y: a[1], s: acc + s, zone: z, edge: xe === bx.x0 ? 'x0' : 'x1' }); });
      if (Math.abs(dx) < 1e-6 && a[0] > bx.x0 && a[0] < bx.x1) [bx.y0, bx.y1].forEach((ye) => { const s = (ye - a[1]) / dy * len; if (s > 0.5 && s < len - 0.5) out.push({ x: a[0], y: ye, s: acc + s, zone: z, edge: ye === bx.y0 ? 'y0' : 'y1' }); });
    });
    acc += len;
  }
  return out.sort((p, q) => p.s - q.s);
}
const screenLen = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) { const a = iso(pts[i - 1][0], pts[i - 1][1], pts[i - 1][2]), b = iso(pts[i][0], pts[i][1], pts[i][2]); s += Math.hypot(b.x - a.x, b.y - a.y); } return s; };
const polyLen = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return s; };
function cutAt(pts, s) {      // the polyline up to arc length s
  const out = [pts[0].slice()]; let rem = s;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (rem >= l) { out.push(b.slice()); rem -= l; continue; }
    const f = rem / l; out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2]]); break;
  }
  return out;
}
const ROUTES = {};
const RAW = {};
Object.keys(ROUTE_SPEC).forEach((k) => {
  const sp = ROUTE_SPEC[k], raw = sp.pts.map((e) => (typeof e === 'string' ? [NODES[e].x, NODES[e].y] : e)); RAW[k] = raw;
  const tr = trimEnds(raw, HALF + 12, HALF + 12), pts = tr.map((p) => [p[0], p[1], ZR]), gates = crossings(tr);
  ROUTES[k] = { pts, rpts: pts.slice().reverse(), gates, len: polyLen(tr), slen: screenLen(pts), from: sp.pts[0], to: sp.pts[sp.pts.length - 1], allow: sp.allow, crosses: gates.length > 0 };
});
// the attempt that stops at the server zone's near edge (run B): the same link, cut just before the edge
const REFUSE_GATE = ROUTES['lap-file'].gates.filter((g) => g.zone === 'server')[0];
(() => {
  const R = ROUTES['lap-file'], pts = cutAt(R.pts, REFUSE_GATE.s - 16);
  ROUTES['lap-file~cut'] = { pts, rpts: pts.slice().reverse(), gates: [], len: polyLen(pts), slen: screenLen(pts), from: 'lap', to: 'file', allow: false, crosses: false };
})();
// one flat ring per allowed zone-edge crossing
const MARKERS = [];
Object.keys(ROUTES).forEach((k) => { const R = ROUTES[k]; if (!R.allow) return; R.gates.forEach((q) => {
  let m = MARKERS.findIndex((o) => Math.hypot(o.x - q.x, o.y - q.y) < 40);
  if (m < 0) { MARKERS.push({ x: q.x, y: q.y, z: ZR }); m = MARKERS.length - 1; }
  q.m = m; q.f = q.s / R.len;
}); });
const routeMid = (id) => {
  const R = ROUTES[id]; let rem = polyLen(R.pts) / 2;
  for (let i = 1; i < R.pts.length; i++) {
    const a = R.pts[i - 1], b = R.pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (rem <= l && l > 0) return [a[0] + (b[0] - a[0]) * rem / l, a[1] + (b[1] - a[1]) * rem / l, a[2]];
    rem -= l;
  }
  return R.pts[R.pts.length - 1];
};
// ---- the flat network slab: union of the zone footprints and the corridors under every link (rectilinear, traced on a grid) ----
function unionCells(rects) {
  const xs = Array.from(new Set(rects.flatMap((r) => [r.x0, r.x1]))).sort((a, b) => a - b), ys = Array.from(new Set(rects.flatMap((r) => [r.y0, r.y1]))).sort((a, b) => a - b);
  const nx = xs.length - 1, ny = ys.length - 1, fill = [];
  for (let i = 0; i < nx; i++) { fill.push([]); for (let j = 0; j < ny; j++) { const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2; fill[i].push(rects.some((r) => cx > r.x0 && cx < r.x1 && cy > r.y0 && cy < r.y1)); } }
  const cells = [], edges = [], at = (i, j) => i >= 0 && j >= 0 && i < nx && j < ny && fill[i][j];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) if (fill[i][j]) {
    const c = { x0: xs[i], x1: xs[i + 1], y0: ys[j], y1: ys[j + 1] }; cells.push(c);
    if (!at(i + 1, j)) edges.push({ n: 'x+', x0: c.x1, x1: c.x1, y0: c.y0, y1: c.y1 });
    if (!at(i - 1, j)) edges.push({ n: 'x-', x0: c.x0, x1: c.x0, y0: c.y0, y1: c.y1 });
    if (!at(i, j + 1)) edges.push({ n: 'y+', x0: c.x0, x1: c.x1, y0: c.y1, y1: c.y1 });
    if (!at(i, j - 1)) edges.push({ n: 'y-', x0: c.x0, x1: c.x1, y0: c.y0, y1: c.y0 });
  }
  return { cells, edges };
}
const BASE = (() => {
  const rects = ZONE_IDS.map((z) => ZBOX[z]);
  Object.keys(RAW).forEach((k) => { const r = RAW[k]; for (let i = 1; i < r.length; i++) rects.push({ x0: Math.min(r[i - 1][0], r[i][0]) - CORR, x1: Math.max(r[i - 1][0], r[i][0]) + CORR, y0: Math.min(r[i - 1][1], r[i][1]) - CORR, y1: Math.max(r[i - 1][1], r[i][1]) + CORR }); });
  rects.push({ x0: -CORR, x1: 2 * GS + FOOT + ZPAD, y0: GS - CORR, y1: 3 * GS + FOOT + ZPAD });     // the flat network is one solid slab: close the courtyards between the links
  return unionCells(rects);
})();
const FRONT = { x: ZBOX.server.x1, y: ZBOX.server.y1 };     // the corner nearest the viewer, where the slab name tag hangs

// ---- scenario copy ----
const RUNS = [
  { id: 'A', label: 'Without segmentation', short: 'Without', color: COL.danger, controls: [],                                   result: { dataLost: true,  contain: '9 days' } },
  { id: 'B', label: 'With segmentation',    short: 'With',    color: COL.secure, controls: ['Network zones', 'Unique local admin passwords'], result: { dataLost: false, contain: '4 min' } },
];
const PHASES = [

      m.forEach(([a, b]) => { tl.fromTo(pk.tagWrap, { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, a); if (b < 1e8) tl.fromTo(pk.tagWrap, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, b); });
    });
    callEls.forEach((g, k) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, Math.max(ts + T, (r.co[k] != null ? r.co[k] : ts + T + 0.4))));
    S.end = r.end;
    const last = i === STEPS.length - 1;
    ts = last ? r.end + FINAL_HOLD : Math.max(r.end + PAUSE_AFTER_MOTION, SAYEND + PAUSE_AFTER_LABEL, ts + 1.4 + words(S.body) / BODY_WORDS_PER_S);
    S.next = ts;
    callEls.forEach((g) => tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.45, immediateRender: false }, last ? ts + 0.5 : ts - 0.5));
  });
  DURATION = ts;
  tl.set({}, {}, DURATION);
}
let DURATION = 0;

/* =====================================================================
   4. SCAFFOLDING: stage fit, narrative UI, controls, timeline contract
   ===================================================================== */
const stage = $('#stage'), wrap = $('#stagewrap');
let scale = 1;
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  scale = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(${(w - 1920 * scale) / 2}px, ${(h - 1080 * scale) / 2}px) scale(${scale})`;
}
window.addEventListener('resize', fit);

const railEls = [], dotEls = [];
function buildRail() {
  const rail = $('#rail');
  PHASES.forEach((p) => {
    const d = document.createElement('div'); d.className = 'ph';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.title; d.appendChild(nm);
    const dots = document.createElement('div'); dots.className = 'dots'; d.appendChild(dots);
    STEPS.forEach((s, i) => { if (s.phase === p.id) { const x = document.createElement('div'); x.className = 'dot'; dots.appendChild(x); dotEls[i] = x; if (p.firstStep == null) p.firstStep = i; } });
    rail.appendChild(d); railEls.push(d);
  });
}

let lastIdx = -2, lastT = 0;
function stepIndexAt(t) { let idx = -1; STEPS.forEach((s, i) => { if (t >= s.time - 1e-6) idx = i; }); return idx; }
function isPlaying() { return !tl.paused() && tl.progress() < 1; }
const capCount = $('#count'), capTitle = $('#title'), capBody = $('#body'), capId = $('#stepid');
const scrub = $('#scrub'), playBtn = $('#play'), clock = $('#clock');
function sync() {
  const t = tl.time(), idx = stepIndexAt(t);
  if (idx !== lastIdx) {
    lastIdx = idx;
    capTitle.textContent = idx >= 0 ? STEPS[idx].title : '';
    capBody.textContent = idx >= 0 ? STEPS[idx].body : '';
    capCount.textContent = (idx < 0 ? 0 : idx + 1) + ' / ' + STEPS.length;
    capId.textContent = idx >= 0 ? STEPS[idx].id : '';
    const ph = idx >= 0 ? STEPS[idx].phase : null;
    PHASES.forEach((p, pi) => { const cur = p.id === ph, done = idx >= 0 && STEPS[idx].phase !== p.id && PHASES.findIndex((q) => q.id === ph) > pi; railEls[pi].className = 'ph' + (cur ? ' cur' : done ? ' done' : ''); });
    dotEls.forEach((d, i) => { d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' cur' : ''); });
  }
  const ts = idx >= 0 ? STEPS[idx].time : 0;
  capTitle.style.opacity = idx < 0 ? 0 : clamp((t - ts) / 0.5, 0, 1);
  capBody.style.opacity = idx < 0 ? 0 : clamp((t - ts - 0.8) / 0.6, 0, 1);
  updateZones(); paintScore();
  scrub.value = t;
  clock.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1) + ' s';
  playBtn.textContent = isPlaying() ? 'Pause' : 'Play';
  lastT = t;
}
function tick() {
  if (PRESENT && !tl.paused()) {
    const t = tl.time();
    for (let i = 1; i < STEPS.length; i++) {
      const stop = STEPS[i].time - 0.02;
      if (lastT < stop - 1e-6 && t >= stop - 1e-6) { tl.pause(); tl.time(stop, true); sync(); return; }
    }
  }
  sync();
}
function setNarr(m) { NARR = m; stage.className = 'nar-' + m; $('#narr').textContent = 'Narration: ' + m; }
function setPresent(on) { PRESENT = on; $('#pres').textContent = 'Presenter: ' + (on ? 'on' : 'off'); $('#pres').classList.toggle('on', on); }
const cycleNarr = () => setNarr(NARR === 'full' ? 'caption' : NARR === 'caption' ? 'off' : 'full');

function setupControls() {
  const bar = $('#track');
  STEPS.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'tick'; d.style.left = (s.time / DURATION * 100) + '%';
    d.textContent = (i + 1) + ' ' + s.id;
    bar.appendChild(d);
  });
  scrub.max = DURATION;
  scrub.addEventListener('input', () => { api.pause(); tl.time(+scrub.value); sync(); });
  playBtn.addEventListener('click', toggle);
  $('#prev').addEventListener('click', () => goStep(-1));
  $('#next').addEventListener('click', () => goStep(1));
  $('#narr').addEventListener('click', cycleNarr);
  $('#pres').addEventListener('click', () => setPresent(!PRESENT));
  $('#speed').addEventListener('change', (e) => tl.timeScale(+e.target.value));
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); goStep(-1); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); goStep(1); }
    else if (e.code === 'Home') { e.preventDefault(); api.seek(0); api.play(); }
    else if (e.code === 'KeyN') { cycleNarr(); }
    else if (e.code === 'KeyP') { setPresent(!PRESENT); }
  });
}
function toggle() { if (isPlaying()) api.pause(); else api.play(); }
function goStep(dir) {
  const t = tl.time(), idx = stepIndexAt(t), was = isPlaying();
  let target;
  if (dir > 0) target = idx + 1 < STEPS.length ? STEPS[idx + 1].time : DURATION;
  else target = (idx >= 0 && t - STEPS[idx].time > 0.6) ? STEPS[idx].time : (idx > 0 ? STEPS[idx - 1].time : 0);
  tl.pause(); tl.time(target); sync();
  if ((was || (PRESENT && dir > 0)) && target < DURATION) api.play();
}

const api = {
  duration: 0, fps: 30, steps: [], phases: [],
  seek(t) { tl.pause(); tl.time(Math.max(0, Math.min(DURATION, t)), false); sync(); },
  play() { if (tl.progress() >= 1) tl.restart(); else tl.play(); sync(); },
  pause() { tl.pause(); sync(); },
};
window.anim = api;
window.__hops = () => HOPLOG.map((h) => ({ step: h.step, t0: h.t0, t1: h.t1, mid: (h.t0 + h.t1) / 2, rid: h.rid, ends: h.ends }));
window.__layout = () => ({ steps: STEPS.map((S) => ({ id: S.id, tags: S.lay.tags.map((t) => t.key).join(','), says: S.lay.says.map((q) => (q ? (q.forced ? 'FORCED' : 'ok') : 'DROPPED')).join(','), callouts: S.lay.callouts.map((q) => (q ? 'ok' : 'DROPPED')).join(',') })) });
window.__overlaps = () => {
  const items = [];
  document.querySelectorAll('[data-ov]').forEach((e) => {
    let op = 1, n = e;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    const r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    items.push({ k: e.getAttribute('data-ov'), el: e, r, pk: e.closest('#L-packets > g') });
  });
  let out = [];
  const blocks = Array.from(document.querySelectorAll('#L-world .node')).map((e) => e.getBoundingClientRect());
  document.querySelectorAll('line[data-ld]').forEach((ln) => {
    let op = 1, n = ln;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    const m = ln.getScreenCTM(), pt = (x, y) => ({ x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f });
    const a = pt(+ln.getAttribute('x1'), +ln.getAttribute('y1')), b = pt(+ln.getAttribute('x2'), +ln.getAttribute('y2'));
    const own = ln.parentElement.querySelector('[data-ov]'), len = Math.hypot(b.x - a.x, b.y - a.y);
    const inside = (p, r, g) => p.x > r.left + g && p.x < r.right - g && p.y > r.top + g && p.y < r.bottom - g;
    for (let k = 1; k <= 24; k++) {
      const f = k / 25, p = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
      if (f * len < 10) continue;
      items.forEach((it) => { if (it.el !== own && !it.pk && inside(p, it.r, -1)) out.push(['leader:' + (own && own.getAttribute('data-ov')), it.k]); });
      blocks.forEach((r, bi) => { if (!(a.x > r.left - 10 && a.x < r.right + 10 && a.y > r.top - 10 && a.y < r.bottom + 10) && inside(p, r, 4)) out.push(['leader:' + (own && own.getAttribute('data-ov')), 'block' + bi]); });
    }
  });
  out = out.filter((q, i) => out.findIndex((w) => w[0] === q[0] && w[1] === q[1]) === i);
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const a = items[i].r, b = items[j].r;
    if (items[i].pk && items[i].pk === items[j].pk) continue;
    if (a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom) out.push([items[i].k, items[j].k]);
  }
  return out;
};

buildTimeline();
api.duration = DURATION;
api.steps = STEPS.map((s) => ({ id: s.id, time: s.time, caption: s.title, title: s.title, body: s.body, run: s.run }));
buildRail();
api.phases = PHASES.map((p) => ({ id: p.id, title: p.title, firstStep: p.firstStep }));
setNarr(NARR); setPresent(PRESENT);
tl.eventCallback('onUpdate', tick);
tl.eventCallback('onComplete', sync);
fit();
setupControls();
api.seek(0);
if (!CAPTURE) api.play();
})();
</script>
</body>
