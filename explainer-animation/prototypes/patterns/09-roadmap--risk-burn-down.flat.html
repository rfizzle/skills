<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern 9: roadmap with risk burn-down. A three-horizon security roadmap (flat 2D)</title>
<style>
  :root {

    --text: #e6edf7; --muted: #8b98ad; --accent: #4cc9f0; --token: #f5b941;
    --identity: #a78bfa; --secure: #3ddc97; --danger: #ff5d6c;

  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script>
/* ============================================================================================================
   PATTERN 9: ROADMAP WITH RISK BURN-DOWN

   What it is: time is the scene. Initiatives sit in lanes on a time axis. A playhead sweeps the axis, one horizon
   per step. A bar is outlined while planned, fills as the playhead crosses it and is marked done when the playhead
   passes its end. When one lands, a thin link flashes from the bar to the risks it reduces, and those risk bars
   shrink by that amount, leaving a faint ghost of where they started. A headline counts the risks still above
   appetite. The audience sees the order of work, what depends on what, and what is still carried at the end.
   To reuse it for another topic, replace the data in section 1 (FIGURES, HORIZONS, LANES, RISKS, INITS, DEPS and
   the step copy). Nothing else holds a number or a name.

   Data that drives the mechanism
     FIGURES        every number on the stage: {value, unit, label, source}. Risk start values, appetites, each
                    initiative's reduction, the horizon captions and the index scale.
     HORIZONS       Now / Next / Later with a caption each (from FIGURES). Axis units: horizon k spans k to k+1.
     LANES          workstreams (rows of the roadmap).
     INITS          { id, name, lane, start, end, reduces: [{ risk, by }] }  start / end in horizon units.
     DEPS           { from, to }. Asserted at build time: to.start >= from.end.
     RISKS          { id, name, start, appetite } as FIGURES keys. Headline = count of risks above appetite.
   Helpers
     barGeo()            bar rectangle from { lane, start, end }.
     routeDep()          dependency route: direct, under (round a bar in the way) or up/down between lanes.
     runHorizon()        one step's playhead sweep: moves the playhead between landing points, fills the bars it
                         crosses (sweepTo) and pauses at each landing (land) so landings are staggered.
     land()              marks a bar done, flashes the thin links (linkTo) and shrinks the risks (shrinkRisk), and
                         counts the headline down when risks cross their appetite.
     setEmph()           text emphasis: what the step is about stays at full, the rest dims to 45%.
   Everything is a fromTo on the master timeline, so seek(t) is exact in both directions.
   ============================================================================================================ */
(function () {
'use strict';
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);

/* ==========================================================================
   1. SCENARIO DATA + LAYOUT  (pure: no DOM, no gsap)
   ========================================================================== */
var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',
          accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };

/* every number on the stage. source is 'provided' or 'illustrative'; here every figure is illustrative */
function ill(value, unit, label) { return { value: value, unit: unit, label: label, source: 'illustrative' }; }
var FIGURES = {
  'scale':         ill(100, 'index', 'Top of the risk index'),
  'h.now':         ill('0 to 6', 'months', 'Now horizon span'),
  'h.next':        ill('6 to 12', 'months', 'Next horizon span'),
  'h.later':       ill('12 to 24', 'months', 'Later horizon span'),
  'risk.ato':      ill(70, 'index', 'Account takeover today'),
  'risk.ransom':   ill(74, 'index', 'Ransomware spread today'),
  'risk.undet':    ill(68, 'index', 'Undetected breach today'),
  'risk.cust':     ill(78, 'index', 'Customer data exposure today'),
  'risk.supp':     ill(64, 'index', 'Supplier compromise today'),
  'app.ato':       ill(45, 'index', 'Account takeover appetite'),
  'app.ransom':    ill(45, 'index', 'Ransomware spread appetite'),
  'app.undet':     ill(35, 'index', 'Undetected breach appetite'),
  'app.cust':      ill(40, 'index', 'Customer data exposure appetite'),
  'app.supp':      ill(35, 'index', 'Supplier compromise appetite'),
  'cut.signin.ato':     ill(26, 'index', 'Phishing-resistant sign-in cuts account takeover'),
  'cut.logging.undet':  ill(22, 'index', 'Central logging cuts undetected breach'),
  'cut.inventory.cust': ill(12, 'index', 'Data inventory cuts customer data exposure'),
  'cut.seg.ransom':     ill(18, 'index', 'Segmentation cuts ransomware spread'),
  'cut.detect.undet':   ill(16, 'index', 'Round-the-clock detection cuts undetected breach'),
  'cut.detect.ransom':  ill(14, 'index', 'Round-the-clock detection cuts ransomware spread'),
  'cut.priv.ato':       ill(8,  'index', 'Privileged access cuts account takeover'),
  'cut.priv.ransom':    ill(6,  'index', 'Privileged access cuts ransomware spread'),
  'cut.paved.cust':     ill(6,  'index', 'Paved-road pipelines cut customer data exposure'),
  'cut.token.cust':     ill(28, 'index', 'Tokenising card data cuts customer data exposure'),
  'cut.pwless.ato':     ill(10, 'index', 'Passwordless cuts account takeover')
};
function F(k) { if (!FIGURES[k]) throw new Error('missing figure ' + k); return FIGURES[k].value; }

var HORIZONS = [
  { id: 'now',   name: 'Now',   cap: F('h.now') + ' ' + FIGURES['h.now'].unit },
  { id: 'next',  name: 'Next',  cap: F('h.next') + ' ' + FIGURES['h.next'].unit },
  { id: 'later', name: 'Later', cap: F('h.later') + ' ' + FIGURES['h.later'].unit }
];
var LANES = [
  { id: 'id',   name: ['Identity'] },
  { id: 'plat', name: ['Platform'] },
  { id: 'det',  name: ['Detection', 'and response'] },
  { id: 'data', name: ['Data', 'protection'] }
];
var RISKS = [
  { id: 'ato',    name: 'Account takeover',       start: 'risk.ato',    appetite: 'app.ato' },
  { id: 'ransom', name: 'Ransomware spread',      start: 'risk.ransom', appetite: 'app.ransom' },
  { id: 'undet',  name: 'Undetected breach',      start: 'risk.undet',  appetite: 'app.undet' },
  { id: 'cust',   name: 'Customer data exposure', start: 'risk.cust',   appetite: 'app.cust' },
  { id: 'supp',   name: 'Supplier compromise',    start: 'risk.supp',   appetite: 'app.supp' }
];
/* start / end in horizon units (Now 0..1, Next 1..2, Later 2..3). reduces[].by is a FIGURES key. */
var INITS = [
  { id: 'signin',    name: 'Phishing-resistant sign-in', lane: 'id',   start: 0.1, end: 1.0, reduces: [{ risk: 'ato', by: 'cut.signin.ato' }] },
  { id: 'priv',      name: 'Privileged access',          lane: 'id',   start: 1.5, end: 2.0, reduces: [{ risk: 'ato', by: 'cut.priv.ato' }, { risk: 'ransom', by: 'cut.priv.ransom' }] },
  { id: 'pwless',    name: 'Passwordless',               lane: 'id',   start: 2.3, end: 3.0, reduces: [{ risk: 'ato', by: 'cut.pwless.ato' }] },
  { id: 'seg',       name: 'Network segmentation',       lane: 'plat', start: 0.3, end: 1.2, reduces: [{ risk: 'ransom', by: 'cut.seg.ransom' }] },
  { id: 'paved',     name: 'Paved-road pipelines',       lane: 'plat', start: 1.7, end: 2.6, reduces: [{ risk: 'cust', by: 'cut.paved.cust' }] },
  { id: 'logging',   name: 'Central logging',            lane: 'det',  start: 0.1, end: 0.7, reduces: [{ risk: 'undet', by: 'cut.logging.undet' }] },
  { id: 'detect',    name: 'Round-the-clock detection',  lane: 'det',  start: 1.1, end: 1.9, reduces: [{ risk: 'undet', by: 'cut.detect.undet' }, { risk: 'ransom', by: 'cut.detect.ransom' }] },
  { id: 'inventory', name: 'Data inventory',             lane: 'data', start: 0.2, end: 0.8, reduces: [{ risk: 'cust', by: 'cut.inventory.cust' }] },
  { id: 'token',     name: 'Tokenise card data',         lane: 'data', start: 2.0, end: 2.8, reduces: [{ risk: 'cust', by: 'cut.token.cust' }] }
];
var DEPS = [
  { from: 'logging',   to: 'detect' },
  { from: 'inventory', to: 'token' },
  { from: 'signin',    to: 'pwless' },
  { from: 'seg',       to: 'priv' }
];
function byId(list) { var m = {}; list.forEach(function (x) { m[x.id] = x; }); return m; }
var INIT = byId(INITS), RISK = byId(RISKS), LANE_IX = {};
LANES.forEach(function (l, i) { LANE_IX[l.id] = i; });
DEPS.forEach(function (d) {   /* a bar that depends on another may not start before it ends */
  if (INIT[d.to].start < INIT[d.from].end - 1e-9) throw new Error('dependency violated: ' + d.to + ' starts before ' + d.from + ' ends');
});

/* layout (svg px, diagram area 1920x720) */
var GX0 = 262, UNIT = 330, LANE_T0 = 112, LANE_P = 144, BAR_Y = 46, BAR_H = 40, DEP_GAP = 106, LINK_GAP = 122;
var GUTTER_X = 1262, RP_X = 1274, RP_W = 626, RP_Y = 142, RP_H = 570, TRK_X = 1310, PX = 5.2, ROW0 = 196, ROW_P = 102;
var NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'];
function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function X(p) { return GX0 + p * UNIT; }
function laneTop(lane) { return LANE_T0 + LANE_IX[lane] * LANE_P; }
function barGeo(b) {
  var T = laneTop(b.lane), y0 = T + BAR_Y;
  return { x0: X(b.start), x1: X(b.end), y0: y0, y1: y0 + BAR_H, mid: y0 + BAR_H / 2, T: T };
}
function rowTop(riskId) { return ROW0 + RISKS.indexOf(RISK[riskId]) * ROW_P; }
function trackMid(riskId) { return rowTop(riskId) + 57; }
function roundedPath(pts, r) {
  var d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (var i = 1; i < pts.length - 1; i++) {
    var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    var l1 = Math.abs(p1[0] - p0[0]) + Math.abs(p1[1] - p0[1]), l2 = Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1]);
    var rr = Math.min(r, l1 / 2, l2 / 2);
    var ax = p1[0] - Math.sign(p1[0] - p0[0]) * rr, ay = p1[1] - Math.sign(p1[1] - p0[1]) * rr;
    var bx = p1[0] + Math.sign(p2[0] - p1[0]) * rr, by = p1[1] + Math.sign(p2[1] - p1[1]) * rr;
    d += ' L' + ax + ',' + ay + ' Q' + p1[0] + ',' + p1[1] + ' ' + bx + ',' + by;
  }
  var q = pts[pts.length - 1];
  return d + ' L' + q[0] + ',' + q[1];
}
/* dependency route. direct: same lane, nothing between. under: same lane, a bar in the way, so go round below.
   up / down: another lane; run along the source bar, then rise or drop into the target bar's near edge. */
function routeDep(d) {
  var a = INIT[d.from], b = INIT[d.to], ga = barGeo(a), gb = barGeo(b);
  if (a.lane === b.lane) {
    var blocked = INITS.some(function (o) { return o.lane === a.lane && o !== a && o !== b && o.start < b.start && o.end > a.end; });
    if (!blocked) return { kind: 'direct', pts: [[ga.x1, ga.mid], [gb.x0 - 3, gb.mid]] };
    var yy = ga.T + DEP_GAP;
    return { kind: 'under', pts: [[ga.x1 - 28, ga.y1], [ga.x1 - 28, yy], [gb.x0 + 28, yy], [gb.x0 + 28, gb.y1 + 3]] };
  }
  var xv = gb.x0 + 28, below = LANE_IX[b.lane] > LANE_IX[a.lane];
  return { kind: below ? 'down' : 'up', pts: [[ga.x1, ga.mid], [xv, ga.mid], [xv, below ? gb.y0 - 3 : gb.y1 + 3]] };
}
/* the story the numbers tell, computed once: landing order, values after each landing, headline counts */
var LANDINGS = INITS.slice().sort(function (p, q) { return p.end - q.end; });
function aboveCount(vals) { return RISKS.filter(function (r) { return vals[r.id] > F(r.appetite) + 1e-9; }).length; }
var VAL0 = {}; RISKS.forEach(function (r) { VAL0[r.id] = F(r.start); });
var VAL_END = Object.assign({}, VAL0);
LANDINGS.forEach(function (i) { i.reduces.forEach(function (x) { VAL_END[x.risk] -= F(x.by); }); });
var TOTAL = RISKS.length, ABOVE0 = aboveCount(VAL0), ABOVE_END = aboveCount(VAL_END);
var REMAIN = RISKS.filter(function (r) { return VAL_END[r.id] > F(r.appetite); });

var PHASES = [
  { id: 'today',   title: 'Today' },
  { id: 'plan',    title: 'The plan' },
  { id: 'remains', title: 'What remains' }
];
var STEPS = [
  { id: 'today', phase: 'today', color: C.danger, title: cap1(NUMW[ABOVE0]) + ' risks, all above appetite',
    body: 'Today all ' + NUMW[TOTAL] + ' of our top risks sit above the level we are willing to carry. The tick on each bar marks that appetite.' },
  { id: 'now', phase: 'plan', color: C.accent, h: [0, 1], title: 'Now: the first controls land',
    body: 'In the first six months sign-in, logging and data inventory land. Account takeover drops below appetite.' },
  { id: 'depends', phase: 'plan', color: C.identity, title: 'What has to come first',
    body: 'Some work cannot start until other work ends. Logging comes before round-the-clock detection, and segmentation before the access overhaul.' },
  { id: 'next', phase: 'plan', color: C.accent, h: [1, 2], title: 'Next: platform and detection',
    body: 'Segmentation lands, then round-the-clock detection and the privileged access overhaul. Ransomware and undetected breaches fall below appetite.' },
  { id: 'later', phase: 'plan', color: C.accent, h: [2, 3], title: 'Later: data and passwordless',
    body: 'Paved-road pipelines, card tokenisation and passwordless sign-in land. Customer data exposure drops below appetite; only one risk remains above.' },
  { id: 'left', phase: 'remains', color: C.danger,
    title: cap1(NUMW[ABOVE_END]) + (ABOVE_END === 1 ? ' risk is' : ' risks are') + ' still above appetite',
    body: REMAIN.map(function (r) { return r.name; }).join(', ') + ' stays at ' + Math.round(VAL_END[REMAIN[0].id]) + ', above its appetite. Nothing on this roadmap addresses it, so it needs its own plan and owner.' }
];

/* ==========================================================================
   2. SCAFFOLDING  (stage, svg helpers, controls, timeline contract)
   ========================================================================== */
var NS = 'http://www.w3.org/2000/svg';
var QS = new URLSearchParams(location.search);
var CAPTURE = QS.get('capture') === '1';
var NARR_MODES = ['full', 'caption', 'off'];
var narr = NARR_MODES.indexOf(QS.get('narration')) >= 0 ? QS.get('narration') : 'full';
var PRESENT = QS.get('present') === '1';
var stage = document.getElementById('stage');
var viewport = document.getElementById('viewport');
if (CAPTURE) document.body.classList.add('capture');

var END_AFTER_MOTION = 2.0, BODY_WPS = 3.5, FINAL_HOLD = 3.0, DIM_TEXT = 0.45, DIM_DUR = 0.4;
var SWEEP = 3.0;          /* seconds the playhead takes per horizon unit (110 px/s on the stage) */
var HOLD = 3.9;           /* from one landing to the next: link, 1.2s shrink, then the result holds about 2s */

function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, s, attrs) { var e = el('text', attrs, parent); e.textContent = s; return e; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function wordCount(s) { return s.trim().split(/\s+/).length; }

function fit() {
  var r = viewport.getBoundingClientRect();
  var s = Math.min(r.width / 1920, r.height / 1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((r.width - 1920 * s) / 2) + 'px';
  stage.style.top = ((r.height - 1080 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit();
function applyNarr() { stage.className = 'nm-' + narr; }
applyNarr();

/* ---- world: lanes, horizons, bars, dependency arrows, playhead, risk panel. Built once, at its first-state look. ---- */
function buildWorld() {
  var svg = el('svg', { viewBox: '0 0 1920 720', width: 1920, height: 720, id: 'dia' }, stage);
  svg.style.cssText = 'position:absolute;left:0;top:100px;display:block;';
  stage.insertBefore(svg, stage.firstChild);
  var rm = el('g', { opacity: 0 }, svg), rk = el('g', { opacity: 0 }, svg), fx = el('g', {}, svg);
  var L = {};
  ['bg', 'shapes', 'deps', 'play', 'labels'].forEach(function (n) { L[n] = el('g', { 'data-layer': n }, rm); });
  var W = { svg: svg, rm: rm, rk: rk, fx: fx, hz: {}, lane: {}, bar: {}, dep: [], risk: {} };

  /* horizon headers, grid, axis */
  HORIZONS.forEach(function (h, k) {
    var x = GX0 + k * UNIT;
    el('rect', { x: x + 4, y: 8, width: UNIT - 8, height: 90, rx: 14, fill: C.panel, stroke: C.line, 'stroke-width': 2.5 }, L.bg);
    var n = txt(L.labels, h.name, { x: x + UNIT / 2, y: 46, 'text-anchor': 'middle', class: 'sans', fill: C.text, 'font-size': 32, 'font-weight': 750 });

  }
  function prevStep() { var t = tl.time(), i = stepIndexAt(t); goStep(t - steps[i].time > 0.6 ? i : i - 1); }
  function nextStep() { goStep(stepIndexAt(tl.time()) + 1); }

  function setPresent(on) { PRESENT = on; bPres.textContent = 'Present: ' + (PRESENT ? 'on' : 'off'); syncUI(); }

  window.anim = { duration: duration, fps: 30,
                  phases: PHASES.map(function (p) { return { id: p.id, title: p.title, firstStep: steps.findIndex(function (s) { return s.phase === p.id; }) }; }),

                  seek: seek, play: play, pause: pause };

  var bPlay = document.getElementById('bPlay'), range = document.getElementById('range'), clock = document.getElementById('clock');
  var bNarr = document.getElementById('bNarr'), bPres = document.getElementById('bPres'), pp = document.getElementById('pp');
  var ticks = document.getElementById('ticks');

  });

  }

  document.getElementById('bPrev').addEventListener('click', prevStep);
  document.getElementById('bNext').addEventListener('click', nextStep);
  bNarr.addEventListener('click', function () { setNarr(NARR_MODES[(NARR_MODES.indexOf(narr) + 1) % 3]); });
  bPres.addEventListener('click', function () { setPresent(!PRESENT); });
  range.addEventListener('input', function () { seek(range.value / 1000 * duration); });

      tl.fromTo(w.ph, { opacity: 0 }, { opacity: 1, duration: 0.5 }, c.t0 + 0.4);
      c.firstR = 0.4;
      return runHorizon(c, 0, 1, 1.2);
    },
    depends: function (c) {
      var r = 1.0, end = 0;
      c.firstR = 1.0;
      w.dep.forEach(function (D) {
        ringBar(D.d.from, c.t0 + r, C.identity);
        tl.fromTo(D.g, { opacity: 0 }, { opacity: 1, duration: 0.01 }, c.t0 + r + 0.3);
        tl.fromTo(D.line, { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.9, ease: 'power1.inOut' }, c.t0 + r + 0.3);
        tl.fromTo(D.head, { opacity: 0 }, { opacity: 1, duration: 0.2 }, c.t0 + r + 1.1);
        ringBar(D.d.to, c.t0 + r + 1.1, C.identity);
        end = r + 1.4; r += 1.6;
      });
      tl.fromTo(w.dep.map(function (D) { return D.g; }), { opacity: 1 }, { opacity: 0.55, duration: 0.8 }, c.t0 + end + 0.8);
      return end;
    },
    next: function (c) { c.firstR = 0.4; return runHorizon(c, 1, 2, 1.0); },
    later: function (c) { c.firstR = 0.4; return runHorizon(c, 2, 3, 1.0); },
    left: function (c) {
      var t0 = c.t0;
      REMAIN.forEach(function (rr) {
        var R = w.risk[rr.id];
        tl.fromTo(R.hi, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t0 + 0.8);
        tl.fromTo(R.note, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t0 + 1.2);
      });
      tl.fromTo(measEl, { borderColor: C.line }, { borderColor: C.danger, duration: 0.6 }, t0 + 0.8);
      c.firstR = 0.8;
      return 1.8;
    }
  };

  /* ======== assemble: steps run back to back; each step's length depends on its motion and its narrative ======== */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0; TIMES[st.id] = t0;
    tl.addLabel(st.id, t0);
    var c = { st: st, t0: t0, firstR: 1e9 };
    setEmph(t0 + 0.1, st.id, st.id === 'left');
    var end = IMPL[st.id](c);
    var bodyR = Math.min(c.firstR, end) + 0.8, words = wordCount(st.body);
    var len = Math.max(end + END_AFTER_MOTION, bodyR + 0.7 + words / BODY_WPS);
    if (i === STEPS.length - 1) len = Math.max(len, end + FINAL_HOLD);
    var tEnd = t0 + len;
    st.rest = t0 + Math.min(Math.max(end, bodyR + 0.7), len - 0.4);

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
    }
    var ph = phEls[st.phase], first = !prevSt || prevSt.phase !== st.phase;
    if (first) {
      tl.fromTo(ph.name, { color: C.muted }, { color: C.text, duration: 0.4 }, t0);
      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {
      tl.fromTo(ph.name, { color: C.text }, { color: C.muted, duration: 0.4 }, tEnd);
      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    steps.push({ id: st.id, phase: st.phase, time: t0, rest: st.rest, title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  return { steps: steps, duration: t0 };
}

/* ==========================================================================
   4. GO
   ========================================================================== */
bootstrap(choreograph);

/* overlap hook for the render checks: pairs of visible text boxes that intersect (dimmed text counts).
   Run at a time t with anim.seek(t) first. */
window.__overlaps = function () {
  var items = [];
  Array.prototype.slice.call(document.querySelectorAll('#dia text, [data-ov]')).forEach(function (e) {
    var op = 1, n = e;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    var r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    var label = (e.getAttribute('data-ov') || e.textContent || '').slice(0, 30);
    items.push({ k: label, r: r });
  });
  var out = [];
  for (var i = 0; i < items.length; i++) for (var j = i + 1; j < items.length; j++) {
    var a = items[i], b = items[j];
    if (a.r.left < b.r.right && b.r.left < a.r.right && a.r.top < b.r.bottom && b.r.top < a.r.bottom) out.push([a.k, b.k]);
  }
  return out;
};
})();
