<script>
(() => {
'use strict';

//#region pure
/* =====================================================================
   1. PURE DATA + LAYOUT  (no DOM, no gsap: the node check script runs this block)
   Ground units are pixels on the isometric ground plane: +x runs down-right,
   +y runs down-left, +z is up. Containers are computed from their children.
   ===================================================================== */
const COL = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7',
              muted: '#8b98ad', accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };
const ISO_ORIGIN = { x: 1000, y: 160 };
const COS30 = Math.cos(Math.PI / 6);
function iso(x, y, z = 0) { return { x: ISO_ORIGIN.x + (x - y) * COS30, y: ISO_ORIGIN.y + (x + y) * 0.5 - z }; }
const f1 = (n) => n.toFixed(1);
const P = (x, y, z = 0) => { const q = iso(x, y, z); return f1(q.x) + ',' + f1(q.y); };
const poly = (pts) => pts.map((p) => P(p[0], p[1], p[2] || 0)).join(' ');
const textW = (str, fs) => str.length * fs * 0.62;    // width estimate for the sans face (placement only; __overlaps() is the real test)

const HALF = 34, FOOT = 50, TH = 12, PAD = 30;
const NODE_PX = 26, TAG_PX = 22, SAY_PX = 26, CALL_PX = 26;     // text sizes on the 1920x1080 stage (never scaled by the camera)
const BUS_Y = 800;                                 // the bypass lane through the account services slab

// ---- nodes (x, y = centre on the ground plane; h = block height) ----
const NODES = {
  atk:      { label: 'Attacker',            x: 100, y: 300, h: 56, color: COL.danger,   parent: 'internet',  tip: ['Attacker', 'Sits on the open Internet with nothing but a browser and a crafted URL.'] },
  cdn:      { label: 'CDN / WAF',           x: 470, y: 300, h: 70, color: COL.accent,   parent: 'edge',      tip: ['CDN / WAF', 'Edge cache and web application firewall. Filters requests before they reach the VPC.'] },
  lb:       { label: 'Load balancer',       x: 900, y: 300, h: 66, color: COL.accent,   parent: 'pub',       tip: ['Load balancer', 'Lives in the public subnet and spreads traffic across pods in the private subnet.'] },
  store:    { label: 'storefront',          x: 1210, y: 300, h: 70, color: '#c9d6ea',    parent: 'nsweb',     tip: ['storefront (pod)', 'Customer-facing web app. It fetches URLs on behalf of users, which makes it vulnerable to SSRF.'] },
  imds:     { label: 'Metadata (IMDS)',     x: 1540, y: 300, h: 56, color: '#c9d6ea',    parent: 'eks',       tip: ['Instance metadata service', '169.254.169.254, on the node. Hands the node role’s temporary credentials to anything that asks.'] },
  pay:      { label: 'payments-api',        x: 1210, y: 590, h: 70, color: '#c9d6ea',    parent: 'nspay',     tip: ['payments-api (pod)', 'Handles card payments and holds the credentials for the Orders DB.'] },
  db:       { label: 'Orders DB',           x: 900, y: 590, h: 60, color: COL.muted,    parent: 'data',      tip: ['Orders DB', 'Private data store, reachable only from the payments service.'] },
  iam:      { label: 'IAM / STS',           x: 470, y: 700, h: 66, color: COL.identity, parent: 'svc',       tip: ['IAM / STS', 'Issues and checks identities. Reachable from the Internet by anyone holding valid keys.'] },
  ct:       { label: 'CloudTrail +\nGuardDuty', x: 700, y: 700, h: 60, color: COL.secure, parent: 'svc',      tip: ['CloudTrail + GuardDuty', 'Records every API call and raises findings on suspicious ones. Detection, not prevention.'] },
  s3:       { label: 'S3 bucket', x: 470, y: 900, h: 56, color: '#c9d6ea',    parent: 'svc',       tip: ['S3 bucket "customer-exports"', 'Holds exported customer data.'] },
  sm:       { label: 'Secrets Manager',     x: 700, y: 900, h: 60, color: '#c9d6ea',    parent: 'svc',       tip: ['Secrets Manager', 'Stores the Orders DB password.'] },
};
// ---- containers (one short name each; shown as an upright tag, never painted on the slab) ----
const CONT = {
  internet: { label: 'Internet',       kids: ['atk'] },
  account:  { label: 'AWS · prod',     kids: ['edge', 'vpc', 'svc'] },
  edge:     { label: 'Edge',           kids: ['cdn'] },
  vpc:      { label: 'VPC',            kids: ['pub', 'priv', 'data'] },
  pub:      { label: 'Public subnet',  kids: ['lb'] },
  priv:     { label: 'Private subnet', kids: ['eks'] },
  eks:      { label: 'EKS cluster',    kids: ['nsweb', 'nspay', 'imds'] },
  nsweb:    { label: 'ns: web',        kids: ['store'] },
  nspay:    { label: 'ns: payments',   kids: ['pay'] },
  data:     { label: 'Data subnet',    kids: ['db'] },
  svc:      { label: 'Services',       kids: ['iam', 'ct', 's3', 'sm'] },
};
const CONT_IDS = Object.keys(CONT);

function computeLayout() {
  const level = {}, parentOf = {}, box = {}, nodeZ = {};
  const setLv = (id, lv, par) => { level[id] = lv; parentOf[id] = par; CONT[id].kids.forEach((k) => { parentOf[k] = id; if (CONT[k]) setLv(k, lv + 1, id); }); };
  ['internet', 'account'].forEach((r) => setLv(r, 0, null));
  const calc = (id) => {
    if (NODES[id]) { const n = NODES[id]; return { x0: n.x - FOOT, x1: n.x + FOOT, y0: n.y - FOOT, y1: n.y + FOOT }; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    CONT[id].kids.forEach((k) => { const b = calc(k); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); });
    const b = { x0: x0 - PAD, y0: y0 - PAD, x1: x1 + PAD, y1: y1 + PAD };
    box[id] = b; return b;
  };
  calc('account');
  calc('internet');
  box.internet.y0 = box.account.y0; box.internet.y1 = box.account.y1;
  const ztop = (id) => (level[id] + 1) * TH;
  const zAt = (x, y) => { let best = 0, bl = -1; CONT_IDS.forEach((id) => { const b = box[id]; if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1 && level[id] > bl) { bl = level[id]; best = ztop(id); } }); return best; };
  Object.keys(NODES).forEach((id) => { nodeZ[id] = ztop(NODES[id].parent); });
  return { level, parentOf, box, nodeZ, ztop, zAt };
}
const LAY = computeLayout();
const BOX = LAY.box;

// ---- routes: ground polylines along the isometric axes; entries are node ids or [x, y] waypoints ----
const ROUTE_SPEC = {
  'atk-cdn':   ['atk', 'cdn'],
  'cdn-lb':    ['cdn', 'lb'],
  'lb-store':  ['lb', 'store'],
  'store-imds': ['store', 'imds'],
  'store-pay': ['store', 'pay'],
  'pay-db':    ['pay', 'db'],
  'atk-iam':   ['atk', [NODES.atk.x, BUS_Y], [NODES.iam.x, BUS_Y], 'iam'],
  'atk-s3':    ['atk', [NODES.atk.x, BUS_Y], [NODES.s3.x, BUS_Y], 's3'],
  'atk-sm':    ['atk', [NODES.atk.x, BUS_Y], [NODES.sm.x, BUS_Y], 'sm'],
  'iam-ct':    ['iam', 'ct'],
};
function trimEnds(pts, a, b) {
  const q = pts.map((p) => p.slice());
  const cut = (p, n, d) => { const l = Math.hypot(n[0] - p[0], n[1] - p[1]); return [p[0] + (n[0] - p[0]) / l * d, p[1] + (n[1] - p[1]) / l * d]; };
  q[0] = cut(pts[0], pts[1], a);
  q[q.length - 1] = cut(pts[pts.length - 1], pts[pts.length - 2], b);
  return q;
}
// Split a ground polyline at every container edge, give each piece the height of the slab it runs on,
// and record the crossings (gates).
function route3D(pts) {
  const out = [], gates = []; let acc = 0;
  const push = (x, y, z) => { const l = out[out.length - 1]; if (!l || l[0] !== x || l[1] !== y || l[2] !== z) out.push([x, y, z]); };
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const cuts = [];
    CONT_IDS.forEach((id) => {
      const bx = BOX[id];
      if (Math.abs(dy) < 1e-6 && a[1] > bx.y0 && a[1] < bx.y1) [bx.x0, bx.x1].forEach((xe) => { const s = (xe - a[0]) / dx * len; if (s > 0.5 && s < len - 0.5) cuts.push({ s, orient: 'y' }); });
      if (Math.abs(dx) < 1e-6 && a[0] > bx.x0 && a[0] < bx.x1) [bx.y0, bx.y1].forEach((ye) => { const s = (ye - a[1]) / dy * len; if (s > 0.5 && s < len - 0.5) cuts.push({ s, orient: 'x' }); });
    });
    cuts.sort((p, q) => p.s - q.s);
    const ss = [0].concat(cuts.map((c) => c.s), [len]);
    const zs = [];
    for (let k = 0; k < ss.length - 1; k++) { const m = (ss[k] + ss[k + 1]) / 2; zs.push(LAY.zAt(a[0] + ux * m, a[1] + uy * m) + 0.6); }
    push(a[0], a[1], zs[0]);
    cuts.forEach((c, k) => {
      const cx = a[0] + ux * c.s, cy = a[1] + uy * c.s, z1 = zs[k], z2 = zs[k + 1];
      gates.push({ x: cx, y: cy, s: acc + c.s, z: Math.min(z1, z2), h: Math.abs(z2 - z1), orient: c.orient });
      if (z1 !== z2) { push(cx - ux * 7, cy - uy * 7, z1); push(cx + ux * 7, cy + uy * 7, z2); } else push(cx, cy, z1);
    });
    push(b[0], b[1], zs[zs.length - 1]);
    acc += len;
  }
  return { pts: out, gates, len: acc };
}
const screenLen = (pts) => { let s = 0; for (let i = 1; i < pts.length; i++) { const a = iso(pts[i - 1][0], pts[i - 1][1], pts[i - 1][2]), b = iso(pts[i][0], pts[i][1], pts[i][2]); s += Math.hypot(b.x - a.x, b.y - a.y); } return s; };
const ROUTES = {};
Object.keys(ROUTE_SPEC).forEach((k) => {
  const raw = ROUTE_SPEC[k].map((e) => (typeof e === 'string' ? [NODES[e].x, NODES[e].y] : e));
  const g = route3D(trimEnds(raw, HALF + 12, HALF + 12));
  g.gates.forEach((q) => { q.f = q.s / g.len; });
  ROUTES[k] = { pts: g.pts, rpts: g.pts.slice().reverse(), gates: g.gates, len: g.len, slen: screenLen(g.pts), from: ROUTE_SPEC[k][0], to: ROUTE_SPEC[k][ROUTE_SPEC[k].length - 1] };
});
// One flat port ring per slab-edge crossing; crossings closer than 36 stage px (at the full-view scale) share a ring.
const MARKERS = [];
Object.keys(ROUTES).forEach((k) => ROUTES[k].gates.forEach((q) => {
  let m = MARKERS.findIndex((o) => Math.hypot(o.x - q.x, o.y - q.y) < 36 / 0.49);
  if (m < 0) { MARKERS.push({ x: q.x, y: q.y, z: q.z }); m = MARKERS.length - 1; }
  q.m = m;
}));
const routeMid = (id) => {   // point halfway along a route (ground x, y, z)
  const R = ROUTES[id]; let rem = R.len / 2;
  for (let i = 1; i < R.pts.length; i++) {
    const a = R.pts[i - 1], b = R.pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (rem <= l && l > 0) return [a[0] + (b[0] - a[0]) * rem / l, a[1] + (b[1] - a[1]) * rem / l, a[2] + (b[2] - a[2]) * rem / l];
    rem -= l;
  }
  return R.pts[R.pts.length - 1];
};

// ---- shield markers for step 11 (label positions are found by place()) ----
const CTRL = [
  { n: '2',   step: 2, route: 'atk-cdn',    at: [NODES.cdn.x - 150, NODES.cdn.y],                              label: 'WAF rule' },
  { n: '2/3', step: 3, route: 'store-imds', at: [(NODES.store.x + NODES.imds.x) / 2, NODES.store.y],           label: 'IMDSv2 hop limit' },
  { n: '5',   step: 5, route: 'atk-s3',     at: [210, BUS_Y],                                     label: 'Least-privilege role' },
  { n: '6',   step: 6, route: 'atk-s3',     at: [NODES.s3.x, BUS_Y + 55],                                      label: 'Bucket policy' },
  { n: '8',   step: 8, route: 'store-pay',  at: [NODES.store.x, (NODES.store.y + NODES.pay.y) / 2],            label: 'Network policy' },
];

// ---- scenario copy ----
const PHASES = [
  { id: 'initial',    title: 'Initial access' },
  { id: 'credential', title: 'Credential access' },
  { id: 'discovery',  title: 'Discovery and exfiltration' },
  { id: 'lateral',    title: 'Lateral movement' },
  { id: 'detect',     title: 'Detection and controls' },
];
// says: the text a packet is "saying", shown standing still (mode 'swap': one line replaced by the next in the same place;
// mode 'list': a tally that grows). Packets themselves carry at most one or two words.
const STEPS = [
  { id: 'recon', phase: 'initial', title: 'A normal shopper request',
    body: 'Shoppers reach the storefront through the WAF and load balancer. This is normal.',
    touch: ['atk', 'cdn', 'lb', 'store'], routes: ['atk-cdn', 'cdn-lb', 'lb-store'], frame: ['atk', 'edge', 'pub', 'nsweb'],
    callouts: [{ target: 'cdn', text: 'WAF inspects every request' }, { target: 'store', text: 'Fetches URLs for users' }],
    says: [{ key: 'req', at: 'store', mode: 'swap', texts: ['GET /products'], color: COL.accent }] },
  { id: 'ssrf', phase: 'initial', title: 'Trick the storefront with SSRF',
    body: 'A crafted URL makes the storefront fetch an internal address from inside.',
    touch: ['atk', 'cdn', 'lb', 'store', 'imds'], routes: ['atk-cdn', 'cdn-lb', 'lb-store', 'store-imds'], frame: ['atk', 'edge', 'pub', 'eks'],
    callouts: [{ target: 'imds', text: 'Internal address, no auth' }],
    says: [{ key: 'url', at: 'store', mode: 'swap', texts: ['?url=http://169.254.169.254/'], color: COL.danger }] },
  { id: 'creds', phase: 'credential', title: 'The node hands over its keys',
    body: 'The metadata service hands the node’s temporary credentials back to the attacker.',
    touch: ['atk', 'cdn', 'lb', 'store', 'imds'], routes: ['atk-cdn', 'cdn-lb', 'lb-store', 'store-imds'], frame: ['atk', 'edge', 'pub', 'eks'],
    callouts: [{ target: 'imds', text: 'Role credentials, valid for hours' }],
    card: 'creds',
    says: [{ key: 'keys', at: 'atk', mode: 'swap', texts: ['stolen role credentials'], color: COL.token }] },
  { id: 'identity', phase: 'credential', title: 'Using the keys from outside',
    body: 'Stolen keys work from anywhere, skipping the WAF, load balancer and VPC.',
    touch: ['atk', 'iam'], routes: ['atk-iam'], frame: ['atk', 'svc'],

let DURATION = 0;



/* =====================================================================
   4. SCAFFOLDING: stage fit, narrative UI, mini-map, controls, timeline contract
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), wrap = $('#stagewrap');
let scale = 1;
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  scale = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(${(w - 1920 * scale) / 2}px, ${(h - 1080 * scale) / 2}px) scale(${scale})`;
}
window.addEventListener('resize', fit);

const railEls = [], dotEls = [];
function buildRail() {
  const rail = $('#rail');
  PHASES.forEach((p, pi) => {
    const d = document.createElement('div'); d.className = 'ph';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.title; d.appendChild(nm);
    const dots = document.createElement('div'); dots.className = 'dots'; d.appendChild(dots);
    STEPS.forEach((s, i) => { if (s.phase === p.id) { const x = document.createElement('div'); x.className = 'dot'; dots.appendChild(x); dotEls[i] = x; if (p.firstStep == null) p.firstStep = i; } });

// mini-map: whole estate outline, camera rectangle, active dot (all in scene coordinates)
let mmFrame, mmDot, mmFullW = 1;
function buildMinimap() {
  const mm = $('#mm'), bb = unionBB(contBBox('internet'), contBBox('account')), pad = 40;
  mm.setAttribute('viewBox', `${f1(bb.x0 - pad)} ${f1(bb.y0 - pad)} ${f1(bb.x1 - bb.x0 + 2 * pad)} ${f1(bb.y1 - bb.y0 + 2 * pad)}`);

let lastIdx = -2, lastT = 0, bodyDone = '';

    lastIdx = idx;
    capTitle.textContent = idx >= 0 ? STEPS[idx].title : '';
    capBody.textContent = idx >= 0 ? STEPS[idx].body : '';
    capCount.textContent = (idx < 0 ? 0 : idx + 1) + ' / ' + STEPS.length;
    capId.textContent = idx >= 0 ? STEPS[idx].id : '';
