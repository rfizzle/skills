<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A: flat 2D. A token-authenticated request through a service mesh</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #18202f; --line: #2a3447;
    --text: #e6edf7; --muted: #8b98ad; --accent: #4cc9f0; --token: #f5b941;
    --identity: #a78bfa; --secure: #3ddc97; --danger: #ff5d6c;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); }
  #stage svg { display: block; width: 1920px; height: 1080px; }
  .sans { font-family: var(--sans); }
  .mono { font-family: var(--mono); }
  .node { cursor: default; }
  #tip { position: absolute; display: none; width: 440px; padding: 14px 18px; box-sizing: border-box; background: var(--panel-2);
         border: 2px solid var(--line); border-radius: 14px; font-size: 24px; line-height: 1.35; color: var(--text); pointer-events: none; z-index: 5; }
  #tip b { display: block; font-size: 26px; margin-bottom: 4px; }
  #tip span { color: var(--muted); }
  #controls { flex: none; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 22px;
              background: #0e1320; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
              padding: 9px 14px; font: inherit; font-size: 16px; cursor: pointer; }
  #controls button:hover, #controls select:hover { border-color: var(--accent); }
  #bPlay { min-width: 84px; }
  #scrub { position: relative; flex: 1; height: 44px; }
  #ticks { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
  #ticks i { position: absolute; top: 6px; width: 2px; height: 14px; margin-left: -1px; background: var(--muted); opacity: .8; }
  #ticks u { position: absolute; top: 24px; transform: translateX(-50%); font-size: 12px; text-decoration: none; color: var(--muted); white-space: nowrap; }
  #range { position: absolute; left: 0; right: 0; top: 8px; width: 100%; margin: 0; height: 28px; accent-color: var(--accent); }
  #clock { min-width: 110px; text-align: right; font-family: var(--mono); font-size: 15px; }
  body.capture #controls, body.capture #tip { display: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="tip"></div></div></div>
<div id="controls">
  <button id="bPlay" title="Space">Pause</button>
  <button id="bPrev" title="Left arrow">&#9664; Step</button>
  <button id="bNext" title="Right arrow">Step &#9654;</button>
  <div id="scrub"><div id="ticks"></div><input id="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Timeline"></div>
  <span id="clock">0.0 / 0.0 s</span>
  <label>Speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script>
(function () {
'use strict';
gsap.registerPlugin(MotionPathPlugin, DrawSVGPlugin);

/* ==========================================================================
   1. SCENARIO DATA  (swap this block, and CHOREOGRAPHY below, for another scenario)
   ========================================================================== */
var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',
          accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97' };

var SCENARIO = {
  duration: 22.8,
  zoneY: 90, zoneH: 770,
  zones: [
    { id: 'internet', label: 'INTERNET',      x: 20,  w: 380 },
    { id: 'edge',     label: 'EDGE / DMZ',    x: 430, w: 530 },
    { id: 'internal', label: 'INTERNAL MESH', x: 990, w: 900 }
  ],
  nodeW: 220, nodeH: 110,
  nodes: [
    { id: 'browser',  label: 'Browser',     x: 210,  y: 480, icon: 'browser',  tint: C.text,     tip: 'Untrusted client on the public Internet. Holds the token after login.' },
    { id: 'idp',      label: 'IdP',         x: 695,  y: 250, icon: 'idp',      tint: C.identity, tip: 'Identity Provider. Authenticates users, signs JWTs, publishes its public keys (JWKS).' },
    { id: 'gateway',  label: 'API Gateway', x: 695,  y: 480, icon: 'gateway',  tint: C.text,     tip: 'Only public entry point. Verifies the JWT signature, then forwards over mTLS.' },
    { id: 'orders',   label: 'Orders',      x: 1130, y: 480, icon: 'orders',   tint: C.text,     tip: 'Orders service. Exchanges the caller’s token for a narrower one before calling Payments.' },
    { id: 'payments', label: 'Payments',    x: 1700, y: 250, icon: 'payments', tint: C.text,     tip: 'Payments service. Only ever sees a token scoped to payments:read.' },
    { id: 'db',       label: 'Orders DB',   x: 1700, y: 700, icon: 'db',       tint: C.text,     tip: 'Database owned by Orders. Reachable only from inside the mesh.' }
  ],
  /* Edges run centre to centre; nodes are drawn on top so only the visible gap shows. */
  edges: {
    login: 'M210,480 V280 Q210,250 240,250 H695',
    req:   'M210,480 H695',
    jwks:  'M695,250 V480',
    mtls:  'M695,480 H1130',
    xchg:  'M1130,480 V280 Q1130,250 1160,250 H1700',
    db:    'M1130,480 V670 Q1130,700 1160,700 H1700'
  },
  steps: [
    { id: 'login',    time: 0.0,  caption: 'Browser sends credentials to the identity provider' },
    { id: 'token',    time: 2.8,  caption: 'IdP returns a signed JWT: header, payload, signature' },
    { id: 'request',  time: 5.9,  caption: 'Browser sends GET /orders/42 with the token, crossing into the edge zone' },
    { id: 'verify',   time: 8.0,  caption: 'Gateway verifies the signature against the IdP’s public key (JWKS)' },
    { id: 'mtls',     time: 11.6, caption: 'Gateway forwards the request to Orders over mutual TLS' },
    { id: 'exchange', time: 14.4, caption: 'Orders swaps it for a down-scoped token: payments:read only' },
    { id: 'data',     time: 17.6, caption: 'Orders reads its database; the response returns via the Gateway' }
  ]
};

var ICONS = {
  browser:  '<rect x="-24" y="-17" width="48" height="34" rx="6"/><path d="M-24,-6 H24"/><path d="M-17,-11.5 H-16.5 M-11,-11.5 H-10.5"/>',
  idp:      '<path d="M0,-21 L18,-14 V2 C18,13 9,19 0,23 C-9,19 -18,13 -18,2 V-14 Z"/><circle cx="0" cy="-5" r="5"/><path d="M-9,12 C-9,5 9,5 9,12"/>',
  gateway:  '<path d="M-22,20 V-4 A22,22 0 0 1 22,-4 V20"/><path d="M-10,8 H10 M3,1 L10,8 L3,15"/>',
  orders:   '<path d="M0,-21 L19,-10 V11 L0,22 L-19,11 V-10 Z"/><path d="M-19,-10 L0,1 L19,-10 M0,1 V22"/>',
  payments: '<rect x="-24" y="-15" width="48" height="30" rx="5"/><path d="M-24,-5 H24 M-16,7 H-4"/>',
  db:       '<ellipse cx="0" cy="-14" rx="19" ry="6.5"/><path d="M-19,-14 V14 C-19,18 -10,21 0,21 C10,21 19,18 19,14 V-14"/><path d="M-19,0 C-19,4 -10,7 0,7 C10,7 19,4 19,0"/>'
};

/* ==========================================================================
   2. SCAFFOLDING  (stage, svg helpers, world builder, controls, timeline contract)
   ========================================================================== */
var NS = 'http://www.w3.org/2000/svg';
var CAPTURE = new URLSearchParams(location.search).get('capture') === '1';
var stage = document.getElementById('stage');
var viewport = document.getElementById('viewport');
if (CAPTURE) document.body.classList.add('capture');

function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, s, attrs) { var e = el('text', attrs, parent); e.textContent = s; return e; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---- stage scaling ---- */
function fit() {
  var r = viewport.getBoundingClientRect();
  var s = Math.min(r.width / 1920, r.height / 1080);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.left = ((r.width - 1920 * s) / 2) + 'px';
  stage.style.top = ((r.height - 1080 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);
fit();

/* ---- world: layers, zones, idle edges, nodes, hud ---- */
function buildWorld(S) {
  var svg = el('svg', { viewBox: '0 0 1920 1080', width: 1920, height: 1080 }, stage);
  el('defs', {}, svg);
  var L = {};
  ['zones', 'edges', 'fx', 'packets', 'nodes', 'top', 'hud'].forEach(function (n) { L[n] = el('g', { 'data-layer': n }, svg); });

  var boundaries = [];
  S.zones.forEach(function (z, i) {
    el('rect', { x: z.x, y: S.zoneY, width: z.w, height: S.zoneH, rx: 24, fill: C.panel2, 'fill-opacity': 0.35,
                 stroke: C.line, 'stroke-width': 2, 'stroke-dasharray': '10 8' }, L.zones);
    txt(L.zones, z.label, { x: z.x + 28, y: S.zoneY + 46, class: 'sans', fill: C.muted, 'font-size': 24, 'font-weight': 700, 'letter-spacing': 3 });
    if (i < S.zones.length - 1) {
      var bx = (z.x + z.w + S.zones[i + 1].x) / 2;
      var ln = el('line', { x1: bx, x2: bx, y1: S.zoneY, y2: S.zoneY + S.zoneH, stroke: C.accent, 'stroke-width': 4, opacity: 0 }, L.zones);
      boundaries.push({ x: bx, line: ln });
    }
  });

  var E = {};
  Object.keys(S.edges).forEach(function (id) {
    E[id] = el('path', { id: 'edge-' + id, d: S.edges[id], fill: 'none', stroke: C.line, 'stroke-width': 3, 'stroke-linecap': 'round' }, L.edges);
  });

  var N = {};
  var tip = document.getElementById('tip');
  S.nodes.forEach(function (n) {
    var g = el('g', { class: 'node', transform: 'translate(' + n.x + ',' + n.y + ')' }, L.nodes);
    var hw = S.nodeW / 2, hh = S.nodeH / 2;
    el('rect', { x: -hw, y: -hh, width: S.nodeW, height: S.nodeH, rx: 18, fill: C.panel, stroke: C.line, 'stroke-width': 2 }, g);
    var ig = el('g', { transform: 'translate(0,-17)', fill: 'none', stroke: n.tint, 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    ig.innerHTML = ICONS[n.icon];
    txt(g, n.label, { x: 0, y: 38, 'text-anchor': 'middle', class: 'sans', fill: C.text, 'font-size': 26, 'font-weight': 600 });
    N[n.id] = { g: g, x: n.x, y: n.y, def: n };
    if (!CAPTURE) {
      g.addEventListener('mouseenter', function () {
        tip.innerHTML = '<b>' + n.label + '</b><span>' + n.tip + '</span>';
        tip.style.display = 'block';
        tip.style.left = clamp(n.x - 220, 10, 1470) + 'px';
        tip.style.top = (n.y + 66) + 'px';
      });
      g.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    }
  });
  return { svg: svg, L: L, E: E, N: N, boundaries: boundaries, S: S };
}

/* ---- timeline helpers shared by any scenario ---- */
var EASE_TRAVEL = 'power2.inOut';
function invEase(name, p) {
  var f = gsap.parseEase(name), lo = 0, hi = 1;
  for (var i = 0; i < 40; i++) { var m = (lo + hi) / 2; if (f(m) < p) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
/* time at which a packet travelling on edge `id` first crosses axis=val (reverse = from the path end) */
function crossT(w, id, axis, val, t0, dur, reverse) {
  var p = w.E[id], len = p.getTotalLength(), n = 400, prev = null, f = 0;
  for (var i = 0; i <= n; i++) {
    var s = i / n, pt = p.getPointAtLength((reverse ? 1 - s : s) * len), d = pt[axis] - val;
    if (prev !== null && (prev <= 0) !== (d <= 0)) { f = s; break; }
    prev = d;
  }
  return t0 + invEase(EASE_TRAVEL, f) * dur;
}
function travel(tl, w, g, id, t, dur, reverse) {
  tl.set(g, { opacity: 1 }, t);
  tl.to(g, { motionPath: { path: w.E[id], start: reverse ? 1 : 0, end: reverse ? 0 : 1 }, duration: dur, ease: EASE_TRAVEL }, t);
  tl.set(g, { opacity: 0 }, t + dur + 0.001);
}
/* a fresh accent line drawn over an idle edge, then faded */
function activate(tl, w, id, t, dur, o) {
  o = o || {};
  var p = el('path', { d: w.S.edges[id], fill: 'none', stroke: o.color || C.accent, 'stroke-width': 5, 'stroke-linecap': 'butt', opacity: 0 }, w.L.fx);
  tl.set(p, { opacity: 1 }, t);
  tl.fromTo(p, { drawSVG: o.reverse ? '100% 100%' : '0% 0%' }, { drawSVG: o.reverse ? '0% 100%' : '0% 100%', duration: dur, ease: 'power2.out' }, t);
  if (o.fadeAt != null) tl.fromTo(p, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in' }, o.fadeAt);
  return p;
}
function ring(tl, w, nodeId, t, color) {
  var n = w.N[nodeId], hw = w.S.nodeW / 2, hh = w.S.nodeH / 2;
  var r = el('rect', { x: -hw, y: -hh, width: w.S.nodeW, height: w.S.nodeH, rx: 18, fill: 'none', stroke: color, 'stroke-width': 4, opacity: 0 }, n.g);
  tl.fromTo(r, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'power2.out' }, t);
  tl.fromTo(r, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: 'power2.in' }, t + 0.55);
}
function ripple(tl, w, x, y, t, color) {
  var b = w.boundaries.reduce(function (a, c) { return Math.abs(c.x - x) < Math.abs(a.x - x) ? c : a; });
  tl.fromTo(b.line, { opacity: 0 }, { opacity: 0.85, duration: 0.15, ease: 'power2.out' }, t);
  tl.fromTo(b.line, { opacity: 0.85 }, { opacity: 0, duration: 0.7, ease: 'power2.in' }, t + 0.25);
  var c = el('circle', { cx: x, cy: y, r: 10, fill: 'none', stroke: color, 'stroke-width': 4, opacity: 0 }, w.L.top);
  tl.fromTo(c, { attr: { r: 10 }, opacity: 0.9 }, { attr: { r: 48 }, opacity: 0, duration: 0.8, ease: 'power2.out' }, t);
}

/* ---- timeline contract + controls ---- */
function bootstrap(S, choreograph) {
  var world = buildWorld(S);
  var tl = gsap.timeline({ paused: true, onUpdate: syncUI });
  /* fromTo must not render its start state at build time: every state is a function of timeline time */
  var rawFromTo = tl.fromTo.bind(tl);
  tl.fromTo = function (t, from, to, pos) { to.immediateRender = false; return rawFromTo(t, from, to, pos); };
  S.steps.forEach(function (s) { tl.addLabel(s.id, s.time); });
  choreograph(tl, world);
  tl.set({}, {}, S.duration); /* pins the timeline length */
  var duration = tl.duration();

  function stepIndexAt(t) {
    var idx = 0;
    S.steps.forEach(function (s, i) { if (t >= s.time - 1e-6) idx = i; });
    return idx;
  }
  function seek(t) { tl.pause(); tl.time(clamp(t, 0, duration), false); syncUI(); }
  function play() { if (tl.time() >= duration - 1e-6) tl.time(0, true); tl.play(); syncUI(); }
  function pause() { tl.pause(); syncUI(); }
  function isPlaying() { return !tl.paused() && tl.time() < duration - 1e-6; }
  function goStep(i) {
    var was = isPlaying();
    if (i < 0) i = 0;
    var t = i >= S.steps.length ? duration : S.steps[i].time + 0.0001;
    tl.time(t, false);
    if (was) tl.play(); else tl.pause();
    syncUI();
  }
  function prevStep() { var t = tl.time(), i = stepIndexAt(t); goStep(t - S.steps[i].time > 0.6 ? i : i - 1); }
  function nextStep() { goStep(stepIndexAt(tl.time()) + 1); }

  window.anim = { duration: duration, fps: 30, steps: S.steps.map(function (s) { return { id: s.id, time: s.time, caption: s.caption }; }),
                  seek: seek, play: play, pause: pause };

  /* controls (skipped visually in capture mode, but harmless) */
  var bPlay = document.getElementById('bPlay'), range = document.getElementById('range'), clock = document.getElementById('clock');
  var ticks = document.getElementById('ticks');
  S.steps.forEach(function (s) {
    var left = 'calc(8px + (100% - 16px) * ' + (s.time / duration) + ')';
    var i = document.createElement('i'); i.style.left = left; ticks.appendChild(i);
    var u = document.createElement('u'); u.style.left = left; u.textContent = s.id; ticks.appendChild(u);
  });
  function syncUI() {
    var t = tl.time();
    range.value = Math.round(t / duration * 1000);
    clock.textContent = t.toFixed(1) + ' / ' + duration.toFixed(1) + ' s';
    bPlay.textContent = isPlaying() ? 'Pause' : (t >= duration - 1e-6 ? 'Replay' : 'Play');
  }
  bPlay.addEventListener('click', function () { isPlaying() ? pause() : play(); });
  document.getElementById('bPrev').addEventListener('click', prevStep);
  document.getElementById('bNext').addEventListener('click', nextStep);
  range.addEventListener('input', function () { seek(range.value / 1000 * duration); });
  document.getElementById('speed').addEventListener('change', function (e) { tl.timeScale(parseFloat(e.target.value)); });
  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') && e.code === 'Space') e.target.blur();
    if (e.code === 'Space') { e.preventDefault(); isPlaying() ? pause() : play(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); prevStep(); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); nextStep(); }
    else if (e.code === 'Home') { e.preventDefault(); seek(0); play(); }
  });

  tl.time(0, false);
  syncUI();
  if (!CAPTURE) tl.play(); else tl.pause();
  syncUI();
  return tl;
}

/* ==========================================================================
   3. SCENARIO ART  (token pill, chips, cards: scenario specific building blocks)
   ========================================================================== */
var MONO_W = 13.2; /* advance of a 22px monospace glyph */
var FILL = { hd: 'rgba(245,185,65,0.16)', pl: 'rgba(245,185,65,0.48)', sg: 'rgba(167,139,250,0.5)' };
var STROKE = { hd: C.token, pl: C.token, sg: C.identity };

function mkChip(parent, label, color, w, cy) {
  var g = el('g', { transform: 'translate(0,' + (cy || 0) + ')' }, parent);
  w = w || Math.round(label.length * MONO_W + 32);
  el('rect', { x: -w / 2, y: -22, width: w, height: 44, rx: 12, fill: C.panel, stroke: color, 'stroke-width': 2.5 }, g);
  el('rect', { x: -w / 2, y: -22, width: w, height: 44, rx: 12, fill: color, 'fill-opacity': 0.16 }, g);
  var t = txt(g, label, { x: 0, y: 0, dy: '.35em', 'text-anchor': 'middle', class: 'mono', fill: C.text, 'font-size': 22 });
  return { g: g, text: t };
}

/* compact three-part JWT pill, centred on (0,cy) */
function mkPill(parent, cy) {
  var g = el('g', { transform: 'translate(0,' + (cy || 0) + ')' }, parent);
  var cont = el('rect', { x: -91, y: -20, width: 182, height: 40, rx: 20, fill: C.panel, stroke: C.line, 'stroke-width': 2 }, g);
  var hd = el('rect', { x: -81, y: -12, width: 42, height: 24, rx: 7, fill: FILL.hd, stroke: STROKE.hd, 'stroke-width': 2 }, g);
  var pl = el('rect', { x: -33, y: -12, width: 56, height: 24, rx: 7, fill: FILL.pl, stroke: STROKE.pl, 'stroke-width': 2 }, g);
  var sg = el('rect', { x: 29, y: -12, width: 52, height: 24, rx: 7, fill: FILL.sg, stroke: STROKE.sg, 'stroke-width': 2 }, g);
  return { g: g, cont: cont, hd: hd, pl: pl, sg: sg };
}

function mkPacket(parent) { return el('g', { opacity: 0 }, parent); }

var CIPHER_SET = '0123456789abcdefABCDEF#$%&@!?<>~';
function cipherText(n, p) { /* pure function of p: deterministic */
  var h = ((Math.floor(p * 28) + 1) * 2654435761) >>> 0, s = '';
  for (var i = 0; i < n; i++) { h = (Math.imul(h ^ (i + 1), 1103515245) + 12345) >>> 0; s += CIPHER_SET[(h >>> 16) % CIPHER_SET.length]; }
  return s;
}

/* a clipped "reveal" group: card unrolls downwards from its top edge */
var clipN = 0;
function mkReveal(w, cx, top, width, H) {
  var id = 'clip' + (clipN++);
  var cp = el('clipPath', { id: id }, w.svg.querySelector('defs'));
  var rect = el('rect', { x: -width / 2 - 14, y: -12, width: width + 28, height: 0 }, cp);
  var g = el('g', { transform: 'translate(' + cx + ',' + top + ')', 'clip-path': 'url(#' + id + ')' }, w.L.top);
  return { g: g, clip: rect, H: H + 24 };
}
function revealOpen(tl, r, t, dur) { tl.fromTo(r.clip, { attr: { height: 0 } }, { attr: { height: r.H }, duration: dur, ease: 'power2.out' }, t); }
function revealClose(tl, r, t, dur) { tl.fromTo(r.clip, { attr: { height: r.H } }, { attr: { height: 0 }, duration: dur, ease: 'power2.in' }, t); }

/* the expanded JWT card: three labelled parts + readable claims; local origin = top centre */
function mkTokenCard(w, cx, top) {
  var CW = 352, H = 236;
  var r = mkReveal(w, cx, top, CW, H), g = r.g;
  el('rect', { x: -CW / 2, y: 0, width: CW, height: H, rx: 16, fill: C.panel, stroke: C.line, 'stroke-width': 2 }, g);
  var parts = [['hd', 'header', 89], ['pl', 'payload', 102], ['sg', 'signature', 129]], x = -168, chips = {};
  parts.forEach(function (p) {
    var cg = el('g', {}, g);
    el('rect', { x: x, y: 14, width: p[2], height: 34, rx: 9, fill: FILL[p[0]], stroke: STROKE[p[0]], 'stroke-width': 2 }, cg);
    txt(cg, p[1], { x: x + p[2] / 2, y: 31, dy: '.35em', 'text-anchor': 'middle', class: 'mono', fill: C.text, 'font-size': 22 });
    chips[p[0]] = { x: x, w: p[2] };
    x += p[2] + 8;
  });
  var rows = [['sub', 'u_42', 86], ['aud', 'orders-api', 118], ['exp', '15:30', 150], ['scope', 'orders:read', 182], ['', 'payments:read', 214]];
  rows.forEach(function (rw) {
    if (rw[0]) txt(g, rw[0], { x: -160, y: rw[2], class: 'mono', fill: C.muted, 'font-size': 22 });
    txt(g, rw[1], { x: -72, y: rw[2], class: 'mono', fill: C.text, 'font-size': 22 });
  });
  var sgx = chips.sg.x + chips.sg.w / 2;
  /* verification furniture, revealed in the verify step */
  var sigHi = el('rect', { x: chips.sg.x - 3, y: 11, width: chips.sg.w + 6, height: 40, rx: 11, fill: 'rgba(61,220,151,0.35)', stroke: C.secure, 'stroke-width': 4, opacity: 0 }, g);
  var conn = el('path', { d: 'M' + sgx + ',52 C' + sgx + ',110 138,100 138,148', fill: 'none', stroke: C.identity, 'stroke-width': 3, 'stroke-dasharray': '1 0', opacity: 0 }, g);
  var keyW = el('g', { transform: 'translate(138,172)' }, g);
  var key = el('g', { fill: 'none', stroke: C.identity, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0 }, keyW);
  key.innerHTML = '<circle cx="-12" cy="0" r="8"/><path d="M-4,0 H18 M11,0 V8 M18,0 V6"/>';
  var tickW = el('g', { transform: 'translate(' + (chips.sg.x + chips.sg.w - 2) + ',14)' }, g);
  var tick = el('g', { opacity: 0 }, tickW);
  el('circle', { cx: 0, cy: 0, r: 15, fill: C.secure }, tick);
  el('path', { d: 'M-6.5,0.5 L-2,5 L7,-5', fill: 'none', stroke: C.bg, 'stroke-width': 3.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, tick);
  return { r: r, sigHi: sigHi, conn: conn, key: key, tick: tick };
}

/* ==========================================================================
   4. CHOREOGRAPHY  (all visual state is a function of timeline time)
   ========================================================================== */
function choreograph(tl, w) {
  var S = w.S, N = w.N, T = {};
  S.steps.forEach(function (s) { T[s.id] = s.time; });

  /* ---- hud: caption + counter per step, crossfaded on the timeline ---- */
  S.steps.forEach(function (s, i) {
    var g = el('g', { opacity: 0 }, w.L.hud);
    txt(g, (i + 1) + ' / ' + S.steps.length, { x: 60, y: 960, class: 'sans', fill: C.accent, 'font-size': 40, 'font-weight': 700 });
    txt(g, s.id, { x: 60, y: 1006, class: 'mono', fill: C.muted, 'font-size': 24 });
    txt(g, s.caption, { x: 260, y: 972, class: 'sans', fill: C.text, 'font-size': 40, 'font-weight': 500 });
    if (i === 0) tl.set(g, { opacity: 1 }, 0);
    else tl.fromTo(g, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, s.time);
    if (i < S.steps.length - 1) tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.in' }, S.steps[i + 1].time - 0.05);
  });
  el('line', { x1: 60, x2: 1860, y1: 892, y2: 892, stroke: C.line, 'stroke-width': 2 }, w.L.hud);

  /* ---- packets (under the nodes, so they emerge from and sink behind them) ---- */
  var pLogin = mkPacket(w.L.packets); mkChip(pLogin, 'credentials', C.accent);
  var pToken = mkPacket(w.L.packets); mkPill(pToken);
  var pReq = mkPacket(w.L.packets); mkChip(pReq, 'GET /orders/42', C.accent, null, -26); mkPill(pReq, 26);
  var pKey = mkPacket(w.L.packets);
  var kg = el('g', { fill: 'none', stroke: C.identity, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, pKey);
  kg.innerHTML = '<circle cx="-14" cy="0" r="9"/><path d="M-5,0 H20 M12,0 V9 M20,0 V7"/>';
  var pQ = mkPacket(w.L.packets); mkChip(pQ, 'SELECT 42', C.accent);
  var pR = mkPacket(w.L.packets); mkChip(pR, 'order 42', C.accent);
  var pX = mkPacket(w.L.packets), xPill = mkPill(pX, -14);
  var xLab = txt(pX, 'payments:read', { x: 0, y: 40, 'text-anchor': 'middle', class: 'mono', fill: C.token, 'font-size': 22, opacity: 0 });
  var pResp = mkPacket(w.L.packets); mkChip(pResp, '200 OK', C.accent);

  function mkDual(plain) { /* plaintext chip that crossfades into ciphertext */
    var g = mkPacket(w.L.packets);
    var a = mkChip(g, plain, C.accent, 220), b = mkChip(g, cipherText(14, 0), C.secure, 220);
    b.g.setAttribute('opacity', 0);
    return { g: g, plain: a.g, cipher: b.g, text: b.text };
  }
  var pEnc = mkDual('GET /orders/42'), pEncBack = mkDual('200 OK');

  var dockA = el('g', {}, w.L.packets), dockB = el('g', {}, w.L.packets);
  mkPill(dockA); mkPill(dockB);
  gsap.set(dockA, { x: N.browser.x, y: N.browser.y });
  gsap.set(dockB, { x: N.gateway.x, y: N.gateway.y });

  function scramble(dual, t0, dur) { /* ciphertext characters are a pure function of tween progress */
    var o = { p: 0 };
    tl.fromTo(o, { p: 0 }, { p: 1, duration: dur, ease: 'none', onUpdate: function () { dual.text.textContent = cipherText(14, o.p); } }, t0);
  }
  function crossfade(dual, t, d) {
    tl.fromTo(dual.plain, { opacity: 1 }, { opacity: 0, duration: d, ease: 'none' }, t);
    tl.fromTo(dual.cipher, { opacity: 0 }, { opacity: 1, duration: d, ease: 'none' }, t);
  }

  /* ---- step 1: login (0.0) ---- */
  ring(tl, w, 'browser', 0.2, C.accent);
  var a1 = activate(tl, w, 'login', 0.35, 0.7, { fadeAt: 2.35 });
  travel(tl, w, pLogin, 'login', 0.7, 1.4, false);
  ripple(tl, w, 415, 250, crossT(w, 'login', 'x', 415, 0.7, 1.4, false), C.accent);
  ring(tl, w, 'idp', 2.1, C.identity);

  /* ---- step 2: token (2.8) ---- */
  activate(tl, w, 'login', 3.0, 0.6, { reverse: true, color: C.token, fadeAt: 4.7 });
  travel(tl, w, pToken, 'login', 3.1, 1.4, true);
  ripple(tl, w, 415, 250, crossT(w, 'login', 'x', 415, 3.1, 1.4, true), C.token);
  ring(tl, w, 'browser', 4.5, C.token);
  var cardA = mkTokenCard(w, N.browser.x, 590);
  tl.fromTo(dockA, { y: N.browser.y }, { y: 560, duration: 0.4, ease: 'power2.out' }, 4.5);
  revealOpen(tl, cardA.r, 4.9, 0.7);
  /* card collapses back to a pill as the request starts */
  revealClose(tl, cardA.r, T.request, 0.4);
  tl.fromTo(dockA, { y: 560 }, { y: N.browser.y, duration: 0.35, ease: 'power2.in' }, T.request + 0.1);

  /* ---- step 3: request (5.9) ---- */
  activate(tl, w, 'req', 6.0, 0.5, { fadeAt: 7.7 });
  travel(tl, w, pReq, 'req', 6.3, 1.2, false);
  ripple(tl, w, 415, 480, crossT(w, 'req', 'x', 415, 6.3, 1.2, false), C.accent);
  ring(tl, w, 'gateway', 7.5, C.accent);

  /* ---- step 4: verify (8.0) ---- */
  var cardB = mkTokenCard(w, N.gateway.x, 590);
  tl.fromTo(dockB, { y: N.gateway.y }, { y: 560, duration: 0.4, ease: 'power2.out' }, 8.0);
  revealOpen(tl, cardB.r, 8.4, 0.7);
  activate(tl, w, 'jwks', 9.0, 0.5, { color: C.identity, fadeAt: 10.3 });
  var jw = txt(w.L.top, 'JWKS', { x: 718, y: 372, class: 'mono', fill: C.identity, 'font-size': 22, opacity: 0 });
  tl.fromTo(jw, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.0);
  tl.fromTo(jw, { opacity: 1 }, { opacity: 0, duration: 0.3 }, 10.2);
  travel(tl, w, pKey, 'jwks', 9.2, 0.9, false);
  ring(tl, w, 'gateway', 10.1, C.identity);
  tl.fromTo(cardB.key, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.8)' }, 10.1);
  tl.fromTo(cardB.conn, { opacity: 1, drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.4, ease: 'power2.out' }, 10.35);
  tl.fromTo(cardB.sigHi, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 10.8);
  tl.fromTo(cardB.tick, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.2)' }, 11.0);
  ring(tl, w, 'gateway', 11.0, C.secure);

  /* ---- step 5: mtls (11.6) ---- */
  revealClose(tl, cardB.r, T.mtls, 0.4);
  tl.fromTo(dockB, { y: 560 }, { y: N.gateway.y, duration: 0.35, ease: 'power2.in' }, T.mtls + 0.1);
  var tun = el('g', { opacity: 0 }, w.L.edges);
  var tunParts = [
    el('path', { d: 'M695,480 H1130', fill: 'none', stroke: C.secure, 'stroke-opacity': 0.16, 'stroke-width': 64 }, tun),
    el('path', { d: 'M695,450 H1130', fill: 'none', stroke: C.secure, 'stroke-width': 3 }, tun),
    el('path', { d: 'M695,510 H1130', fill: 'none', stroke: C.secure, 'stroke-width': 3 }, tun)
  ];
  tl.set(tun, { opacity: 1 }, 11.8);
  tunParts.forEach(function (p) { tl.fromTo(p, { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.7, ease: 'power2.inOut' }, 11.8); });
  function mkLock(x) {
    var wrap = el('g', { transform: 'translate(' + x + ',480)' }, w.L.top);
    var g = el('g', { opacity: 0 }, wrap);
    el('circle', { cx: 0, cy: 0, r: 23, fill: C.bg, stroke: C.secure, 'stroke-width': 3 }, g);
    var ic = el('g', { fill: 'none', stroke: C.secure, 'stroke-width': 2.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    ic.innerHTML = '<rect x="-9" y="-1" width="18" height="13" rx="3"/><path d="M-5.5,-1 V-5 A5.5,5.5 0 0 1 5.5,-5 V-1"/>';
    return g;
  }
  var lockA = mkLock(836), lockB = mkLock(989);
  tl.fromTo(lockA, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 12.35);
  tl.fromTo(lockB, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 12.5);
  var mt = txt(w.L.top, 'mTLS', { x: 912, y: 436, 'text-anchor': 'middle', class: 'mono', fill: C.secure, 'font-size': 22, 'font-weight': 700, opacity: 0 });
  tl.fromTo(mt, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 12.5);
  var mtD = 1.2;
  travel(tl, w, pEnc.g, 'mtls', 12.6, mtD, false);
  var lockT = crossT(w, 'mtls', 'x', 836, 12.6, mtD, false);
  crossfade(pEnc, lockT - 0.12, 0.25);
  scramble(pEnc, 12.6, mtD);
  ripple(tl, w, 975, 480, crossT(w, 'mtls', 'x', 975, 12.6, mtD, false), C.secure);
  ring(tl, w, 'orders', 13.8, C.secure);

  /* ---- step 6: exchange (14.4) ---- */
  ring(tl, w, 'orders', 14.4, C.token);
  var cx = 1420, cTop = 404, CWc = 260, CH = 152;
  var cardC = mkReveal(w, cx, cTop, CWc, CH);
  el('rect', { x: -CWc / 2, y: 0, width: CWc, height: CH, rx: 16, fill: C.panel, stroke: C.line, 'stroke-width': 2 }, cardC.g);
  txt(cardC.g, 'scope', { x: -112, y: 34, class: 'mono', fill: C.muted, 'font-size': 22 });
  var chA = el('g', {}, cardC.g), chB = el('g', {}, cardC.g);
  el('rect', { x: -112, y: 48, width: 224, height: 38, rx: 10, fill: FILL.pl, stroke: C.token, 'stroke-width': 2 }, chA);
  txt(chA, 'orders:read', { x: 0, y: 67, dy: '.35em', 'text-anchor': 'middle', class: 'mono', fill: C.text, 'font-size': 22 });
  el('rect', { x: -112, y: 98, width: 224, height: 38, rx: 10, fill: FILL.pl, stroke: C.token, 'stroke-width': 2 }, chB);
  txt(chB, 'payments:read', { x: 0, y: 117, dy: '.35em', 'text-anchor': 'middle', class: 'mono', fill: C.text, 'font-size': 22 });
  var strike = el('line', { x1: -78, x2: 78, y1: 67, y2: 67, stroke: C.text, 'stroke-width': 3.5, 'stroke-linecap': 'round', opacity: 0 }, cardC.g);
  revealOpen(tl, cardC, 14.5, 0.5);
  tl.set(strike, { opacity: 1 }, 15.3);
  tl.fromTo(strike, { drawSVG: '0% 0%' }, { drawSVG: '0% 100%', duration: 0.35, ease: 'power2.out' }, 15.3);
  tl.fromTo(chA, { opacity: 1 }, { opacity: 0.3, duration: 0.3 }, 15.65);
  activate(tl, w, 'xchg', 15.0, 0.6, { color: C.token, fadeAt: 16.7 });
  travel(tl, w, pX, 'xchg', 15.2, 1.3, false);
  tl.fromTo(xPill.pl, { attr: { width: 56 } }, { attr: { width: 34 }, duration: 0.5, ease: 'power2.inOut' }, 15.5);
  tl.fromTo(xPill.sg, { attr: { x: 29 } }, { attr: { x: 7 }, duration: 0.5, ease: 'power2.inOut' }, 15.5);
  tl.fromTo(xPill.cont, { attr: { width: 182 } }, { attr: { width: 160 }, duration: 0.5, ease: 'power2.inOut' }, 15.5);
  tl.fromTo(xLab, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 15.7);
  ring(tl, w, 'payments', 16.5, C.token);
  revealClose(tl, cardC, 16.9, 0.4);

  /* ---- step 7: data (17.6) ---- */
  activate(tl, w, 'db', 17.7, 0.5, { fadeAt: 20.2 });
  travel(tl, w, pQ, 'db', 17.9, 1.0, false);
  ring(tl, w, 'db', 18.9, C.accent);
  travel(tl, w, pR, 'db', 19.0, 0.9, true);
  ring(tl, w, 'orders', 19.9, C.accent);

  var backD = 0.8;
  travel(tl, w, pEncBack.g, 'mtls', 20.0, backD, true);
  var lockBackT = crossT(w, 'mtls', 'x', 989, 20.0, backD, true);
  crossfade(pEncBack, lockBackT - 0.12, 0.25);
  scramble(pEncBack, 20.0, backD);
  ripple(tl, w, 975, 480, crossT(w, 'mtls', 'x', 975, 20.0, backD, true), C.secure);
  ring(tl, w, 'gateway', 20.8, C.secure);

  activate(tl, w, 'req', 20.8, 0.4, { reverse: true, fadeAt: 22.0 });
  travel(tl, w, pResp, 'req', 20.8, 0.9, true);
  ripple(tl, w, 415, 480, crossT(w, 'req', 'x', 415, 20.8, 0.9, true), C.accent);
  ring(tl, w, 'browser', 21.7, C.accent);
}

/* ==========================================================================
   5. GO
   ========================================================================== */
bootstrap(SCENARIO, choreograph);
})();
</script>
