<script>
(() => {
'use strict';

//#region pure
/* =====================================================================
   1. PURE DATA + LAYOUT  (no DOM, no gsap: the node check script runs this block)
   Ground units are pixels on the isometric ground plane: +x runs down-right,
   +y runs down-left, +z is up. Containers are computed from their children.
   ===================================================================== */
const COL = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7',
              muted: '#8b98ad', accent: '#4cc9f0', token: '#f5b941', identity: '#a78bfa', secure: '#3ddc97', danger: '#ff5d6c' };
const ISO_ORIGIN = { x: 1000, y: 160 };
const COS30 = Math.cos(Math.PI / 6);
function iso(x, y, z = 0) { return { x: ISO_ORIGIN.x + (x - y) * COS30, y: ISO_ORIGIN.y + (x + y) * 0.5 - z }; }
const f1 = (n) => n.toFixed(1);
const P = (x, y, z = 0) => { const q = iso(x, y, z); return f1(q.x) + ',' + f1(q.y); };
const poly = (pts) => pts.map((p) => P(p[0], p[1], p[2] || 0)).join(' ');
const textW = (str, fs) => str.length * fs * (str === str.toUpperCase() && /[A-Z]/.test(str) ? 0.7 : 0.58);
const contTextW = (str, fs) => textW(str, fs) + str.length * 2;     // container labels carry letter-spacing 2

const HALF = 34, FOOT = 50, TH = 12, PAD = 22, NODE_FS = 34;
const LABEL_PX = [42, 42, 40, 38, 36];            // container label size by nesting level
const BUS_Y = 800;                                 // the bypass lane through the account services slab

// ---- nodes (x, y = centre on the ground plane; h = block height) ----
const NODES = {
  atk:      { label: 'Attacker',            x: 100, y: 300, h: 56, color: COL.danger,   parent: 'internet',  tip: ['Attacker', 'Sits on the open Internet with nothing but a browser and a crafted URL.'] },
  cdn:      { label: 'CDN / WAF',           x: 470, y: 300, h: 70, color: COL.accent,   parent: 'edge',      tip: ['CDN / WAF', 'Edge cache and web application firewall. Filters requests before they reach the VPC.'] },
  lb:       { label: 'Load balancer',       x: 900, y: 300, h: 66, color: COL.accent,   parent: 'pub',       tip: ['Load balancer', 'Lives in the public subnet and spreads traffic across pods in the private subnet.'] },
  store:    { label: 'storefront',          x: 1210, y: 300, h: 70, color: '#c9d6ea',    parent: 'nsweb',     tip: ['storefront (pod)', 'Customer-facing web app. It fetches URLs on behalf of users, which makes it vulnerable to SSRF.'] },
  imds:     { label: 'Metadata (IMDS)',     x: 1540, y: 300, h: 56, color: '#c9d6ea',    parent: 'eks',       tip: ['Instance metadata service', '169.254.169.254, on the node. Hands the node role’s temporary credentials to anything that asks.'] },
  pay:      { label: 'payments-api',        x: 1210, y: 590, h: 70, color: '#c9d6ea',    parent: 'nspay',     tip: ['payments-api (pod)', 'Handles card payments and holds the credentials for the Orders DB.'] },
  db:       { label: 'Orders DB',           x: 900, y: 590, h: 60, color: COL.muted,    parent: 'data',      tip: ['Orders DB', 'Private data store, reachable only from the payments service.'] },
  iam:      { label: 'IAM / STS',           x: 470, y: 700, h: 66, color: COL.identity, parent: 'svc',       tip: ['IAM / STS', 'Issues and checks identities. Reachable from the Internet by anyone holding valid keys.'] },
  ct:       { label: 'CloudTrail +\nGuardDuty', x: 700, y: 700, h: 60, color: COL.secure, parent: 'svc',      tip: ['CloudTrail + GuardDuty', 'Records every API call and raises findings on suspicious ones. Detection, not prevention.'] },
  s3:       { label: 'S3 customer-exports', x: 470, y: 900, h: 56, color: '#c9d6ea',    parent: 'svc',       tip: ['S3 bucket "customer-exports"', 'Holds exported customer data.'] },
  sm:       { label: 'Secrets Manager',     x: 700, y: 900, h: 60, color: '#c9d6ea',    parent: 'svc',       tip: ['Secrets Manager', 'Stores the Orders DB password.'] },
};
// ---- containers (labels along the front edge; bounds computed from kids) ----
const CONT = {
  internet: { label: 'INTERNET',             kids: ['atk'] },
  account:  { label: 'AWS ACCOUNT "prod"',   kids: ['edge', 'vpc', 'svc'] },
  edge:     { label: 'EDGE',                 kids: ['cdn'] },
  vpc:      { label: 'VPC',                  kids: ['pub', 'priv', 'data'] },
  pub:      { label: 'Public subnet',        kids: ['lb'] },
  priv:     { label: 'Private subnet',       kids: ['eks'] },
  eks:      { label: 'EKS cluster',          kids: ['nsweb', 'nspay', 'imds'] },
  nsweb:    { label: 'namespace: web',       kids: ['store'] },
  nspay:    { label: 'namespace: payments',  kids: ['pay'] },
  data:     { label: 'Data subnet',          kids: ['db'] },
  svc:      { label: 'ACCOUNT SERVICES',     kids: ['iam', 'ct', 's3', 'sm'] },
};
const CONT_IDS = Object.keys(CONT);

function splitLabel(label, F, natural) {          // one line, or two when the label would force the box wider
  const one = contTextW(label, F) + 44;
  if (natural >= one || label.indexOf(' ') < 0) return { lines: [label], w: one };
  let best = null;
  label.split('').forEach((ch, i) => { if (ch === ' ') { const a = label.slice(0, i), b = label.slice(i + 1), w = Math.max(contTextW(a, F), contTextW(b, F)) + 44; if (!best || w < best.w) best = { lines: [a, b], w }; } });
  return best.w < one - 40 ? best : { lines: [label], w: one };
}
function computeLayout() {
  const level = {}, parentOf = {}, box = {}, nodeZ = {}, lines = {};
  const setLv = (id, lv, par) => { level[id] = lv; parentOf[id] = par; CONT[id].kids.forEach((k) => { parentOf[k] = id; if (CONT[k]) setLv(k, lv + 1, id); }); };
  ['internet', 'account'].forEach((r) => setLv(r, 0, null));
  const calc = (id) => {
    if (NODES[id]) { const n = NODES[id]; return { x0: n.x - FOOT, x1: n.x + FOOT, y0: n.y - FOOT, y1: n.y + FOOT }; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    CONT[id].kids.forEach((k) => { const b = calc(k); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); });
    const F = LABEL_PX[level[id]], sp = splitLabel(CONT[id].label, F, x1 - x0 + 2 * PAD);
    lines[id] = sp.lines;
    const b = { x0: x0 - PAD, y0: y0 - PAD, x1: x1 + PAD, y1: y1 + PAD + sp.lines.length * F * 1.06 + 8 };
    if (b.x1 - b.x0 < sp.w) b.x1 = b.x0 + sp.w;
    box[id] = b; return b;
  };
  calc('account');
  box.internet = { x0: 0, x1: 0, y0: 0, y1: 0 };
  calc('internet');
  box.internet.y0 = box.account.y0; box.internet.y1 = box.account.y1;
  const ztop = (id) => (level[id] + 1) * TH;
  const zAt = (x, y) => { let best = 0, bl = -1; CONT_IDS.forEach((id) => { const b = box[id]; if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1 && level[id] > bl) { bl = level[id]; best = ztop(id); } }); return best; };
  Object.keys(NODES).forEach((id) => { nodeZ[id] = ztop(NODES[id].parent); });
  return { level, parentOf, box, nodeZ, ztop, zAt, lines };
}
const LAY = computeLayout();
const BOX = LAY.box;

// ---- routes: ground polylines along the isometric axes; entries are node ids or [x, y] waypoints ----
const ROUTE_SPEC = {
  'atk-cdn':   ['atk', 'cdn'],
  'cdn-lb':    ['cdn', 'lb'],
  'lb-store':  ['lb', 'store'],
  'store-imds': ['store', 'imds'],
  'store-pay': ['store', 'pay'],
  'pay-db':    ['pay', 'db'],
  'atk-iam':   ['atk', [NODES.atk.x, BUS_Y], [NODES.iam.x, BUS_Y], 'iam'],
  'atk-s3':    ['atk', [NODES.atk.x, BUS_Y], [NODES.s3.x, BUS_Y], 's3'],
  'atk-sm':    ['atk', [NODES.atk.x, BUS_Y], [NODES.sm.x, BUS_Y], 'sm'],
  'iam-ct':    ['iam', 'ct'],
};
function trimEnds(pts, a, b) {
  const q = pts.map((p) => p.slice());
  const cut = (p, n, d) => { const l = Math.hypot(n[0] - p[0], n[1] - p[1]); return [p[0] + (n[0] - p[0]) / l * d, p[1] + (n[1] - p[1]) / l * d]; };
  q[0] = cut(pts[0], pts[1], a);
  q[q.length - 1] = cut(pts[pts.length - 1], pts[pts.length - 2], b);
  return q;
}
// Split a ground polyline at every container edge, give each piece the height of the slab it runs on,
// and record the crossings (gates).
function route3D(pts) {
  const out = [], gates = []; let acc = 0;
  const push = (x, y, z) => { const l = out[out.length - 1]; if (!l || l[0] !== x || l[1] !== y || l[2] !== z) out.push([x, y, z]); };
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const cuts = [];
    CONT_IDS.forEach((id) => {
      const bx = BOX[id];
      if (Math.abs(dy) < 1e-6 && a[1] > bx.y0 && a[1] < bx.y1) [bx.x0, bx.x1].forEach((xe) => { const s = (xe - a[0]) / dx * len; if (s > 0.5 && s < len - 0.5) cuts.push({ s, orient: 'y' }); });
      if (Math.abs(dx) < 1e-6 && a[0] > bx.x0 && a[0] < bx.x1) [bx.y0, bx.y1].forEach((ye) => { const s = (ye - a[1]) / dy * len; if (s > 0.5 && s < len - 0.5) cuts.push({ s, orient: 'x' }); });
    });
    cuts.sort((p, q) => p.s - q.s);
    const ss = [0].concat(cuts.map((c) => c.s), [len]);
    const zs = [];
    for (let k = 0; k < ss.length - 1; k++) { const m = (ss[k] + ss[k + 1]) / 2; zs.push(LAY.zAt(a[0] + ux * m, a[1] + uy * m) + 0.6); }
    push(a[0], a[1], zs[0]);
    cuts.forEach((c, k) => {
      const cx = a[0] + ux * c.s, cy = a[1] + uy * c.s, z1 = zs[k], z2 = zs[k + 1];
      gates.push({ x: cx, y: cy, s: acc + c.s, z: Math.min(z1, z2), h: Math.abs(z2 - z1), orient: c.orient });
      if (z1 !== z2) { push(cx - ux * 7, cy - uy * 7, z1); push(cx + ux * 7, cy + uy * 7, z2); } else push(cx, cy, z1);
    });
    push(b[0], b[1], zs[zs.length - 1]);
    acc += len;
  }
  return { pts: out, gates, len: acc };
}
const ROUTES = {};
Object.keys(ROUTE_SPEC).forEach((k) => {
  const raw = ROUTE_SPEC[k].map((e) => (typeof e === 'string' ? [NODES[e].x, NODES[e].y] : e));
  const g = route3D(trimEnds(raw, HALF + 12, HALF + 12));
  g.gates.forEach((q) => { q.f = q.s / g.len; });
  ROUTES[k] = { pts: g.pts, rpts: g.pts.slice().reverse(), gates: g.gates, len: g.len, from: ROUTE_SPEC[k][0], to: ROUTE_SPEC[k][ROUTE_SPEC[k].length - 1] };
});
const routeMid = (id) => {   // point halfway along a route (ground x, y, z)
  const R = ROUTES[id]; let rem = R.len / 2;
  for (let i = 1; i < R.pts.length; i++) {
    const a = R.pts[i - 1], b = R.pts[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (rem <= l && l > 0) return [a[0] + (b[0] - a[0]) * rem / l, a[1] + (b[1] - a[1]) * rem / l, a[2] + (b[2] - a[2]) * rem / l];
    rem -= l;
  }
  return R.pts[R.pts.length - 1];
};

// ---- shield markers for step 11 (label positions are found by placePill) ----
const CTRL = [
  { n: '2',   step: 2, route: 'atk-cdn',    at: [NODES.cdn.x - 150, NODES.cdn.y],                              label: 'WAF rule' },
  { n: '2/3', step: 3, route: 'store-imds', at: [(NODES.store.x + NODES.imds.x) / 2, NODES.store.y],           label: 'IMDSv2 hop limit' },
  { n: '5',   step: 5, route: 'atk-s3',     at: [NODES.iam.x - 40, BUS_Y],                                     label: 'Least-privilege node role' },
  { n: '6',   step: 6, route: 'atk-s3',     at: [NODES.s3.x, BUS_Y + 30],                                      label: 'Bucket policy / VPC endpoint' },
  { n: '8',   step: 8, route: 'store-pay',  at: [NODES.store.x, (NODES.store.y + NODES.pay.y) / 2],            label: 'Network policy' },
];
const CTRL_FS = 36;

// ---- scenario copy ----
const PHASES = [
  { id: 'initial',    title: 'Initial access' },
  { id: 'credential', title: 'Credential access' },
  { id: 'discovery',  title: 'Discovery and exfiltration' },
  { id: 'lateral',    title: 'Lateral movement' },
  { id: 'detect',     title: 'Detection and controls' },
];
const STEPS = [
  { id: 'recon', phase: 'initial', title: 'A normal shopper request',
    body: 'Shoppers reach the storefront through the WAF and load balancer. This is normal.',
    touch: ['atk', 'cdn', 'lb', 'store'], routes: ['atk-cdn', 'cdn-lb', 'lb-store'], frame: ['atk', 'cdn', 'lb', 'store'],
    callouts: [{ target: 'cdn', text: 'WAF inspects every request' }, { target: 'store', text: 'Fetches URLs for users' }] },
  { id: 'ssrf', phase: 'initial', title: 'Trick the storefront with SSRF',
    body: 'A crafted URL makes the storefront fetch an internal address from inside.',
    touch: ['atk', 'cdn', 'lb', 'store', 'imds'], routes: ['atk-cdn', 'cdn-lb', 'lb-store', 'store-imds'], frame: ['atk', 'cdn', 'lb', 'store', 'imds'],
    callouts: [{ target: 'store', text: 'Fetches the attacker’s URL' }, { target: 'imds', text: 'Internal address, no auth' }] },
  { id: 'creds', phase: 'credential', title: 'The node hands over its keys',
    body: 'The metadata service hands the node\u2019s temporary credentials back to the attacker.',
    touch: ['atk', 'cdn', 'lb', 'store', 'imds'], routes: ['atk-cdn', 'cdn-lb', 'lb-store', 'store-imds'], frame: ['atk', 'cdn', 'lb', 'store', 'imds', 'card'],
    callouts: [{ target: 'imds', text: 'Role credentials, valid for hours' }] },
  { id: 'identity', phase: 'credential', title: 'Using the keys from outside',
    body: 'Stolen keys work from anywhere, skipping the WAF, load balancer and VPC.',
    touch: ['atk', 'iam'], routes: ['atk-iam'], frame: ['atk', 'cdn', 'lb', 'iam'],
    callouts: [{ target: 'atk-iam', text: 'Bypasses WAF, LB and VPC' }] },
  { id: 'enumerate', phase: 'discovery', title: 'Look around the account',
    body: 'Valid keys let the attacker list every bucket and secret at once.',
    touch: ['atk', 's3', 'sm'], routes: ['atk-s3', 'atk-sm'], frame: ['atk', 's3', 'sm', 'iam'],
    callouts: [{ target: 's3', text: 'Lists every bucket' }, { target: 'sm', text: 'Lists every secret' }] },
  { id: 'exfil', phase: 'discovery', title: 'Copy the customer exports',
    body: 'Objects stream out without touching the VPC, so no network device sees it.',
    touch: ['atk', 's3'], routes: ['atk-s3'], frame: ['atk', 's3', 'sm'],
    callouts: [{ target: 's3', text: 'Customer data leaves' }] },
  { id: 'secret', phase: 'discovery', title: 'Read the database password',
    body: 'Secrets Manager hands the database password to anyone holding these keys.',
    touch: ['atk', 'sm'], routes: ['atk-sm'], frame: ['atk', 'sm', 's3'],
    callouts: [{ target: 'sm', text: 'DB password revealed' }] },

}

function words(s) { return s.trim().split(/\s+/).length; }
function buildTimeline() {
  buildSlabs(); buildRoutes(); buildNodes(); buildCard(); buildFinding(); buildShields();
  const nodeIds = Object.keys(NODES);

  // initial state: nothing drawn yet (what seek(0) shows); the estate builds up in the intro
  const slabList = CONT_IDS.slice().sort((a, b) => LAY.level[a] - LAY.level[b]);
  gsap.set([].concat(slabList.map((i) => slabEls[i]), Object.values(routeEls), Object.values(nodeEls), Object.values(labelEls), [L.gates]), { opacity: 0 });
  gsap.set(Object.values(nodeEls), { y: -26 });
  Object.values(trailEls).forEach((e) => state.set(e, 0));
  [L.gates].forEach((e) => state.set(e, 0));

  slabList.forEach((id, i) => { tl.fromTo(slabEls[id], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out', immediateRender: false }, 0.1 + LAY.level[id] * 0.3 + (i % 3) * 0.05); state.set(slabEls[id], 1); });
  Object.keys(routeEls).forEach((k) => { tl.fromTo(routeEls[k], { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, 1.2); state.set(routeEls[k], 1); });
  tl.fromTo(L.gates, { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, 1.4);
  nodeIds.forEach((id, i) => {
    tl.fromTo(nodeEls[id], { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out', immediateRender: false }, 0.8 + i * 0.1);
    tl.fromTo(labelEls[id], { opacity: 0 }, { opacity: 1, duration: 0.35, immediateRender: false }, 1.0 + i * 0.1);
    state.set(nodeEls[id], 1); state.set(labelEls[id], 1);
  });

  const Z = CAMS.map((c) => c.zoom), B = stepBuilders(Z);
  let ts = 2.8;
  STEPS.forEach((S, i) => {
    S.time = ts; tl.addLabel(S.id, ts);
    camMove(CAMS[i], ts, 1.4);
    // focus: things not involved in this step dim
    const inv = new Set(S.touch), invR = new Set(S.routes), invC = new Set(), all = S.frame === 'full';
    S.touch.forEach((n) => { let p = NODES[n].parent; while (p) { invC.add(p); p = LAY.parentOf[p]; } });
    nodeIds.forEach((id) => { const o = (all || inv.has(id)) ? 1 : DIM; fade(nodeEls[id], o, ts, 0.9); fade(labelEls[id], o, ts, 0.9); });
    CONT_IDS.forEach((id) => fade(slabEls[id], (all || invC.has(id)) ? 1 : DIM, ts, 0.9));
    Object.keys(routeEls).forEach((k) => fade(routeEls[k], (all || invR.has(k)) ? 1 : DIM, ts, 0.9));
    const r = B[S.id](ts, Z[i]);
    S.callEls = S.callouts.map((co, k) => buildCallout(co, S.callLay[k], Z[i]));
    S.callEls.forEach((g, k) => tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, Math.max(ts + 1.0, (r.co[k] != null ? r.co[k] : ts + 1.4))));
    const hold = Math.max(2.5, words(S.body) / 3);
    S.end = r.end; S.hold = hold;
    ts = r.end + hold;
    S.next = ts;
    S.callEls.forEach((g) => tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.45, immediateRender: false }, ts - 0.5));
  });
  DURATION = ts;
  tl.set({}, {}, DURATION);     // pad the timeline to the declared duration
}
let DURATION = 0;

/* =====================================================================
   4. SCAFFOLDING: stage fit, narrative UI, mini-map, tooltips, controls, timeline contract
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const stage = $('#stage'), wrap = $('#stagewrap');
let scale = 1;
function fit() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  scale = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(${(w - 1920 * scale) / 2}px, ${(h - 1080 * scale) / 2}px) scale(${scale})`;
}
window.addEventListener('resize', fit);

const railEls = [], dotEls = [];
function buildRail() {
  const rail = $('#rail');
  PHASES.forEach((p, pi) => {
    const d = document.createElement('div'); d.className = 'ph';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.title; d.appendChild(nm);
    const dots = document.createElement('div'); dots.className = 'dots'; d.appendChild(dots);
    STEPS.forEach((s, i) => { if (s.phase === p.id) { const x = document.createElement('div'); x.className = 'dot'; dots.appendChild(x); dotEls[i] = x; if (p.firstStep == null) p.firstStep = i; } });
    rail.appendChild(d); railEls.push(d);
  });
}

// mini-map: whole estate outline, camera rectangle, active dot (all in scene coordinates)
let mmFrame, mmDot, mmFullW = 1;
function buildMinimap() {
  const mm = $('#mm'), bb = unionBB(contBBox('internet'), contBBox('account')), pad = 40;
  mm.setAttribute('viewBox', `${f1(bb.x0 - pad)} ${f1(bb.y0 - pad)} ${f1(bb.x1 - bb.x0 + 2 * pad)} ${f1(bb.y1 - bb.y0 + 2 * pad)}`);
  CONT_IDS.forEach((id) => {
    const b = BOX[id], z = (LAY.level[id] + 1) * TH;
    el('polygon', { points: poly([[b.x0, b.y0, z], [b.x1, b.y0, z], [b.x1, b.y1, z], [b.x0, b.y1, z]]), fill: LAY.level[id] === 0 ? 'rgba(42,52,71,0.5)' : 'rgba(42,52,71,0.28)', stroke: '#52617d', 'stroke-width': 5 }, mm);
  });
  Object.keys(NODES).forEach((id) => { const q = iso(NODES[id].x, NODES[id].y, LAY.nodeZ[id] + NODES[id].h); el('circle', { cx: f1(q.x), cy: f1(q.y), r: 16, fill: NODES[id].color }, mm); });
  mmFrame = el('rect', { fill: 'rgba(76,201,240,0.10)', stroke: COL.accent, 'stroke-width': 9 }, mm);
  mmDot = el('circle', { r: 30, fill: COL.danger, stroke: COL.text, 'stroke-width': 7 }, mm);
  mmFullW = CAM_FULL.vb.w;
}

let lastIdx = -2, lastT = 0, bodyDone = '';
function stepIndexAt(t) { let idx = -1; STEPS.forEach((s, i) => { if (t >= s.time - 1e-6) idx = i; }); return idx; }
function isPlaying() { return !tl.paused() && tl.progress() < 1; }
const capCount = $('#count'), capTitle = $('#title'), capBody = $('#body'), capId = $('#stepid');
const scrub = $('#scrub'), playBtn = $('#play'), clock = $('#clock');
// Everything below is a pure function of tl.time() and the tweened proxies: safe after any seek.
function sync() {
  const t = tl.time(), idx = stepIndexAt(t);
  if (idx !== lastIdx) {
    lastIdx = idx;
    capTitle.textContent = idx >= 0 ? STEPS[idx].title : '';
    capBody.textContent = idx >= 0 ? STEPS[idx].body : '';
    capCount.textContent = (idx < 0 ? 0 : idx + 1) + ' / ' + STEPS.length;
    capId.textContent = idx >= 0 ? STEPS[idx].id : '';
    const ph = idx >= 0 ? STEPS[idx].phase : null;
    PHASES.forEach((p, pi) => { const cur = p.id === ph, done = idx >= 0 && STEPS[idx].phase !== p.id && PHASES.findIndex((q) => q.id === ph) > pi; railEls[pi].className = 'ph' + (cur ? ' cur' : done ? ' done' : ''); });
    dotEls.forEach((d, i) => { d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' cur' : ''); });
  }
  const ts = idx >= 0 ? STEPS[idx].time : 0;
  capTitle.style.opacity = idx < 0 ? 0 : clamp((t - ts) / 0.5, 0, 1);
  capBody.style.opacity = idx < 0 ? 0 : clamp((t - ts - 0.8) / 0.6, 0, 1);
  svg.setAttribute('viewBox', `${f1(cam.vx)} ${f1(cam.vy)} ${f1(cam.vw)} ${f1(cam.vh)}`);
  const s = cam.vw / 1920, mmOp = clamp((mmFullW - cam.vw) / (mmFullW * 0.12), 0, 1);
  mmFrame.setAttribute('x', f1(cam.vx + AREA.x0 * s)); mmFrame.setAttribute('y', f1(cam.vy + AREA.y0 * s));
  mmFrame.setAttribute('width', f1((AREA.x1 - AREA.x0) * s)); mmFrame.setAttribute('height', f1((AREA.y1 - AREA.y0) * s));
  mmDot.setAttribute('cx', f1(dot.x)); mmDot.setAttribute('cy', f1(dot.y));
  $('#mm').style.opacity = mmOp;
  scrub.value = t;
  clock.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1) + ' s';
  playBtn.textContent = isPlaying() ? 'Pause' : 'Play';
  lastT = t;
}
// presenter mode: stop at the end of each step, judged from timeline time (seek is unaffected)
function tick() {
  if (PRESENT && !tl.paused()) {
    const t = tl.time();
    for (let i = 1; i < STEPS.length; i++) {
      const stop = STEPS[i].time - 0.02;
      if (lastT < stop - 1e-6 && t >= stop - 1e-6) { tl.pause(); tl.time(stop, true); sync(); return; }
    }
  }
  sync();
}

function setNarr(m) {
  NARR = m; stage.className = 'nar-' + m;
  $('#narr').textContent = 'Narration: ' + m;
}
function setPresent(on) { PRESENT = on; $('#pres').textContent = 'Presenter: ' + (on ? 'on' : 'off'); $('#pres').classList.toggle('on', on); }
const cycleNarr = () => setNarr(NARR === 'full' ? 'caption' : NARR === 'caption' ? 'off' : 'full');

function setupTooltips() {
  if (CAPTURE) return;
  const tip = $('#tip');
  document.querySelectorAll('.node').forEach((n) => {
    const d = NODES[n.getAttribute('data-id')].tip;
    const move = (e) => {
      const r = stage.getBoundingClientRect();
      let x = (e.clientX - r.left) / scale + 24, y = (e.clientY - r.top) / scale + 24;
      x = Math.min(x, 1920 - 540); y = Math.min(y, 1080 - 150);
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    };
    n.addEventListener('pointerenter', (e) => { tip.innerHTML = '<b></b><span></span>'; tip.firstChild.textContent = d[0]; tip.lastChild.textContent = d[1]; tip.style.display = 'block'; move(e); });
    n.addEventListener('pointermove', move);
    n.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  });
}

function setupControls() {
  const bar = $('#track');
  STEPS.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'tick'; d.style.left = (s.time / DURATION * 100) + '%';
    d.textContent = (i + 1) + ' ' + s.id;
    bar.appendChild(d);
  });
  scrub.max = DURATION;
  scrub.addEventListener('input', () => { api.pause(); tl.time(+scrub.value); sync(); });
  playBtn.addEventListener('click', toggle);
  $('#prev').addEventListener('click', () => goStep(-1));
  $('#next').addEventListener('click', () => goStep(1));
  $('#narr').addEventListener('click', cycleNarr);
  $('#pres').addEventListener('click', () => setPresent(!PRESENT));
  $('#speed').addEventListener('change', (e) => tl.timeScale(+e.target.value));
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { e.preventDefault(); goStep(-1); }
    else if (e.code === 'ArrowRight') { e.preventDefault(); goStep(1); }
    else if (e.code === 'Home') { e.preventDefault(); api.seek(0); api.play(); }
    else if (e.code === 'KeyN') { cycleNarr(); }
    else if (e.code === 'KeyP') { setPresent(!PRESENT); }
  });
}
function toggle() { if (isPlaying()) api.pause(); else api.play(); }
function goStep(dir) {
  const t = tl.time(), idx = stepIndexAt(t), was = isPlaying();
  let target;
  if (dir > 0) target = idx + 1 < STEPS.length ? STEPS[idx + 1].time : DURATION;
  else target = (idx >= 0 && t - STEPS[idx].time > 0.6) ? STEPS[idx].time : (idx > 0 ? STEPS[idx - 1].time : 0);
  tl.pause(); tl.time(target); sync();
  if ((was || (PRESENT && dir > 0)) && target < DURATION) api.play();
}

// ---- timeline contract used by the video exporter ----
const api = {
  duration: 0,
  fps: 30,
  steps: [],
  phases: [],
  seek(t) { tl.pause(); tl.time(Math.max(0, Math.min(DURATION, t)), false); sync(); },
  play() { if (tl.progress() >= 1) tl.restart(); else tl.play(); sync(); },
  pause() { tl.pause(); sync(); },
};
window.anim = api;

buildTimeline();
api.duration = DURATION;
api.steps = STEPS.map((s) => ({ id: s.id, time: s.time, caption: s.title, title: s.title, body: s.body }));
buildRail(); buildMinimap();
api.phases = PHASES.map((p) => ({ id: p.id, title: p.title, firstStep: p.firstStep }));
setNarr(NARR); setPresent(PRESENT);
tl.eventCallback('onUpdate', tick);
tl.eventCallback('onComplete', sync);
fit();
setupTooltips();
setupControls();
api.seek(0);
if (!CAPTURE) api.play();
})();
</script>
</body>
