/* controls shown in the last step: edge + point on it + label placement */
var SHIELDS = [

  { n: '2/3', edge: 'store_imds', seg: 0, t: 0.55, label: 'IMDSv2 hop limit',    side: 'left' },

  { n: '6',   edge: 'byp_s3',     seg: 1, t: 0.40, label: 'Bucket policy + endpoint', side: 'right' },
  { n: '8',   edge: 'store_pay',  seg: 0, t: 0.50, label: 'Network policy',      side: 'down', off: [100, 40] }
];
/* the order in which the finished attack is traced in step 11 */
var TRACE = ['att_cdn', 'cdn_lb', 'lb_store', 'store_imds', 'byp_iam', 'byp_s3', 'byp_sec', 'store_pay', 'pay_db'];

/* ---- layout: bottom-up measure, top-down place. Rows align children on their "anchor" line (the main flow). ---- */
function textW(label, fs, caps) { return label.length * fs * (caps ? 0.68 : 0.56); }

function measure(b) {

  var p = b.pad = { l: PAD, r: PAD, t: b.label ? TOPPAD : 0, b: PAD };
  if (b.padOver) for (var k in b.padOver) p[k] = b.padOver[k];
  b.kids.forEach(measure);
  var cw = 0, ch = 0, a;
  if (b.dir === 'row') {
    var A = 0;
    b.kids.forEach(function (c) { A = Math.max(A, c.a); });
    b.kids.forEach(function (c, i) {
      if (i) cw += (c.gapBefore != null ? c.gapBefore : b.gap);
      c.rx = cw; c.ry = A - c.a; cw += c.w; ch = Math.max(ch, c.ry + c.h);
    });
    a = p.t + A;
  } else {
    var main = null;
    b.kids.forEach(function (c, i) {

      if (c.main) main = c;

function place(b, x, y, B, depth, parent) {
  b.x = x; b.y = y; b.cx = x + b.w / 2; b.cy = y + b.h / 2; b.depth = depth; b.parent = parent; B[b.id] = b;
  if (b.type === 'node') return;

/* ---- edges: orthogonal waypoints through the gaps. The first/last points sit inside the nodes (hidden). ---- */

  def('cdn_lb', 'cdn', 'lb', [[B.cdn.cx, Y], [B.lb.cx, Y]]);

  def('store_imds', 'storefront', 'imds', [[sf.cx, Y], [sf.cx, B.imds.cy]]);
  def('store_pay', 'storefront', 'payments', [[sf.cx, Y], [B.payments.cx, Y]]);
  def('pay_db', 'payments', 'db', [[B.payments.cx, Y], [B.db.cx, Y]]);

  def('byp_iam', 'attacker', 'iam', [[A.cx + 70, Y], [A.cx + 70, L1], [X1, L1], [X1, iam.cy], [iam.cx, iam.cy]]);
  def('byp_s3', 'attacker', 's3', [[A.cx, Y], [A.cx, L2], [X2, L2], [X2, s3.cy], [s3.cx, s3.cy]]);
  def('byp_sec', 'attacker', 'secrets', [[A.cx - 70, Y], [A.cx - 70, L3], [X3, L3], [X3, sec.cy], [sec.cx, sec.cy]]);

  def('log_s3', 's3', 'detect', [[s3.cx, s3.cy], [R + 60, s3.cy], [R + 60, D.cy], [D.cx, D.cy]]);
  def('log_sec', 'secrets', 'detect', [[sec.cx, sec.cy], [R + 30, sec.cy], [R + 30, D.cy - 30], [D.cx, D.cy - 30]]);
  Object.keys(E).forEach(function (id) { E[id].d = roundedPath(E[id].pts, 30); E[id].len = polyLen(E[id].pts); });

function roundedPath(pts, r) {
  var d = 'M' + pts[0][0] + ',' + pts[0][1];

    var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    var l1 = Math.abs(p1[0] - p0[0]) + Math.abs(p1[1] - p0[1]), l2 = Math.abs(p2[0] - p1[0]) + Math.abs(p2[1] - p1[1]);
    var rr = Math.min(r, l1 / 2, l2 / 2);
    var ax = p1[0] - Math.sign(p1[0] - p0[0]) * rr, ay = p1[1] - Math.sign(p1[1] - p0[1]) * rr;
    var bx = p1[0] + Math.sign(p2[0] - p1[0]) * rr, by = p1[1] + Math.sign(p2[1] - p1[1]) * rr;

function polyLen(pts) {
  var s = 0;
  for (var i = 1; i < pts.length; i++) s += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);

  var out = [];
  for (var i = 1; i < pts.length; i++) {

      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    /* callouts leave at the end of the step, active lines settle into the persistent trail */
    c.callEls.forEach(function (g) { tl.fromTo(g, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tEnd - 0.5); });
    if (i < STEPS.length - 1) {
      var tf = t0 + end + 0.3;
      c.lines.forEach(function (ln) { tl.fromTo(ln, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.in' }, tf); });
      c.trailIds.forEach(function (id) {
        if (trailed[id]) return;
        trailed[id] = true;
        tl.fromTo(w.T[id], { opacity: 0 }, { opacity: 0.42, duration: 0.8, ease: 'power1.out' }, tf);
      });
    }
    steps.push({ id: st.id, phase: st.phase, time: t0, title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  sceneEnd = t0;
  return { steps: steps, duration: sceneEnd };
}

/* ==========================================================================
   4. GO
   ========================================================================== */
bootstrap(choreograph);
})();
</script>
