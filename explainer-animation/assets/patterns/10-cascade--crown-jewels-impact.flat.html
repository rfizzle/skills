<!-- Hand-adapt reference: what it shows, the data that drives it and how to adapt it through the custom seam are in references/patterns.md -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern 10: cascade. From business outcomes to the crown jewels, and an incident travelling back up (flat 2D)</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #18202f; --line: #2a3447;
    --text: #e6edf7; --muted: #8b98ad; --accent: #4cc9f0; --token: #f5b941;
    --identity: #a78bfa; --secure: #3ddc97; --danger: #ff5d6c;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  .sans { font-family: var(--sans); }
  .mono { font-family: var(--mono); }
  #rail { position: absolute; left: 60px; top: 14px; width: 1800px; height: 76px; display: flex; gap: 14px; }
  .ph { flex: 1; box-sizing: border-box; padding-top: 4px; border-bottom: 4px solid var(--line); }
  .ph .pn { font-size: 24px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .ph .pd { display: flex; gap: 12px; margin-top: 10px; }
  .ph .pd i { display: block; width: 16px; height: 16px; border-radius: 8px; background: #2a3447; }
  /* right column of the diagram area (stage px): the "Illustrative figures" chip, the headline measure, the key */
  #chip { position: absolute; left: 1664px; top: 110px; height: 36px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; opacity: 0;
          border: 2px solid var(--token); color: var(--token); border-radius: 18px; font-size: 19px; font-weight: 700; white-space: nowrap; background: var(--panel); }
  #measure { position: absolute; left: 1664px; top: 168px; width: 236px; height: 262px; box-sizing: border-box; padding: 12px 16px; opacity: 0;
             background: var(--panel); border: 3px solid var(--line); border-radius: 18px; }
  #measure .mh { font-size: 22px; line-height: 28px; font-weight: 600; color: var(--muted); height: 84px; }
  #measure .mv { position: relative; height: 64px; margin-top: 2px; }
  #measure .mv span { position: absolute; left: 0; top: 0; font-size: 54px; line-height: 64px; font-weight: 750; white-space: nowrap; color: var(--text); }
  #measure .ms { position: relative; height: 84px; margin-top: 6px; }
  #measure .ms span { position: absolute; left: 0; top: 0; width: 204px; font-size: 21px; line-height: 27px; color: var(--muted); opacity: 0; }
  #key { position: absolute; left: 1664px; top: 450px; width: 236px; height: 66px; box-sizing: border-box; padding: 6px 16px; opacity: 0; overflow: hidden;
         background: var(--panel); border: 3px solid var(--line); border-radius: 18px; }
  #key .kr { position: relative; height: 48px; opacity: 0; }
  #key .kr svg { position: absolute; left: 0; top: 7px; }
  #key .kr span { position: absolute; left: 48px; top: 0; font-size: 22px; line-height: 48px; font-weight: 600; white-space: nowrap; }
  #bandline { position: absolute; left: 0; top: 832px; width: 1920px; height: 2px; background: var(--line); }
  #band { position: absolute; left: 60px; top: 846px; width: 1800px; height: 224px; }
  #band .tt { position: absolute; left: 0; top: 0; width: 1800px; font-size: 46px; font-weight: 700; line-height: 56px; white-space: nowrap; opacity: 0; }
  #band .tt b { color: var(--accent); font-size: 38px; margin-right: 22px; font-weight: 700; }
  #band .bd { position: absolute; left: 0; top: 68px; width: 1500px; font-size: 32px; line-height: 43px; color: #c4cee0; opacity: 0; }
  #pp { position: absolute; left: 1530px; top: 1010px; width: 340px; text-align: right; font-size: 24px; color: var(--muted); display: none; }
  .nm-caption #band .bd { display: none; }
  .nm-off #rail, .nm-off #band, .nm-off #bandline { display: none; }
  #controls { flex: none; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 22px;
              background: #0e1320; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
              padding: 9px 12px; font: inherit; font-size: 16px; cursor: pointer; }
  #controls button:hover, #controls select:hover { border-color: var(--accent); }
  #bPlay { min-width: 84px; }
  #scrub { position: relative; flex: 1; height: 44px; }
  #ticks { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
  #ticks i { position: absolute; top: 6px; width: 2px; height: 14px; margin-left: -1px; background: var(--muted); opacity: .8; }
  #ticks u { position: absolute; top: 24px; transform: translateX(-50%); font-size: 12px; text-decoration: none; color: var(--muted); white-space: nowrap; }
  #range { position: absolute; left: 0; right: 0; top: 8px; width: 100%; margin: 0; height: 28px; accent-color: var(--accent); }
  #clock { min-width: 110px; text-align: right; font-family: var(--mono); font-size: 15px; }
  body.capture #controls, body.capture #pp { display: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="rail"></div>
  <div id="bandline"></div>
  <div id="band"></div>
  <div id="chip" data-ov="chip">Illustrative figures</div>
  <div id="measure"><div class="mh" data-ov="measure-title">Outcomes at risk from one failure</div><div class="mv" id="mv"></div><div class="ms" id="ms"></div></div>
  <div id="key"></div>
  <div id="pp">Presenter: press Right arrow</div>
</div></div>
<div id="controls">
  <button id="bPlay" title="Space">Pause</button>
  <button id="bPrev" title="Left arrow">&#9664; Step</button>
  <button id="bNext" title="Right arrow">Step &#9654;</button>
  <div id="scrub"><div id="ticks"></div><input id="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Timeline"></div>
  <span id="clock">0.0 / 0.0 s</span>
  <button id="bNarr" title="N">Narration: full</button>
  <button id="bPres" title="P">Present: off</button>
  <label>Speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
</div>

  tl.fromTo = function (t, from, to, pos) { to.immediateRender = false; return rawFromTo(t, from, to, pos); };

  var steps = S.steps;

  function stepIndexAt(t) { var idx = 0; steps.forEach(function (s, i) { if (t >= s.time - 1e-6) idx = i; }); return idx; }
  var guard = 0;
  function guardFor(t) { return stepIndexAt(t + 0.05); }
  function onTick() {
    if (PRESENT && !tl.paused() && guard + 1 < steps.length && tl.time() >= steps[guard + 1].time - 0.02) {
      tl.pause(); tl.time(steps[guard + 1].time - 0.02, true);

  function seek(t) { tl.pause(); tl.time(clamp(t, 0, duration), false); guard = guardFor(tl.time()); syncUI(); }
  function play() { if (tl.time() >= duration - 1e-6) tl.time(0, true); guard = guardFor(tl.time()); tl.play(); syncUI(); }
  function pause() { tl.pause(); syncUI(); }
  function isPlaying() { return !tl.paused() && tl.time() < duration - 1e-6; }

    guard = i >= steps.length ? steps.length - 1 : i;

    syncUI();
  }
  function prevStep() { var t = tl.time(), i = stepIndexAt(t); goStep(t - steps[i].time > 0.6 ? i : i - 1); }
  function nextStep() { goStep(stepIndexAt(tl.time()) + 1); }

  function setPresent(on) { PRESENT = on; bPres.textContent = 'Present: ' + (PRESENT ? 'on' : 'off'); syncUI(); }

                  steps: steps.map(function (s) { return { id: s.id, time: s.time, rest: s.rest, caption: s.title, title: s.title, body: s.body }; }),

  var bPlay = document.getElementById('bPlay'), range = document.getElementById('range'), clock = document.getElementById('clock');

  var ticks = document.getElementById('ticks');

    bPlay.textContent = isPlaying() ? 'Pause' : (t >= duration - 1e-6 ? 'Replay' : 'Play');

  document.getElementById('bNext').addEventListener('click', nextStep);
  bNarr.addEventListener('click', function () { setNarr(NARR_MODES[(NARR_MODES.indexOf(narr) + 1) % 3]); });
  bPres.addEventListener('click', function () { setPresent(!PRESENT); });
  range.addEventListener('input', function () { seek(range.value / 1000 * duration); });

    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') && e.code === 'Space') e.target.blur();

    },
    impact: function (c) {
      var t = c.t0, r = impactUp(STORY.failure, t + 0.2, { startMarked: true });
      var outs = outcomesHit(r.R), t0o = r.end + 0.1;
      /* the measure counts as the outcomes are reached; the impact lines land on each outcome */
      countMeasure(r.outcomesAt + r.outDur * 0.4, outs.length, Math.max(1.6, r.outDur * 0.8), C.danger);
      outs.forEach(function (id, k) {
        var o = w.N[id];
        fadeIn(o.impact, t0o + k * 0.5, 0.7); live.push({ el: o.impact });
      });
      tl.fromTo(chipEl, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0o); live.push({ el: chipEl });
      linkFocus(t + 0.4, (function () { var s = {}; r.R.links.forEach(function (l) { s[linkId(l)] = 1; }); return s; })(), 0.8);
      c.hold = 3.6;
      return t0o + outs.length * 0.5 + 0.7 - c.t0;
    },
    protect: function (c) {
      var t = c.t0;
      emph(t, 'all');
      /* the damage clears; the figure chip goes with the impact lines */
      live.forEach(function (x) { tl.fromTo(x.el, { opacity: 1 }, { opacity: 0, duration: 0.9, ease: 'power1.in' }, t + 0.2); });
      live = [];
      linkFocus(t + 0.4, null, 0.8);
      protect(STORY.protectNode, t + 1.4);
      emph(t + 1.4, [STORY.protectNode]);
      /* replay: the same impactUp, now from a protected node */
      var tr = t + 3.4, r = impactUp(STORY.failure, tr, { startMarked: false });
      setSub(tr + 0.3, 'b');
      countMeasure(tr + 0.5, outcomesHit(r.R).length, 1.6, C.secure);
      live = [];
      return r.end + 0.4 - c.t0;
    },
    focus: function (c) {
      var t = c.t0, e = t + 0.6, ids = STORY.crown, set = {};
      emph(t, 'all');
      var other = ids.filter(function (id) { return !prot[id]; });
      other.forEach(function (id) { protect(id, t + 0.6); });
      setSub(t + 1.0, 'c');
      /* the paths from the crown jewels, lit in the control colour, one layer per beat */
      var seen = {};
      ids.forEach(function (id) { reach(id, {}).links.forEach(function (l) { seen[linkId(l)] = l; }); });
      var L = LAYERS.length - 1;
      var bt = t + 2.0;
      for (var l = L - 1; l >= 0; l--) {
        var ks = Object.keys(seen).filter(function (k) { return NODE[seen[k].from].layer === l; }), bd = beatDur(ks.map(function (k) { return seen[k]; }));
        ks.forEach(function (k, i) {
          var ov = overlay(k, C.secure, 8); drawLink(ov.p, w.LK[k].len, bt + i * 0.08, true, DRAW_DUR);
        });
        e = bt + bd + 0.08 * ks.length;
        bt = e + 0.4;
      }
      e += 0.5;
      return e - c.t0;
    }
  };

  /* ======== assemble: steps run back to back; each step's length depends on its narrative and its figures ======== */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0;
    tl.addLabel(st.id, t0);
    var c = { st: st, t0: t0, hold: QTY_HOLD };
    var endR = IMPL[st.id](c);
    var bodyR = 1.0, words = wordCount(st.body);
    var len = Math.max(endR + Math.max(c.hold, END_AFTER_MOTION), bodyR + 0.7 + words / BODY_WPS);
    if (i === STEPS.length - 1) len = Math.max(len, endR + FINAL_HOLD);
    var tEnd = t0 + len, rest = t0 + Math.max(endR, bodyR + 0.7) + 0.1;

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
    }
    var ph = phEls[st.phase], first = !prevSt || prevSt.phase !== st.phase;
    if (first) {
      tl.fromTo(ph.name, { color: C.muted }, { color: C.text, duration: 0.4 }, t0);
      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {
      tl.fromTo(ph.name, { color: C.text }, { color: C.muted, duration: 0.4 }, tEnd);
      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);

    steps.push({ id: st.id, phase: st.phase, time: t0, rest: rest, title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  buildEmphasis();
  window.__peakSpeed = Math.max.apply(null, DRAWS);
  return { steps: steps, duration: t0 };
}

/* ==========================================================================
   4. GO
   ========================================================================== */
bootstrap(choreograph);

/* overlap hook for the render checks: pairs of visible text boxes that intersect (dimmed text counts). Run at a time t with anim.seek(t) first. */
window.__overlaps = function () {
  var items = [];
  Array.prototype.slice.call(document.querySelectorAll('#dia text, [data-ov]')).forEach(function (e) {
    var op = 1, n = e;
    while (n && n.nodeType === 1) { op *= parseFloat(getComputedStyle(n).opacity); n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    var r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    var label = (e.getAttribute('data-ov') || e.textContent || '').slice(0, 30);
    items.push({ k: label, r: r, stack: /^(mv|ms)/.test(e.getAttribute('data-ov') || '') });
  });
  var out = [];
  for (var i = 0; i < items.length; i++) for (var j = i + 1; j < items.length; j++) {
    var a = items[i], b = items[j];
    if (a.stack && b.stack) continue;   /* measure value and its subtitles cross-fade in one place by design */
    if (a.r.left < b.r.right && b.r.left < a.r.right && a.r.top < b.r.bottom && b.r.top < a.r.bottom) out.push([a.k, b.k]);
  }
  return out;
};
/* link check: sample every link curve and report any point inside a card that is not one of its two ends */
window.__linkChecks = function () {
  var out = [], G = MODEL.G;
  Object.keys(MODEL.L).forEach(function (id) {
    var l = MODEL.L[id], p = document.createElementNS(NS, 'path'); p.setAttribute('d', l.d);
    var len = p.getTotalLength();
    for (var s = 0; s <= 100; s++) {
      var pt = p.getPointAtLength(len * s / 100);
      Object.keys(G).forEach(function (nid) {
        if (nid === l.link.from || nid === l.link.to) return;
        var g = G[nid];
        if (pt.x > g.x && pt.x < g.x + g.w && pt.y > g.y && pt.y < g.y + g.h) out.push([id, nid]);
      });
    }
  });
  return out;
};
})();
