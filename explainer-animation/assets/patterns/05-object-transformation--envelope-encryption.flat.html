<!-- Hand-adapt reference: what it shows, the data that drives it and how to adapt it through the custom seam are in references/patterns.md -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern 5: object transformation. Envelope encryption, key hierarchy and rotation (flat)</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #18202f; --line: #2a3447;
    --text: #e6edf7; --muted: #8b98ad; --accent: #4cc9f0; --token: #f5b941;
    --identity: #a78bfa; --secure: #3ddc97; --danger: #ff5d6c;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  .sans { font-family: var(--sans); }
  .mono { font-family: var(--mono); }
  #rail { position: absolute; left: 60px; top: 14px; width: 1800px; height: 76px; display: flex; gap: 14px; }
  .ph { flex: 1; box-sizing: border-box; padding-top: 4px; border-bottom: 4px solid var(--line); }
  .ph .pn { font-size: 24px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .ph .pd { display: flex; gap: 12px; margin-top: 10px; }
  .ph .pd i { display: block; width: 16px; height: 16px; border-radius: 8px; background: #2a3447; }
  #bandline { position: absolute; left: 0; top: 832px; width: 1920px; height: 2px; background: var(--line); }
  #band { position: absolute; left: 60px; top: 846px; width: 1420px; height: 224px; }
  #band .tt { position: absolute; left: 0; top: 0; width: 1420px; font-size: 46px; font-weight: 700; line-height: 56px; white-space: nowrap; opacity: 0; }
  #band .tt b { color: var(--accent); font-size: 38px; margin-right: 22px; font-weight: 700; }
  #band .bd { position: absolute; left: 0; top: 68px; width: 1420px; font-size: 32px; line-height: 43px; color: #c4cee0; opacity: 0; }
  /* the invariant badge: a fixed note, lit while the animation demonstrates the property */
  #inv { position: absolute; left: 1530px; top: 862px; width: 340px; height: 150px; box-sizing: border-box; border: 3px solid var(--line);
         border-radius: 18px; background: var(--panel); padding: 14px 20px; }
  #inv .k { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: var(--muted); }
  #inv .v { margin-top: 8px; font-size: 30px; line-height: 38px; font-weight: 650; color: #c4cee0; }
  #inv .lit { position: absolute; left: -3px; top: -3px; right: -3px; bottom: -3px; border: 3px solid var(--secure); border-radius: 18px;
              background: rgba(61,220,151,.12); opacity: 0; pointer-events: none; }
  #pp { position: absolute; left: 1530px; top: 1028px; width: 340px; text-align: right; font-size: 22px; color: var(--muted); display: none; }
  .nm-caption #band .bd { display: none; }
  .nm-off #rail, .nm-off #band, .nm-off #bandline, .nm-off #inv { display: none; }
  #controls { flex: none; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 22px;
              background: #0e1320; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
              padding: 9px 12px; font: inherit; font-size: 16px; cursor: pointer; }
  #controls button:hover, #controls select:hover { border-color: var(--accent); }
  #bPlay { min-width: 84px; }
  #scrub { position: relative; flex: 1; height: 44px; }
  #ticks { position: absolute; left: 0; right: 0; top: 0; height: 100%; pointer-events: none; }
  #ticks i { position: absolute; top: 6px; width: 2px; height: 14px; margin-left: -1px; background: var(--muted); opacity: .8; }
  #ticks u { position: absolute; top: 24px; transform: translateX(-50%); font-size: 12px; text-decoration: none; color: var(--muted); white-space: nowrap; }
  #range { position: absolute; left: 0; right: 0; top: 8px; width: 100%; margin: 0; height: 28px; accent-color: var(--accent); }
  #clock { min-width: 110px; text-align: right; font-family: var(--mono); font-size: 15px; }
  body.capture #controls, body.capture #pp { display: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="rail"></div>
  <div id="bandline"></div>
  <div id="band"></div>
  <div id="inv" data-ov="inv"><div class="lit"></div><div class="k">INVARIANT</div><div class="v">Root key never leaves the HSM</div></div>
  <div id="pp">Presenter: press Right arrow</div>
</div></div>
<div id="controls">
  <button id="bPlay" title="Space">Pause</button>
  <button id="bPrev" title="Left arrow">&#9664; Step</button>
  <button id="bNext" title="Right arrow">Step &#9654;</button>
  <div id="scrub"><div id="ticks"></div><input id="range" type="range" min="0" max="1000" value="0" step="1" aria-label="Timeline"></div>
  <span id="clock">0.0 / 0.0 s</span>
  <button id="bNarr" title="N">Narration: full</button>
  <button id="bPres" title="P">Present: off</button>
  <label>Speed <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
</div>

/* ==========================================================================
   PATTERN: OBJECT TRANSFORMATION
   The subject is what happens TO an object (a record is encrypted, a key is wrapped inside
   another key's shell, a key version ticks over), not where it travels. Objects are drawn as
   large cards; the places they can be (lanes) are a quiet backdrop. To reuse the pattern for
   another topic, replace the DATA block (LANES, OBJECTS, STEPS, PHASES, INVARIANT) and rewrite
   the IMPL functions at the end of choreograph(); the helpers below do not change.

   DATA FIELDS THAT DRIVE IT
   - OBJECTS[i] = { id, kind: 'key' | 'record' | 'envelope', x, y, show, parts: [...] }.
     A part is { role, label, color, state, ... }. Key parts: head (label, ver) and bits.
     A key may carry wrap: { name, ver, ver2, color, color2 }, the shell it can be wrapped in.
     Record parts are the fields (label, value, state 'plain' | 'cipher'). Envelope parts are
     the compartments. Cards show parts at 22px or more; they fold to a small chip only to travel.
   - LANES: the places (a lane tab and a box). An object's location is the lane its x is in.
   - STEPS: id, phase, title, body (30 words or fewer). INVARIANT: the note that is lit while
     a step demonstrates it (inv(r0, r1) windows in the step code).

   HELPERS (each a set of explicit fromTo tweens, so seek(t) is exact)
   - encrypt / decrypt  -> applyKey(): the key rides a bar across the record; every character flips
                           plain <-> ciphertext as the bar passes it (left to right, from a seeded
                           sequence built once at load); the result carries a lock badge in the
                           key's colour naming the key.
   - wrap / unwrap      -> wrap(): the wrapping key's shell closes round the inner key, which stays
                           visible inside; the shell is labelled with the key's name and version.
   - bundle             -> bundle(): the envelope frame closes round two docks; the objects slide into labelled
                           compartments.
   - discard            -> shred(): the card is cut into strips that are pulled into a slot and
                           are gone (clipped away), not faded.
   - reversion          -> reversion(): a part's version label ticks over and its colour band
                           refreshes; nothing else on the object moves.

var C = { bg: '#0b0f17', panel: '#121826', panel2: '#18202f', line: '#2a3447', text: '#e6edf7', muted: '#8b98ad',

var STEPS = [
  { id: 'ask', phase: 'write', color: C.accent, title: 'Ask KMS for a data key',

  { id: 'encrypt', phase: 'write', color: C.token, title: 'Encrypt the record locally',
    body: 'The application applies the plaintext data key to the record, field by field. The bulk data is locked here and never travels to KMS.' },
  { id: 'discard', phase: 'write', color: C.danger, title: 'Throw away the plaintext key',
    body: 'The clear data key was only needed for that moment. It is shredded from memory, so only the wrapped copy, useless without KMS, remains.' },
  { id: 'store', phase: 'write', color: C.secure, title: 'Bundle and store the envelope',
    body: 'Ciphertext and wrapped key are sealed into one envelope and written to storage. Anyone who steals the envelope holds data they cannot read.' },
  { id: 'read', phase: 'read', color: C.accent, title: 'Read it back through KMS',

  { id: 'scale', phase: 'scale', color: C.kek1, title: 'One small key call per record',

  { id: 'rotate', phase: 'scale', color: C.kek2, title: 'Rotate the key, keep the data',

  { id: 'scope', phase: 'leak', color: C.danger, title: 'What a leak actually costs',
    body: 'A leaked data key opens one record. The KEK never leaves KMS in plaintext, and the root key never leaves the HSM, so the blast radius stays small.' }

function keyParts(name, ver, color, bits) {

}

           { role: 'field', label: 'card',  value: '4929 1234 5678',  color: C.slate, state: state },
           { role: 'field', label: 'email', value: 'ada@example.org', color: C.slate, state: state } ];

var DEK_CHIPS = { plain: { label: 'DEK', stroke: C.token, icon: C.token }, wrapped: { label: 'wrapped DEK', stroke: C.kek1, icon: C.token } };
var HASHES = ['9c41', 'e2b7', '51fa', '0d83', 'b6c9', '7a25'];

/* positions: y of the plain key, the wrapped key and the record in the Application lane; the envelope slots derive from them */
var Y_DEKP = 375, Y_DEKW = 545, Y_REC = 215, Y_ENV = 390;
var SHELF = [ [1298, 164], [1662, 164], [1298, 374], [1662, 374], [1298, 584], [1662, 584] ];

var OBJECTS = [
  { id: 'root', kind: 'key', x: KX, y: 142, show: true, parts: keyParts('Root key', null, C.identity, 'e07a-5b31'), chips: { plain: { label: 'root key', stroke: C.identity, icon: C.identity } },

  { id: 'kek1', kind: 'key', x: KX, y: 264, show: true, parts: keyParts('KEK', 'v1', C.kek1, '91c4-2d7e'),
    tip: ['KEK v1', 'Key-encryption key. Never encrypts data itself; it only wraps data keys. It is held by KMS, protected by the root key.'] },
  { id: 'kek2', kind: 'key', x: KX, y: 400, show: false, parts: keyParts('KEK', 'v2', C.kek2, 'b57d-08e3'),
    tip: ['KEK v2', 'The next version of the key-encryption key, created by rotation.'] },
  { id: 'dekP', kind: 'key', x: KX, y: Y_DEKP, show: false, parts: keyParts('DEK', null, C.token, '3f9a-01c4'), chips: DEK_CHIPS,
    tip: ['Data key (plaintext)', 'One per record. Used locally to encrypt or decrypt, then thrown away.'] },
  { id: 'dekW', kind: 'key', x: KX, y: Y_DEKW, show: false, parts: keyParts('DEK', null, C.token, '3f9a-01c4'), wrap: WRAP_KEK, chips: DEK_CHIPS,

  { id: 'rec', kind: 'record', x: AX, y: Y_REC, show: true, scale: 1, parts: fieldParts('plain'), title: 'Customer record',

  { id: 'rec2', kind: 'record', x: 1170, y: 313, show: false, scale: 0.92, parts: fieldParts('cipher'), title: 'Customer record', lockedBy: 'DEK' },

var TIMES = {};
var DEFS = null;

  tl.getChildren(true, true, false).forEach(function (tw) {
    (tw.targets ? tw.targets() : []).forEach(function (t) {
      if (t && t.nodeType === 1 && !seen.has(t)) { seen.add(t); if (!t.style.opacity) gsap.set(t, { opacity: gsap.getProperty(t, 'opacity') }); }
    });

  var steps = S.steps;

  function stepIndexAt(t) { var idx = 0; steps.forEach(function (s, i) { if (t >= s.time - 1e-6) idx = i; }); return idx; }
  var guard = 0;
  function guardFor(t) { return stepIndexAt(t + 0.05); }

                  steps: steps.map(function (s) { return { id: s.id, time: s.time, caption: s.title, title: s.title, body: s.body }; }),

  var bPlay = document.getElementById('bPlay'), range = document.getElementById('range'), clock = document.getElementById('clock');
  var bNarr = document.getElementById('bNarr'), bPres = document.getElementById('bPres'), pp = document.getElementById('pp');
  var ticks = document.getElementById('ticks');

  });

    bPlay.textContent = isPlaying() ? 'Pause' : (t >= duration - 1e-6 ? 'Replay' : 'Play');
    var i = stepIndexAt(t);

      c.focus(0.8, ['env2'], ['store']);
      var rT = 1.5, d = hopObjs(A(rT), [e2, r2, k2], [[1170, Y_ENV], [AX, Y_ENV]], C.accent, { fade: 1.0 });
      var aR = rT + d;
      c.focus(aR, ['env2', 'rec2', 'wk2'], ['app']);
      tl.fromTo(e2.chips.env, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.6, ease: EASE }, A(aR));
      tl.fromTo(e2.card, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: EASE }, A(aR + 0.4));
      tl.fromTo(r2.vis, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: EASE }, A(aR + 0.4));
      tl.fromTo(k2.vis, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: EASE }, A(aR + 0.4));
      var tx1 = 'A copy of the envelope arrives';
      c.say(tx1, { at: aR, arr: aR + 0.6, arrText: tx1, cx: AX, y: 58, color: C.accent, until: null });
      var rOpen = aR + 0.6 + holdFor(tx1);
      /* open the envelope: the wrapped key leaves, alone */
      tl.fromTo(e2.card, { opacity: 1 }, { opacity: 0, duration: 0.5 }, A(rOpen));
      c.focus(rOpen, ['wk2', 'rec2'], ['app']);
      fold(A(rOpen), k2, 'wrapped', 0.5);
      var rK = rOpen + 0.7, dk = hopObjs(A(rK), [k2], [[AX, Y_DEKW], [KX, Y_DEKW]], C.kek1, { fade: 1.0 });
      inv(A(rK), A(rK + dk + 8));
      var tx2 = 'Only the wrapped key\ngoes to KMS';
      var aK = rK + dk;
      c.say(tx2, { at: rK, until: aK + 2.6, cx: AX, y: 422, color: C.kek1 });
      c.focus(aK, ['wk2', 'kek1', 'root'], ['kms']);
      unfold(A(aK), k2, 'wrapped', 0.5);
      var rU = aK + 0.8;
      var uEnd = unwrap(A(rU), k2, O.kek1) - c.t0;
      ring(A(rU + 0.3), O.root, C.identity);
      var tx3 = 'Unwrapped: plaintext DEK';
      var u1 = c.result(tx3, { at: uEnd, cx: KX, y: 640, color: C.token });
      c.say('The bulk data never\nleft the application', { at: aK + 3.0, until: u1 + 0.4, cx: AX, y: 422, color: C.secure });
      /* the plaintext key comes back */
      var rB = u1 + 0.5;
      c.focus(rB, ['wk2'], ['kms', 'app']);
      fold(A(rB), k2, 'plain', 0.5);
      var rB2 = rB + 0.7, db = hopObjs(A(rB2), [k2], [[KX, Y_DEKW], [AX, Y_DEKW]], C.token, { fade: 1.0 });
      unfold(A(rB2 + db), k2, 'plain', 0.5);
      /* decrypt locally */
      var rD = rB2 + db + 0.9;
      c.focus(rD, ['rec2', 'wk2'], ['app']);
      var dEnd = applyKey(A(rD), r2, k2, 'decrypt') - c.t0;
      var tx5 = 'Record readable again';
      var u2 = c.result(tx5, { at: dEnd, cx: AX, y: 640, color: C.secure });
      /* and the key is shredded again */
      var rS = u2 + 0.2;
      c.focus(rS, ['wk2'], ['app']);
      var sEnd = shred(A(rS), k2) - c.t0;
      var tx6 = 'DEK shredded again';
      c.result(tx6, { at: sEnd, cx: AX, y: 640, color: C.danger });
      return sEnd;
    },

    /* 6. scale: a shelf of six envelopes, one KEK */
    scale: function (c) {
      var A = c.A, env = O.env, rec = O.rec, wk = O.dekW;
      c.focus(0.2, ['rec2', 'env'], ['app', 'store']);
      fadeOut(A(0.5), O.rec2, 0.6); fadeOut(A(0.5), O.env2, 0.6);
      /* the envelope in storage folds to a chip and becomes the first shelf slot */
      var rF = 1.4;
      foldEnv(A(rF), env, [rec, wk], true);
      var rT = rF + 0.8, d = hopObjs(A(rT), [env, rec, wk], [[SX, Y_ENV], [SHELF[0][0], Y_ENV], SHELF[0]], C.secure, { fade: 1.0 });
      var c0 = O.c0, aR = rT + d;
      tl.fromTo(env.chips.env, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.6, ease: EASE }, A(aR));
      popIn(A(aR + 0.4), c0, 0.7);
      var ids = ['c0'];
      c.focus(aR, ids.slice(), ['store']);
      for (var i = 1; i < 6; i++) {
        var ti = aR + 1.2 + (i - 1) * 1.0;
        popIn(A(ti), O['c' + i], 0.7);
        ids.push('c' + i);
        c.focus(ti, ids.slice(), ['store']);
      }
      var tEnd = aR + 1.2 + 4 * 1.0 + 0.7;
      c.focus(tEnd, ids.concat(['kek1', 'root']), ['store', 'kms']);
      var t1 = 'One KEK wraps all six data keys';
      c.say(t1.replace('wraps ', 'wraps\n'), { at: tEnd, arr: tEnd + 0.4, arrText: t1, cx: KX, y: 470, color: C.kek1 });
      ring(A(tEnd + 0.4), O.kek1, C.kek1);
      var t2 = '1 small key call per record';
      c.say(t2, { at: tEnd + 3.2, arr: tEnd + 3.6, arrText: t2, cx: AX, y: 400, color: C.accent });
      return tEnd + 3.6;
    },

    /* 7. rotate: KEK v2 appears; each wrapped-key compartment is re-wrapped; the ciphertext never changes */
    rotate: function (c) {
      var A = c.A, k2 = O.kek2, ids = ['c0', 'c1', 'c2', 'c3', 'c4', 'c5'];
      c.focus(0.2, ['kek1', 'root'].concat(ids), ['kms', 'store']);
      popIn(A(0.6), k2, 0.8);
      /* KEK v2 is protected by the root key as well */
      var lk = el('path', { d: 'M90,204 V400 H130', fill: 'none', stroke: C.identity, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0 }, L.lanes);
      tl.fromTo(lk, { opacity: 0 }, { opacity: 0.8, duration: 0.6 }, A(0.8));
      ring(A(0.8), k2, C.kek2); ring(A(1.2), O.root, C.identity);
      inv(A(0.6), A(24));
      var tx1 = 'KEK v2, protected by the root';
      c.say('KEK v2, protected\nby the root key', { at: 1.4, arr: 2.2, arrText: tx1, cx: KX, y: 520, color: C.kek2 });
      /* the counters: keys re-wrapped vs data re-encrypted */
      var cg = el('g', { opacity: 0 }, L.callouts);
      el('rect', { x: AX - 232, y: 96, width: 464, height: 132, rx: 16, fill: C.panel, stroke: C.kek2, 'stroke-width': 3.5 }, cg);
      txt(cg, 'keys re-wrapped', { x: AX - 210, y: 134, dy: '.35em', class: 'sans', fill: C.text, 'font-size': 26, 'font-weight': 600 }, 'cnt.k');
      txt(cg, 'data re-encrypted', { x: AX - 210, y: 190, dy: '.35em', class: 'sans', fill: C.text, 'font-size': 26, 'font-weight': 600 }, 'cnt.d');
      var nd = [];
      for (var n = 0; n <= 6; n++) nd.push(txt(cg, n + ' / 6', { x: AX + 212, y: 134, dy: '.35em', 'text-anchor': 'end', class: 'mono', fill: C.kek2, 'font-size': 28, 'font-weight': 700, opacity: n === 0 ? 1 : 0 }, 'cnt.kn', 'cnt.kn'));
      txt(cg, '0 / 6', { x: AX + 212, y: 190, dy: '.35em', 'text-anchor': 'end', class: 'mono', fill: C.secure, 'font-size': 28, 'font-weight': 700 }, 'cnt.dn');
      tl.fromTo(cg, { opacity: 0 }, { opacity: 1, duration: 0.6 }, A(2.4));
      c.extra.push(cg);
      var rs = 4.6, STEP = 1.8, i;
      for (i = 0; i < 6; i++) {
        var s = rs + i * STEP, o = O[ids[i]];
        c.focus(s, ['kek2', 'kek1', ids[i]], ['kms', 'store']);
        ring(A(s), k2, C.kek2);
        reversion(A(s), o.plate, 1.6);
        tl.fromTo(nd[i], { opacity: 1 }, { opacity: 0, duration: 0.25 }, A(s + 1.5));
        tl.fromTo(nd[i + 1], { opacity: 0 }, { opacity: 1, duration: 0.25 }, A(s + 1.5));
      }
      var rEnd = rs + 5 * STEP + 1.6;
      c.focus(rEnd, ids.concat(['kek2']), ['kms', 'store']);
      var t2 = 'Same ciphertext, new wrapping';
      var u = c.result('Same ciphertext,\nnew wrapping', { at: rEnd, cx: AX, y: 290, color: C.secure, arrText: t2 });
      /* the old KEK retires */
      tl.fromTo(O.kek1.vis, { opacity: 1 }, { opacity: 0.4, duration: 0.8 }, A(u + 0.3));
      var t3 = 'KEK v1 can retire';
      c.say(t3, { at: u + 0.3, arr: u + 1.1, arrText: t3, cx: KX, y: 640, color: C.kek1 });
      return u + 1.1;
    },

    /* 8. what a leak costs */
    scope: function (c) {
      var A = c.A, lk = O.leak, ids = ['c0', 'c1', 'c2', 'c3', 'c4', 'c5'];
      /* the leaked DEK */
      c.focus(0.3, ['leak', 'c2'], ['app', 'store']);
      popIn(A(0.6), lk, 0.8);
      ring(A(1.4), lk, C.danger);
      var ln = el('path', { d: 'M' + (AX + 130) + ',374 H' + (1298 - 170), fill: 'none', stroke: C.danger, 'stroke-width': 6, 'stroke-dasharray': '4 10', 'stroke-linecap': 'round', opacity: 0 }, L.fx);
      tl.fromTo(ln, { opacity: 0 }, { opacity: 1, duration: 0.6 }, A(1.4));
      var c2 = O.c2;
      tl.fromTo(c2.mark, { opacity: 0 }, { opacity: 1, duration: 0.7 }, A(2.0));
      var t1 = 'A leaked DEK opens one record';
      var u1 = c.result('A leaked DEK\nopens one record', { at: 2.4, cx: AX, y: 250, color: C.danger, arrText: t1 });
      var t1b = 'The other five stay locked';
      c.say('The other five\nstay locked', { at: u1 - 0.2, arr: u1 + 0.6, arrText: t1b, cx: AX, y: 490, color: C.secure });
      /* the KEK and the root key */
      var rK = u1 + 3.2;
      c.focus(rK, ['kek2', 'kek1', 'root'], ['kms']);
      ring(A(rK), O.kek2, C.kek2); ring(A(rK + 0.3), O.kek1, C.kek1);
      var t2 = 'KEK never leaves KMS in plaintext';
      var u2 = c.result('KEK never leaves\nKMS in plaintext', { at: rK + 0.4, cx: KX, y: 500, color: C.kek1, arrText: t2 });
      var rR = u2 + 0.4;
      c.focus(rR, ['root'], ['kms']);
      ring(A(rR), O.root, C.identity);
      inv(A(rR - 0.2), A(rR + 6));
      var t3 = 'The root key never leaves the HSM';
      var u3 = c.result('Root key never\nleaves the HSM', { at: rR + 0.2, cx: KX, y: 600, color: C.identity, arrText: t3 });
      /* everything named returns to full */
      var rA = u3 + 0.2;
      emphEvent(A(rA), ids.concat(['leak', 'kek1', 'kek2', 'root']), ['kms', 'app', 'store']);
      return rA + 0.5;
    }
  };

  /* ======================= assemble: steps run back to back ======================= */
  var t0 = 0, prevSt = null;
  STEPS.forEach(function (st, i) {
    st.time = t0; TIMES[st.id] = t0;
    tl.addLabel(st.id, t0);
    var c = makeCtx(st, t0);
    var end = IMPL[st.id](c);
    c.finalizeLabels();
    var bodyR = Math.min(c.firstR, end) + 0.8, words = wordCount(st.body);
    var len = Math.max(end + END_AFTER_MOTION, c.labelEnd - 0.35 + END_AFTER_LABEL, bodyR + 0.7 + words / BODY_WPS);
    if (i === STEPS.length - 1) len = Math.max(len, end + FINAL_HOLD);
    var tEnd = t0 + len;

    tl.fromTo(st.ttEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t0 + 0.05);
    tl.fromTo(st.bdEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t0 + bodyR);
    if (i < STEPS.length - 1) {
      tl.fromTo(st.ttEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
      tl.fromTo(st.bdEl, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in' }, tEnd - 0.35);
    }
    var ph = phEls[st.phase], first = !prevSt || prevSt.phase !== st.phase;
    if (first) {
      tl.fromTo(ph.name, { color: C.muted }, { color: C.text, duration: 0.4 }, t0);
      tl.fromTo(ph.box, { borderBottomColor: C.line }, { borderBottomColor: C.accent, duration: 0.4 }, t0);
    }
    var next = STEPS[i + 1], lastOfPhase = !next || next.phase !== st.phase;
    if (lastOfPhase && next) {
      tl.fromTo(ph.name, { color: C.text }, { color: C.muted, duration: 0.4 }, tEnd);
      tl.fromTo(ph.box, { borderBottomColor: C.accent }, { borderBottomColor: C.line, duration: 0.4 }, tEnd);
    }
    tl.fromTo(dotEls[i], { backgroundColor: '#2a3447', scale: 1 }, { backgroundColor: C.accent, scale: 1.4, duration: 0.3 }, t0);
    if (next) tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd);
    else tl.fromTo(dotEls[i], { backgroundColor: C.accent, scale: 1.4 }, { backgroundColor: '#8b98ad', scale: 1, duration: 0.3 }, tEnd - 0.5);
    c.extra.forEach(function (d) { if (i < STEPS.length - 1) tl.fromTo(d, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tEnd - 0.5); });
    if (i < STEPS.length - 1) {
      var tf = t0 + Math.max(end + 0.3, c.labelEnd - 1.0);
      lines.forEach(function (ln) { if (!ln._faded) { ln._faded = true; tl.fromTo(ln, { opacity: 1 }, { opacity: 0, duration: 0.6, ease: 'power1.in' }, tf); } });
    }
    steps.push({ id: st.id, phase: st.phase, time: t0, title: st.title, body: st.body });
    prevSt = st;
    t0 = tEnd;
  });
  buildEmphasis();
  sceneEnd = t0;
  return { steps: steps, duration: sceneEnd };
}

/* ==========================================================================
   4. CHECKS  (in-page hooks the render scripts call)
   ========================================================================== */
/* pairs of visible text boxes that intersect; texts that crossfade in one place share data-grp and are skipped */
window.__overlaps = function () {
  var items = [];
  document.querySelectorAll('[data-ov]').forEach(function (e) {
    var op = 1, n = e;
    while (n && n.nodeType === 1) { var cs = getComputedStyle(n); op *= parseFloat(cs.opacity); if (cs.display === 'none') op = 0; n = n.parentElement; if (n === document.body) break; }
    if (op < 0.05) return;
    var r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return;
    items.push({ k: e.getAttribute('data-ov'), grp: e.getAttribute('data-grp'), el: e, r: r, op: op });
  });
  var out = [];
  for (var i = 0; i < items.length; i++) for (var j = i + 1; j < items.length; j++) {
    var a = items[i], b = items[j];
    if (a.grp && a.grp === b.grp) continue;
    if (a.el.contains(b.el) || b.el.contains(a.el)) continue;
    if ((a.k.indexOf('.chip.') >= 0 || b.k.indexOf('.chip.') >= 0) && Math.min(a.op, b.op) < 0.6) continue;   /* a card and its chip crossfade in one place */
    var g = 1;   /* a 1px tolerance for glyph bounding boxes */
    if (a.r.left < b.r.right - g && b.r.left < a.r.right - g && a.r.top < b.r.bottom - g && b.r.top < a.r.bottom - g) out.push([a.k, b.k]);
  }
  return out;
};
/* peak travel speed of every mover, in stage px per second, sampled over the whole run (seeks the timeline) */
window.__speed = function (dt) {
  dt = dt || 0.05;
  var movers = Array.prototype.slice.call(document.querySelectorAll('[data-mover]')), last = {}, peak = { v: 0, who: '', t: 0 };
  for (var t = 0; t <= window.anim.duration; t += dt) {
    window.anim.seek(t);
    movers.forEach(function (m) {
      var k = m.getAttribute('data-mover'), x = gsap.getProperty(m, 'x'), y = gsap.getProperty(m, 'y');
      if (last[k]) { var v = Math.hypot(x - last[k][0], y - last[k][1]) / dt; if (v > peak.v) peak = { v: v, who: k, t: t }; }
      last[k] = [x, y];
    });
  }
  return peak;
};

bootstrap(choreograph);
})();
