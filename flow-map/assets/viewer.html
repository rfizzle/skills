<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --card: #ffffff; --line: #d6dae2; --line-strong: #aeb5c2;
    --text: #15181e; --muted: #5f6775; --accent: #2f5bd8; --accent-soft: #e8eefc; --accent-ink: #1d3f9e;
    --dots: #8a93a3; --label-bg: #eef0f4; --lane-alt: #f9fafc;
    --added: #1f8a4c; --added-soft: #e3f4e9; --changed: #b4761c; --changed-soft: #fbf0da; --removed: #c43c3c; --removed-soft: #fbe3e3;
    --person: #6b4fd8; --decision: #b4761c; --async: #0e7c86; --external: #5f6775;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121315; --panel: #1b1c20; --card: #1f2024; --line: #363a43; --line-strong: #4b505c;
      --text: #e7e9ee; --muted: #9ba2ae; --accent: #8ab4f8; --accent-soft: #1b2b55; --accent-ink: #c6d8ff;
      --dots: #6a7180; --label-bg: #272a31; --lane-alt: #1d1e22;
      --added: #4cc38a; --added-soft: #16301f; --changed: #e2b046; --changed-soft: #33290f; --removed: #f26b6b; --removed-soft: #3a1818;
      --person: #b39dff; --decision: #e2b046; --async: #4cc7d1; --external: #9ba2ae;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121315; --panel: #1b1c20; --card: #1f2024; --line: #363a43; --line-strong: #4b505c;
    --text: #e7e9ee; --muted: #9ba2ae; --accent: #8ab4f8; --accent-soft: #1b2b55; --accent-ink: #c6d8ff;
    --dots: #6a7180; --label-bg: #272a31; --lane-alt: #1d1e22;
    --added: #4cc38a; --added-soft: #16301f; --changed: #e2b046; --changed-soft: #33290f; --removed: #f26b6b; --removed-soft: #3a1818;
    --person: #b39dff; --decision: #e2b046; --async: #4cc7d1; --external: #9ba2ae;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  header.top h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
  header.top p { margin: 0; color: var(--muted); }
  .capability { margin: 0 0 12px; max-width: 70ch; }
  .capability .success { display: block; color: var(--muted); margin-top: 4px; }
  .pill { display: inline-block; font: 12px/1 var(--mono); padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); white-space: nowrap; }
  .pill.accent { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .pill.added { border-color: var(--added); color: var(--added); background: var(--added-soft); }
  .pill.changed { border-color: var(--changed); color: var(--changed); background: var(--changed-soft); }
  .pill.removed { border-color: var(--removed); color: var(--removed); background: var(--removed-soft); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0 14px; }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: 14px var(--sans); }
  .toolbar label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; user-select: none; }
  button { font: 14px var(--sans); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--line-strong); }
  button:focus-visible, .card:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .maptabs { display: flex; gap: 6px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); }
  .maptabs .tab { border: 1px solid transparent; border-bottom: 0; border-radius: 10px 10px 0 0; background: transparent; color: var(--muted); padding: 8px 14px; margin-bottom: -1px; }
  .maptabs .tab[aria-selected="true"] { background: var(--panel); color: var(--text); border-color: var(--line); font-weight: 600; }
  .map { margin-bottom: 16px; overflow: hidden; }
  .scroller { position: relative; overflow-x: auto; overflow-y: hidden; padding: 20px 20px 8px; }
  .scroller svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .edge { fill: none; stroke: var(--dots); stroke-width: 1.5; stroke-dasharray: 2 4; transition: opacity .15s, stroke .15s; }
  .edge.active { stroke: var(--accent); stroke-dasharray: none; }
  .edge.fail { stroke: var(--removed); }
  .edge.faded, .edge.dim { opacity: .18; }
  .edge-label rect { fill: var(--label-bg); stroke: var(--line); }
  .edge-label text { font: italic 11.5px var(--mono); fill: var(--muted); }
  .edge-label.active rect { stroke: var(--accent); } .edge-label.active text { fill: var(--accent-ink); }
  .edge-label.faded, .edge-label.dim { opacity: .18; }
  .grid { position: relative; z-index: 1; display: grid; gap: 0 22px; align-items: center; }
  .lane-label { position: sticky; left: 0; z-index: 2; background: var(--panel); padding: 10px 14px 10px 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); min-width: 120px; }
  .lane-label .n { font-weight: 600; font-size: 14px; }
  .lane-label .k { font: 11px/1.2 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .lane-label.added .n { color: var(--added); } .lane-label.changed .n { color: var(--changed); } .lane-label.removed .n { color: var(--removed); text-decoration: line-through; }
  .cell { padding: 14px 0; display: flex; align-items: center; min-height: 60px; }
  .row-alt .cell, .row-alt .lane-label { background: var(--lane-alt); }
  .row-alt .lane-label { background: var(--lane-alt); }
  .card { position: relative; width: 200px; text-align: left; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--card); color: var(--text); cursor: pointer; font: 13.5px/1.35 var(--sans); transition: border-color .15s, opacity .15s; }
  .card:hover { border-color: var(--accent); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card.related { border-color: var(--accent); border-style: dashed; }
  .card.dim { opacity: .3; }
  .card .no { position: absolute; top: -10px; left: 10px; font: 600 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 999px; background: var(--text); color: var(--bg); }
  .card .text { display: block; }
  .card .kind { display: inline-block; font: 10.5px/1 var(--mono); color: var(--muted); margin-top: 6px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 999px; }
  .card .links { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .card .link { font: 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-ink); }
  .card .fails { position: absolute; right: 8px; top: -10px; font: 600 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 999px; background: var(--removed-soft); color: var(--removed); border: 1px solid var(--removed); }
  .card.k-action { border-color: var(--person); }
  .card.k-decision { border-color: var(--decision); border-width: 2px; background: linear-gradient(135deg, var(--changed-soft), var(--card) 40%); }
  .card.k-async { border-style: dashed; border-color: var(--async); }
  .card.k-external { border-color: var(--external); background: repeating-linear-gradient(135deg, transparent 0 8px, var(--lane-alt) 8px 10px); }
  .card.k-end { border-radius: 999px; padding-left: 16px; }
  .card.added { box-shadow: inset 3px 0 0 var(--added); } .card.changed { box-shadow: inset 3px 0 0 var(--changed); } .card.removed { box-shadow: inset 3px 0 0 var(--removed); }
  .card.removed .text { text-decoration: line-through; }
  .card .badge { position: absolute; bottom: -9px; right: 10px; font: 10.5px/1 var(--mono); padding: 3px 7px; border-radius: 999px; border: 1px solid; background: var(--card); }
  .card.added .badge { color: var(--added); border-color: var(--added); background: var(--added-soft); }
  .card.changed .badge { color: var(--changed); border-color: var(--changed); background: var(--changed-soft); }
  .card.removed .badge { color: var(--removed); border-color: var(--removed); background: var(--removed-soft); }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; border-top: 1px solid var(--line); padding: 12px 20px 12px; margin: 4px 0 0; font: 13px var(--mono); color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--line-strong); border-radius: 3px; vertical-align: -2px; margin-right: 7px; }
  .legend .l-action::before { border-color: var(--person); } .legend .l-decision::before { border-color: var(--decision); border-width: 2px; }
  .legend .l-async::before { border-color: var(--async); border-style: dashed; } .legend .l-external::before { border-color: var(--external); background: var(--lane-alt); }
  .legend .l-end::before { border-radius: 999px; }
  .legend .l-added::before { border-color: var(--added); background: var(--added-soft); } .legend .l-changed::before { border-color: var(--changed); background: var(--changed-soft); } .legend .l-removed::before { border-color: var(--removed); background: var(--removed-soft); }
  .tabpanel { padding: 20px; }
  .tabpanel h3 { margin: 18px 0 8px; font: 600 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tabpanel h3:first-child { margin-top: 0; }
  table.rows { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  table.rows td { padding: 10px 12px; background: var(--bg); vertical-align: top; font-size: 14px; }
  table.rows td:first-child { border-radius: 8px 0 0 8px; font-family: var(--mono); white-space: nowrap; }
  table.rows td:last-child { border-radius: 0 8px 8px 0; color: var(--muted); }
  table.rows tr.added td { background: var(--added-soft); } table.rows tr.added td:first-child::before { content: "+ "; color: var(--added); font-weight: 700; }
  table.rows tr.changed td { background: var(--changed-soft); } table.rows tr.changed td:first-child::before { content: "~ "; color: var(--changed); font-weight: 700; }
  table.rows tr.removed td { background: var(--removed-soft); text-decoration: line-through; } table.rows tr.removed td:first-child::before { content: "- "; color: var(--removed); font-weight: 700; display: inline-block; text-decoration: none; }
  .ref { color: var(--accent-ink); text-decoration: underline dotted; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-family: var(--mono); }
  .was { display: block; font: 12px var(--mono); color: var(--changed); margin-top: 3px; }
  .flagcell { font: italic 13px var(--mono); color: var(--muted); }
  .inspector { padding: 20px 22px 22px; }
  .inspector .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .inspector h2 { margin: 0 0 2px; font-size: 17px; font-weight: 600; line-height: 1.35; }
  .inspector .head p { margin: 0; color: var(--muted); }
  .inspector .note { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--changed); background: var(--changed-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
  .inspector .empty, .tabpanel .empty { color: var(--muted); padding: 24px 0 8px; text-align: center; }
  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 14px 0; font-size: 14px; }
  dl.meta dt { color: var(--muted); } dl.meta dd { margin: 0; }
  details.ascii { margin-top: 16px; } details.ascii summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre { margin: 0; padding: 14px 16px; background: var(--bg); border-radius: 10px; font: 13px/1.5 var(--mono); overflow: auto; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 640px) {
    .scroller { padding: 16px 12px 8px; }
    .lane-label { min-width: 84px; }
    .card { width: 170px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="title">Flow map</h1><p id="subtitle"></p></div>
    <div id="headPills"></div>
  </header>
  <p class="capability" id="capability"></p>
  <section class="toolbar">
    <input id="search" type="search" placeholder="Filter steps, lanes, states and guarantees" aria-label="Filter">
    <label id="onlyChangedLabel"><input id="onlyChanged" type="checkbox"> Only changes</label>
    <button id="copyAscii" type="button">Copy text form</button>
    <button id="theme" type="button" aria-label="Switch theme">Theme: auto</button>
  </section>
  <section class="panel map" id="map" aria-label="Flow map">
    <div class="maptabs" role="tablist">
      <button type="button" class="tab" role="tab" data-view="sequence" aria-selected="true">Sequence</button>
      <button type="button" class="tab" role="tab" data-view="states" aria-selected="false">States</button>
      <button type="button" class="tab" role="tab" data-view="guarantees" aria-selected="false">Guarantees</button>
    </div>
    <div class="scroller" id="scroller">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dots)"></path></marker>
          <marker id="arrowActive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"></path></marker>
        </defs>
        <g id="edgePaths"></g><g id="edgeLabels"></g>
      </svg>
      <div class="grid" id="grid"></div>
    </div>
    <div class="tabpanel" id="statesPanel" hidden></div>
    <div class="tabpanel" id="guaranteesPanel" hidden></div>
    <footer class="legend" id="legend"></footer>
  </section>
  <section class="panel inspector" id="inspector" aria-live="polite"><p class="empty">Select a step or a participant to inspect it.</p></section>
  <details class="ascii"><summary>Text form (the sequence pasted in the conversation)</summary><pre id="asciiOut"></pre></details>
</div>
<div class="toast" id="toast" role="status"></div>
<script id="flow" type="application/json">{}</script>
<script>
/*__ASCII__*/
(function () {
  'use strict';
  const model = JSON.parse(document.getElementById('flow').textContent || '{}');
  const isChange = model.mode === 'change';
  const lanes = model.lanes || [], steps = model.steps || [], states = model.states || [], guarantees = model.guarantees || [];
  const changeOf = (n) => (isChange ? (n.change || 'unchanged') : 'unchanged');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const laneById = new Map(lanes.map((l) => [l.id, l]));
  const stepById = new Map(steps.map((s) => [s.id, s]));
  const stepNo = new Map(steps.map((s, i) => [s.id, i + 1]));
  const kindOf = (s) => s.kind || 'system';
  const kindLabel = { action: 'user action', system: 'system step', decision: 'decision', async: 'durable / async', external: 'external call', end: 'outcome' };

  document.getElementById('title').textContent = model.title || 'Flow map';
  document.getElementById('subtitle').textContent = model.subtitle || '';
  document.getElementById('capability').innerHTML = esc(model.capability || '') + (model.success ? '<span class="success">Success: ' + esc(model.success) + '</span>' : '');
  document.getElementById('headPills').innerHTML = '<span class="pill ' + (isChange ? 'changed' : 'accent') + '">' + (isChange ? 'CHANGE' : 'SNAPSHOT') + '</span> <span class="pill">' + steps.length + ' STEPS</span>';
  let legend = '<span class="l-action">user action</span><span>system</span><span class="l-decision">decision</span><span class="l-async">durable / async</span><span class="l-external">external</span><span class="l-end">outcome</span>';
  if (isChange) legend += '<span class="l-added">added</span><span class="l-changed">changed</span><span class="l-removed">removed</span>';
  document.getElementById('legend').innerHTML = legend;
  if (!isChange) document.getElementById('onlyChangedLabel').hidden = true;
  document.getElementById('asciiOut').textContent = typeof ascii === 'function' ? ascii(model) : '(render with render.mjs)';

  // ---- grid: lanes as rows, steps as columns ----
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = 'max-content repeat(' + steps.length + ', max-content)';
  const badge = (n) => { const c = changeOf(n); return c === 'unchanged' ? '' : '<span class="badge">' + c + '</span>'; };
  let html = '';
  lanes.forEach((lane, r) => {
    const alt = r % 2 ? ' row-alt' : '';
    html += '<div class="lane-label ' + changeOf(lane) + alt + '" data-lane="' + esc(lane.id) + '" style="grid-row:' + (r + 1) + '"><button type="button" class="ref" data-select="' + esc(lane.id) + '" style="text-align:left;text-decoration:none;color:inherit"><span class="n">' + esc(lane.name) + '</span><br><span class="k">' + esc(lane.kind || 'participant') + '</span></button></div>';
    steps.forEach((s, c) => {
      html += '<div class="cell' + alt + '" style="grid-row:' + (r + 1) + ';grid-column:' + (c + 2) + '">';
      if (s.lane === lane.id) {
        const links = [s.screen ? '<span class="link">screen ' + esc(s.screen) + '</span>' : '', s.endpoint ? '<span class="link">' + esc(s.endpoint) + '</span>' : ''].filter(Boolean).join('');
        html += '<button type="button" class="card k-' + kindOf(s) + ' ' + changeOf(s) + '" data-id="' + esc(s.id) + '" aria-pressed="false">' +
          '<span class="no">' + (c + 1) + '</span>' + ((s.fails || []).length ? '<span class="fails" title="failure paths">' + s.fails.length + ' fail</span>' : '') +
          '<span class="text">' + (kindOf(s) === 'decision' ? '? ' : '') + esc(s.text) + '</span>' +
          '<span class="kind">' + kindLabel[kindOf(s)] + '</span>' + (links ? '<div class="links">' + links + '</div>' : '') + badge(s) + '</button>';
      }
      html += '</div>';
    });
  });
  grid.innerHTML = html;
  const cardEl = (id) => grid.querySelector('.card[data-id="' + CSS.escape(id) + '"]');

  // ---- edges ----
  const edges = [];
  steps.forEach((s) => (s.next || []).forEach((n) => edges.push({ from: s.id, to: n.to, label: [n.when, n.label].filter(Boolean).join(' · ') })));
  const scroller = document.getElementById('scroller'), svgEl = document.getElementById('edges'), pathsEl = document.getElementById('edgePaths'), labelsEl = document.getElementById('edgeLabels');
  const NS = 'http://www.w3.org/2000/svg';
  let selected = null;
  function drawEdges() {
    pathsEl.textContent = ''; labelsEl.textContent = '';
    svgEl.style.width = scroller.scrollWidth + 'px'; svgEl.style.height = scroller.scrollHeight + 'px';
    const box = scroller.getBoundingClientRect(), ox = box.left - scroller.scrollLeft, oy = box.top - scroller.scrollTop;
    const perSource = new Map();
    edges.forEach((edge) => {
      const a = cardEl(edge.from), b = cardEl(edge.to);
      if (!a || !b) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const slot = perSource.get(edge.from) || 0; perSource.set(edge.from, slot + 1);
      let d, lx, ly;
      if (rb.left > ra.right) {
        const sx = ra.right - ox, sy = ra.top + ra.height / 2 - oy + (slot ? (slot % 2 ? 1 : -1) * Math.min(14, ra.height / 4) : 0);
        const tx = rb.left - ox, ty = rb.top + rb.height / 2 - oy;
        const midX = sx + (tx - sx) / 2;
        d = Math.abs(sy - ty) < 1 ? 'M' + sx + ' ' + sy + ' H' + tx : 'M' + sx + ' ' + sy + ' H' + midX + ' V' + ty + ' H' + tx;
        lx = Math.abs(sy - ty) < 1 ? (sx + tx) / 2 : midX + Math.min(40, (tx - midX) / 2); ly = ty - 14;
      } else {
        // a loop back or a step in the same column: route beneath the grid
        const sx = ra.left + ra.width / 2 - ox, sy = ra.bottom - oy, tx = rb.left + rb.width / 2 - ox, ty = rb.bottom - oy;
        const by = Math.max(sy, ty) + 24;
        d = 'M' + sx + ' ' + sy + ' V' + by + ' H' + tx + ' V' + ty;
        lx = (sx + tx) / 2; ly = by;
      }
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d); path.setAttribute('class', 'edge'); path.setAttribute('marker-end', 'url(#arrow)');
      path.dataset.from = edge.from; path.dataset.to = edge.to; pathsEl.appendChild(path);
      if (edge.label) {
        const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'edge-label'); g.dataset.from = edge.from; g.dataset.to = edge.to;
        const text = document.createElementNS(NS, 'text'); text.textContent = edge.label; text.setAttribute('x', lx); text.setAttribute('y', ly + 4); text.setAttribute('text-anchor', 'middle');
        const rect = document.createElementNS(NS, 'rect'); g.appendChild(rect); g.appendChild(text); labelsEl.appendChild(g);
        const w = text.getBBox().width + 16; rect.setAttribute('x', lx - w / 2); rect.setAttribute('y', ly - 10); rect.setAttribute('width', w); rect.setAttribute('height', 20); rect.setAttribute('rx', 10);
      }
    });
    applyEdgeState();
  }
  function applyEdgeState() {
    const dimmed = new Set(Array.from(grid.querySelectorAll('.card.dim'), (c) => c.dataset.id));
    svgEl.querySelectorAll('.edge, .edge-label').forEach((el) => {
      const touches = selected && (el.dataset.from === selected || el.dataset.to === selected);
      el.classList.toggle('active', !!touches); el.classList.toggle('faded', !!selected && !touches);
      el.classList.toggle('dim', dimmed.has(el.dataset.from) || dimmed.has(el.dataset.to));
      if (el.tagName === 'path') el.setAttribute('marker-end', touches ? 'url(#arrowActive)' : 'url(#arrow)');
    });
  }
  let raf = 0; const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawEdges); };
  window.addEventListener('resize', schedule); scroller.addEventListener('scroll', schedule, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

  // ---- map tabs ----
  const statesPanel = document.getElementById('statesPanel'), guaranteesPanel = document.getElementById('guaranteesPanel');
  const rows = (items, cells) => '<table class="rows">' + items.map((it) => '<tr class="' + changeOf(it) + '">' + cells(it).map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table>';
  const wasHtml = (n) => n.was && typeof n.was === 'object' ? '<span class="was">was: ' + esc(Object.keys(n.was).map((k) => k + ' ' + JSON.stringify(n.was[k])).join(', ')) + '</span>' : '';
  const stepRef = (id) => { const s = stepById.get(id); return s ? '<button type="button" class="ref" data-select="' + esc(id) + '">' + stepNo.get(id) + '. ' + esc(s.text.length > 48 ? s.text.slice(0, 46) + '…' : s.text) + '</button>' : esc(id); };
  const laneName = (id) => (laneById.get(id) || { name: id }).name;
  function renderStates() {
    const entities = [...new Set(states.map((s) => s.entity))];
    statesPanel.innerHTML = entities.length ? entities.map((e) => '<h3>' + esc(e) + '</h3>' + rows(states.filter((s) => s.entity === e), (s) => [esc(s.state) + wasHtml(s), '<span class="flagcell">→ ' + esc((s.next || []).join(' | ') || 'final') + '</span>', 'owner ' + esc(laneName(s.owner)) + (s.stored ? ' · in ' + esc(s.stored) : '')])).join('') : '<p class="empty">No state transitions declared.</p>';
  }
  function renderGuarantees() {
    guaranteesPanel.innerHTML = guarantees.length ? rows(guarantees, (g) => [esc(g.id) + wasHtml(g), esc(g.text), (g.steps || []).map(stepRef).join('<br>') || '<span class="flagcell">no step named</span>']) : '<p class="empty">No guarantees declared. A flow with none is usually a flow nobody can test.</p>';
  }
  renderStates(); renderGuarantees();
  let view = 'sequence';
  const showView = (v) => {
    view = v;
    document.querySelectorAll('.maptabs .tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.view === v));
    scroller.hidden = v !== 'sequence'; statesPanel.hidden = v !== 'states'; guaranteesPanel.hidden = v !== 'guarantees';
    if (v === 'sequence') schedule();
  };
  document.querySelector('.maptabs').addEventListener('click', (ev) => { const t = ev.target.closest('.tab'); if (t) showView(t.dataset.view); });

  // ---- filter ----
  const searchEl = document.getElementById('search'), onlyChangedEl = document.getElementById('onlyChanged');
  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase(), onlyChanged = isChange && onlyChangedEl.checked;
    steps.forEach((s) => {
      const el = cardEl(s.id); if (!el) return;
      const hay = [s.id, s.text, s.kind, s.endpoint, s.screen, laneName(s.lane), ...(s.fails || []).map((f) => f.what + ' ' + f.recovery)].filter(Boolean).join(' ').toLowerCase();
      el.classList.toggle('dim', !((!q || hay.includes(q)) && (!onlyChanged || changeOf(s) !== 'unchanged')));
    });
    applyEdgeState();
  }
  searchEl.addEventListener('input', applyFilter); onlyChangedEl.addEventListener('change', applyFilter);

  // ---- selection and inspector ----
  const inspector = document.getElementById('inspector');
  function select(id) {
    selected = stepById.has(id) || laneById.has(id) ? id : null;
    const related = new Set();
    if (selected && stepById.has(selected)) edges.forEach((e) => { if (e.from === selected) related.add(e.to); if (e.to === selected) related.add(e.from); });
    grid.querySelectorAll('.card').forEach((c) => {
      const on = c.dataset.id === selected; c.classList.toggle('selected', on); c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.classList.toggle('related', !on && (related.has(c.dataset.id) || (laneById.has(selected) && stepById.get(c.dataset.id).lane === selected)));
    });
    applyEdgeState(); renderInspector();
    if (selected && stepById.has(selected)) { showView('sequence'); const el = cardEl(selected); if (el) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); }
    try { history.replaceState(null, '', selected ? '#' + encodeURIComponent(selected) : location.pathname + location.search); } catch (e) { /* file: may refuse */ }
  }
  document.addEventListener('click', (ev) => {
    const sel = ev.target.closest('[data-select]'); if (sel) { select(sel.dataset.select); return; }
    const card = ev.target.closest('.card'); if (card) select(card.dataset.id === selected ? null : card.dataset.id);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && selected) { select(null); return; }
    const card = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.card') : null;
    if (!card || !['ArrowLeft', 'ArrowRight'].includes(ev.key)) return;
    ev.preventDefault();
    const i = steps.findIndex((s) => s.id === card.dataset.id), t = steps[i + (ev.key === 'ArrowRight' ? 1 : -1)];
    if (t) { const el = cardEl(t.id); el.focus(); select(t.id); }
  });
  function renderInspector() {
    if (!selected) { inspector.innerHTML = '<p class="empty">Select a step or a participant to inspect it.</p>'; return; }
    const changePill = (n) => { const c = changeOf(n); return c === 'unchanged' ? '' : ' <span class="pill ' + c + '">' + c + '</span>'; };
    if (laneById.has(selected)) {
      const lane = laneById.get(selected), mine = steps.filter((s) => s.lane === lane.id);
      inspector.innerHTML = '<div class="head"><div><h2>' + esc(lane.name) + changePill(lane) + '</h2><p>' + esc(lane.kind || 'participant') + (lane.summary ? ' · ' + esc(lane.summary) : '') + '</p>' + wasHtml(lane) + '</div><span class="pill">PARTICIPANT</span></div>' +
        (lane.note ? '<p class="note">' + esc(lane.note) + '</p>' : '') + '<dl class="meta"><dt>Steps</dt><dd>' + (mine.length ? mine.map((s) => stepRef(s.id)).join('<br>') : 'none') + '</dd>' +
        '<dt>Owns states</dt><dd>' + (states.filter((s) => s.owner === lane.id).map((s) => esc(s.entity + ' ' + s.state)).join(', ') || 'none') + '</dd></dl>';
      return;
    }
    const s = stepById.get(selected), kind = kindOf(s);
    const held = guarantees.filter((g) => (g.steps || []).includes(s.id));
    const into = steps.filter((o) => (o.next || []).some((n) => n.to === s.id));
    let meta = '<dl class="meta"><dt>Participant</dt><dd>' + esc(laneName(s.lane)) + '</dd><dt>Kind</dt><dd>' + kindLabel[kind] + '</dd>';
    if (s.endpoint) meta += '<dt>Endpoint</dt><dd><code>' + esc(s.endpoint) + '</code> on the topology map</dd>';
    if (s.screen) meta += '<dt>Screen</dt><dd><code>' + esc(s.screen) + '</code> in the sketch</dd>';
    meta += '<dt>From</dt><dd>' + (into.length ? into.map((o) => stepRef(o.id)).join('<br>') : 'the start') + '</dd>';
    meta += '<dt>Then</dt><dd>' + ((s.next || []).length ? s.next.map((n) => (n.when ? '<em>' + esc(n.when) + '</em> → ' : '') + (n.label ? '[' + esc(n.label) + '] ' : '') + stepRef(n.to)).join('<br>') : 'the flow ends') + '</dd>';
    if (wasHtml(s)) meta += '<dt>Was</dt><dd>' + wasHtml(s) + '</dd>';
    meta += '</dl>';
    const fails = (s.fails || []).length ? '<h3 style="margin:14px 0 6px;font:600 13px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em">If it fails</h3>' + rows(s.fails, (f) => [esc(f.what), '<span class="flagcell">→</span>', esc(f.recovery)]) : (kind === 'async' || kind === 'external' ? '<p class="empty">No failure path declared for a step that can fail.</p>' : '');
    const guar = held.length ? '<h3 style="margin:14px 0 6px;font:600 13px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Holds</h3>' + rows(held, (g) => [esc(g.id), esc(g.text), '']) : '';
    inspector.innerHTML = '<div class="head"><div><h2>' + stepNo.get(s.id) + '. ' + esc(s.text) + changePill(s) + '</h2><p>' + esc(laneName(s.lane)) + ' · ' + kindLabel[kind] + '</p></div><span class="pill">STEP</span></div>' +
      (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') + meta + fails + guar;
  }

  // ---- toolbar ----
  const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); };
  document.getElementById('copyAscii').addEventListener('click', () => {
    const text = document.getElementById('asciiOut').textContent;
    const fallback = () => { document.querySelector('details.ascii').open = true; toast('Clipboard unavailable: the text is open below'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Text form copied'), fallback); else fallback();
  });
  const themeBtn = document.getElementById('theme'), themes = ['auto', 'light', 'dark'];
  let theme = 'auto'; const hostTheme = document.documentElement.dataset.theme;
  try { theme = themes.includes(localStorage.getItem('flow-map-theme')) ? localStorage.getItem('flow-map-theme') : 'auto'; } catch (e) { /* blocked */ }
  const applyTheme = () => {
    if (theme !== 'auto') document.documentElement.dataset.theme = theme; else if (hostTheme) document.documentElement.dataset.theme = hostTheme; else delete document.documentElement.dataset.theme;
    themeBtn.textContent = 'Theme: ' + theme;
  };
  themeBtn.addEventListener('click', () => { theme = themes[(themes.indexOf(theme) + 1) % themes.length]; try { localStorage.setItem('flow-map-theme', theme); } catch (e) { /* ignore */ } applyTheme(); });
  applyTheme();

  drawEdges();
  const initial = decodeURIComponent(location.hash.slice(1));
  if (initial && (stepById.has(initial) || laneById.has(initial))) select(initial); else if (steps[0]) select(steps[0].id);
})();
</script>
</body>
